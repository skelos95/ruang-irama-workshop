name: Run direct camera rotation patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run direct camera rotation patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply direct camera rotation patch
        run: python .github/scripts/remove_camera_wave.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop README.md .github/scripts/remove_camera_wave.py .github/workflows/run-remove-camera-wave.yml
          git diff --cached --check
          git commit -m "Make third-person rotation direct and wave-free"
          git push
