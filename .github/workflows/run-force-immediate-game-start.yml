name: Run immediate game mode start

on:
  push:
    paths:
      - '.github/workflows/run-force-immediate-game-start.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply immediate start rule
        run: python .github/scripts/force_immediate_game_start.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Start game modes immediately"
          git push
