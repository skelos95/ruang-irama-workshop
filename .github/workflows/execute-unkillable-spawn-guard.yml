name: Execute corrected Unkillable Spawn guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/execute-unkillable-spawn-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute corrected patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/guard-unkillable-spawn-room.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("          PY\n", start)
          lines = wf[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          script = script.replace(
              '                "Else If(Event Player.HalamanMenu == 5);",\n',
              '                "Event Player.HalamanMenu == 5;",\n',
          )
          Path('/tmp/apply_spawn_guard.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_spawn_guard.py
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/VALIDAZIONE.md
          git commit -m "Disable Unkillable in Spawn Rooms"
          git push origin HEAD:main
