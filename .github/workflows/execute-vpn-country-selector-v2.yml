name: Retry localized VPN selector patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/execute-vpn-country-selector-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute corrected patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/apply-vpn-country-selector.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("          PY\n", start)
          lines = wf[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          old = 'Custom String("SERVER VPN: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN]),'
          new = 'Player Variable(Local Player, IndeksBahasa) == 2 ? Custom String("เซิร์ฟเวอร์ VPN: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN]) : Custom String("SERVER VPN: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN]),'
          script = script.replace(old, new)
          validator_old = "'Custom String(\"SERVER VPN: {0}\", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source,"
          validator_new = "'Custom String(\"SERVER VPN: {0}\", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source and 'Custom String(\"เซิร์ฟเวอร์ VPN: {0}\", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source,"
          script = script.replace(validator_old, validator_new)
          Path('/tmp/apply_vpn.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_vpn.py
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/PROGETTO.md docs/VALIDAZIONE.md
          git commit -m "Add configurable NordVPN country display"
          git push origin HEAD:main
