name: Build Crouch Teleport Attach

on:
  push:
    branches:
      - chatgpt-crouch-attach
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt-crouch-attach
          fetch-depth: 0

      - name: Apply feature patch and remove temporary tooling
        run: |
          python tools/chatgpt_crouch_attach_patch.py
          git rm .github/workflows/chatgpt-crouch-attach.yml tools/chatgpt_crouch_attach_patch.py
          python -m py_compile tests/test_validate_workshop.py tests/test_runtime_maintenance.py tools/validate_workshop.py

      - name: Validate Workshop source
        run: python tools/validate_workshop.py

      - name: Run focused runtime tests
        run: python -m unittest tests.test_runtime_maintenance tests.test_dummy_bots

      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT

      - name: Run full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit validated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tests/test_validate_workshop.py tests/test_runtime_maintenance.py CHANGELOG.md
          git commit -m "Add Crouch Teleport attach mode"
          git push origin HEAD:chatgpt-crouch-attach
