name: Build Crouch Teleport Attach

on:
  push:
    branches:
      - chatgpt-crouch-attach
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt-crouch-attach
          fetch-depth: 0

      - name: Apply, validate, test, and publish result
        shell: bash
        run: |
          set +e
          LOG=/tmp/crouch-attach-ci.log
          : > "$LOG"

          python - <<'PY'
          from pathlib import Path
          p = Path('tools/chatgpt_crouch_attach_patch.py')
          s = p.read_text(encoding='utf-8')
          old = '''test = replace_once(
              test,
              'self.assert_rejected(mutated, "cache target dummy: filtro deve essere l\\'umano nemico vivo opt-in")',
              'self.assert_rejected(mutated, "cache target dummy deve filtrare gli umani opt-in una sola volta per ciclo")',
              "stale dummy cache error expectation",
          )'''
          new = '''method_name = "test_native_dummy_cache_respects_per_player_follow_opt_out"
          method_start = test.index(f"    def {method_name}(self")
          method_end = test.find("\\n    def ", method_start + 1)
          if method_end < 0:
              method_end = len(test)
          method_block = test[method_start:method_end]
          old_expectation = 'self.assert_rejected(mutated, "cache target dummy: filtro deve essere l\\'umano nemico vivo opt-in")'
          new_expectation = 'self.assert_rejected(mutated, "cache target dummy deve filtrare gli umani opt-in una sola volta per ciclo")'
          if method_block.count(old_expectation) != 1:
              raise RuntimeError("targeted stale dummy-cache expectation missing")
          method_block = method_block.replace(old_expectation, new_expectation, 1)
          test = test[:method_start] + method_block + test[method_end:]'''
          if old not in s:
              raise SystemExit('temporary patcher test hot-fix anchor missing')
          s = s.replace(old, new, 1)
          for a, b in (
              ('Attached above {0}. RELOAD detaches.', 'Attached above {{0}}. RELOAD detaches.'),
              ('Menempel di atas {0}. RELOAD untuk lepas.', 'Menempel di atas {{0}}. RELOAD untuk lepas.'),
              ('เกาะอยู่เหนือ {0} กดรีโหลดเพื่อปล่อย', 'เกาะอยู่เหนือ {{0}} กดรีโหลดเพื่อปล่อย'),
          ):
              if a not in s:
                  raise SystemExit(f'attach message hot-fix anchor missing: {a}')
              s = s.replace(a, b, 1)
          p.write_text(s, encoding='utf-8')
          PY

          run_gate() {
            echo "===== $1 =====" | tee -a "$LOG"
            shift
            "$@" >>"$LOG" 2>&1
            rc=$?
            echo "exit=$rc" | tee -a "$LOG"
            return $rc
          }

          failed=0
          run_gate PATCH python tools/chatgpt_crouch_attach_patch.py || failed=1
          if [ "$failed" -eq 0 ]; then
            run_gate PYCOMPILE python -m py_compile tests/test_validate_workshop.py tests/test_runtime_maintenance.py tools/validate_workshop.py || failed=1
          fi
          if [ "$failed" -eq 0 ]; then
            echo "===== TELEPORT CLICK VALIDATOR CONTEXT =====" >> "$LOG"
            python - <<'PY' >> "$LOG" 2>&1
          from pathlib import Path
          s = Path('tools/validate_workshop.py').read_text(encoding='utf-8')
          needle = 'destinazione teleport non viene valutata al click'
          i = s.index(needle)
          print(s[max(0, i-1800):min(len(s), i+1200)])
          PY
            rm -f .github/workflows/chatgpt-crouch-attach.yml
            run_gate VALIDATOR python tools/validate_workshop.py || failed=1
          fi
          if [ "$failed" -eq 0 ]; then
            run_gate FOCUSED python -m unittest tests.test_runtime_maintenance tests.test_dummy_bots || failed=1
          fi
          if [ "$failed" -eq 0 ]; then
            run_gate CLIPBOARD python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT || failed=1
          fi
          if [ "$failed" -eq 0 ]; then
            run_gate FULL_SUITE python -m unittest discover -s tests -p 'test_*.py' || failed=1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$failed" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            cp "$LOG" chatgpt-crouch-attach-ci.log
            git add chatgpt-crouch-attach-ci.log
            git commit -m "Record Crouch Teleport build failure"
            git push origin HEAD:chatgpt-crouch-attach
            cat "$LOG"
            exit 1
          fi

          git rm .github/workflows/chatgpt-crouch-attach.yml tools/chatgpt_crouch_attach_patch.py
          git rm -f chatgpt-crouch-attach-ci.log 2>/dev/null || true
          git add workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tests/test_validate_workshop.py tests/test_runtime_maintenance.py CHANGELOG.md
          git commit -m "Add Crouch Teleport attach mode"
          git push origin HEAD:chatgpt-crouch-attach
          cat "$LOG"
