name: Inspect Crouch Teleport

on:
  push:
    branches:
      - chatgpt-crouch-attach
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dump forcing position references
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['workshop/ruang_irama.it-IT.workshop','tests/fixtures/semantic_reference.txt','tools/validate_workshop.py','tests/test_validate_workshop.py']:
              print('\n===== '+fn+' =====')
              for i,line in enumerate(Path(fn).read_text(encoding='utf-8').splitlines(),1):
                  if 'Forcing' in line or 'forcing' in line:
                      print(f'{i}: {line}')
          PY
