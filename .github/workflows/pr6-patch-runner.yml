name: Temporary PR 6 Patch Runner

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/workshop-ui-luck-vote'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/workshop-ui-luck-vote
          persist-credentials: true

      - name: Apply guarded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('workshop/ruang_irama.workshop')
          validator_path = Path('tools/validate_workshop.py')
          tests_path = Path('tests/test_validate_workshop.py')
          source = source_path.read_text(encoding='utf-8')
          validator = validator_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          rule_start = source.index('rule("98 - Subrutin: Cari target teleport publik terdekat dari bidikan")')
          next_rule = source.find('\nrule("', rule_start + 1)
          assert next_rule > rule_start
          segment = source[rule_start:next_rule]
          line_start = segment.index('\t\tEvent Player.DaftarTargetTeleportasi = Filtered Array')
          line_end = segment.index(';', line_start)
          statement = segment[line_start:line_end + 1]
          balance = statement.count('(') - statement.count(')')
          if balance == 1:
              segment = segment[:line_start] + statement[:-1] + ');' + segment[line_end + 1:]
              source = source[:rule_start] + segment + source[next_rule:]
          else:
              assert balance == 0, f'unexpected Teleport balance: {balance}'

          completion = 'Disable Built-In Game Mode Completion;'
          if completion not in source:
              anchor = '\t\tDisable Built-In Game Mode Music;\n'
              assert source.count(anchor) == 1
              source = source.replace(anchor, anchor + '\t\tDisable Built-In Game Mode Completion;\n', 1)
          assert source.count(completion) == 1

          old_comment = '"Skrip tidak memberi skor atau pemenang; Push, Flashpoint, Capture The Flag, Control, Clash, Hybrid, Escort, dan Assault tetap memakai hasil mode asli."'
          new_comment = '"Skor dan objektif tetap milik mode asli; penyelesaian pertandingan ditahan sampai penghitung waktu CHILL habis."'
          if old_comment in source:
              source = source.replace(old_comment, new_comment, 1)
          else:
              assert new_comment in source

          forbidden_line = '    "Disable Built-In Game Mode Completion;",\n'
          if forbidden_line in validator:
              assert validator.count(forbidden_line) == 1
              validator = validator.replace(forbidden_line, '', 1)

          required_check = '    checks.equal(source.count("Disable Built-In Game Mode Completion;"), 1, "blocco completamento nativo fino al timer CHILL")\n'
          if required_check not in validator:
              anchor = '    for token in FORBIDDEN_RESULT_ACTIONS:\n        checks.require(token not in source, f"risultato deve restare alla modalità nativa: {token}")\n'
              assert validator.count(anchor) == 1
              validator = validator.replace(anchor, anchor + required_check, 1)

          old_message = '"HUD titolo CHILL conserva una riga vuota finale prima del menu",'
          new_message = '"HUD titolo CHILL deve mantenere una riga vuota prima del menu",'
          if old_message in validator:
              idx = validator.index(old_message)
              block_start = validator.rfind('        checks.require(', 0, idx)
              block_end = validator.index('\n        )', idx) + len('\n        )')
              block = validator[block_start:block_end]
              assert block_start >= 0 and 'not any(' in block and 'title_literals' in block
              block = block.replace('not any(', 'any(', 1).replace(old_message, new_message, 1)
              validator = validator[:block_start] + block + validator[block_end:]
          else:
              assert new_message in validator

          old_test = '    def test_chill_title_cannot_end_with_a_blank_spacer_line(self) -> None:\n'
          next_test = '    def test_primary_secondary_must_not_redraw_menu(self) -> None:\n'
          if old_test in tests:
              start = tests.index(old_test)
              end = tests.index(next_test, start)
              replacement = '''    def test_chill_title_requires_a_blank_spacer_line(self) -> None:\n        call = next(\n            call for call in validator.iter_calls(self.source, "Create HUD Text")\n            if len(call.args) >= 4\n            and "CHILL DEDICATED SERVER" in call.args[3]\n            and "Global.TeksWaktuServer" in call.args[3]\n        )\n        changed_argument = call.args[3].replace(r"\\n ", "", 1)\n        self.assertNotEqual(changed_argument, call.args[3])\n        mutated = self.replace_call_argument(call, 3, changed_argument)\n        self.assert_rejected(mutated, "riga vuota prima del menu")\n\n'''
              tests = tests[:start] + replacement + tests[end:]
          else:
              assert 'def test_chill_title_requires_a_blank_spacer_line' in tests

          test_name = '    def test_builtin_completion_is_disabled_exactly_once(self) -> None:\n'
          if test_name not in tests:
              marker = '\n\nif __name__ == "__main__":\n'
              assert tests.count(marker) == 1
              addition = '''\n    def test_builtin_completion_is_disabled_exactly_once(self) -> None:\n        token = "Disable Built-In Game Mode Completion;"\n        self.assertEqual(self.source.count(token), 1)\n        mutated = self.source.replace(token, "", 1)\n        self.assert_rejected(mutated, "completamento nativo fino al timer CHILL")\n        mutated = self.source.replace(token, token + "\\n\\t\\t" + token, 1)\n        self.assert_rejected(mutated, "completamento nativo fino al timer CHILL")\n'''
              tests = tests.replace(marker, addition + marker, 1)

          source_path.write_text(source, encoding='utf-8')
          validator_path.write_text(validator, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- workshop/ruang_irama.workshop tools/validate_workshop.py tests/test_validate_workshop.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix custom match completion and validation gates'
          git push origin HEAD:chatgpt/workshop-ui-luck-vote
