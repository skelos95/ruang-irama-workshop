name: Temporary finish permanent roster validation

on:
  push:
    branches:
      - fix-permanent-global-roster-v3-20260827

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Finish validator alignment
        run: python .github/maintenance/tmp_finish_permanent_roster_validator.py
      - name: Remove all temporary diagnostic files
        run: |
          rm -f .github/workflows/tmp-finish-permanent-roster-validator.yml
          rm -f .github/workflows/tmp-inspect-permanent-roster-validator.yml
          rm -f .github/maintenance/tmp_finish_permanent_roster_validator.py
          rmdir .github/maintenance 2>/dev/null || true
      - name: Commit clean validation alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_workshop.py .github
          git commit -m 'Finish permanent global roster validation'
          git push origin HEAD:fix-permanent-global-roster-v3-20260827
      - name: Run focused permanent roster tests
        run: |
          python -m unittest \
            tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_permanent_roster_rows_live_in_global_init_and_player_rule_only_binds \
            tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_team_switch_entity_adopts_reserved_slot_before_fresh_allocation
      - name: Validate Workshop source
        run: python tools/validate_workshop.py
      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
