name: Run camera refresh on hero change

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run camera refresh on hero change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply camera hero-change refresh
        run: python .github/scripts/refresh_camera_on_hero_change.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/refresh_camera_on_hero_change.py .github/workflows/run-refresh-camera-on-hero-change.yml
          git diff --cached --check
          git commit -m "Refresh third-person camera when hero changes"
          git push
