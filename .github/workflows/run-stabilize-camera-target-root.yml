name: Run stable target-root third-person camera

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run stable target-root third-person camera'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply target-root stabilization
        run: python .github/scripts/stabilize_camera_target_root.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/stabilize_camera_target_root.py .github/workflows/run-stabilize-camera-target-root.yml
          git diff --cached --check
          git commit -m "Stabilize third-person target root"
          git push
