name: Temporary Ghost Mode implementation

on:
  push:
    branches:
      - audit-ghost-menu13-20260827

permissions:
  contents: write

concurrency:
  group: tmp-ghost-menu13
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply Ghost Mode and audit cleanup
        run: python .github/maintenance/tmp_apply_ghost_menu13.py

      - name: Remove temporary maintenance files before validation
        run: |
          rm -f .github/maintenance/tmp_audit_ghost_menu13.py
          rm -f .github/maintenance/tmp_apply_ghost_menu13.py
          rm -f .github/workflows/tmp-audit-ghost-menu13.yml
          rm -f .github/workflows/tmp-apply-ghost-menu13.yml
          rmdir .github/maintenance 2>/dev/null || true

      - name: Run full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Workshop source
        run: python tools/validate_workshop.py

      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add Ghost Mode menu and audit Workshop runtime"
          git push origin HEAD:audit-ghost-menu13-20260827
