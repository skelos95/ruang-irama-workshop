name: Temporary apply Ghost Mode menu 13

on:
  push:
    branches:
      - audit-ghost-menu13-20260827

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Correct patcher assumptions
        run: |
          sed -i 's/\\t\\t57: CariPosisiTeleportAman/\\t57: CariPosisiTeleportAman/g; s/\\t\\t58: GambarGhost/\\t58: GambarGhost/g; s/\\t\\t59: TerapkanHalamanGhost/\\t59: TerapkanHalamanGhost/g' .github/maintenance/tmp_apply_ghost_menu13.py
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/maintenance/tmp_apply_ghost_menu13.py')
          s = p.read_text()
          old = '    if text.count(old) != 1:\n        raise RuntimeError(f"non-unique token for {label}: {text.count(old)}")\n'
          new = '    if label == "profile ghost cursor" and text.count(old) == 2:\n        return text.replace(old, new, 1)\n    if text.count(old) != 1:\n        raise RuntimeError(f"non-unique token for {label}: {text.count(old)}")\n'
          if old not in s:
              raise SystemExit('replace_once guard not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply patch
        run: PYTHONPATH=. python .github/maintenance/tmp_apply_ghost_menu13.py
      - name: Remove temporary helpers
        run: |
          rm .github/workflows/tmp-audit-ghost-menu13.yml
          rm .github/workflows/tmp-apply-ghost-menu13.yml
          rm .github/maintenance/tmp_audit_ghost_menu13.py
          rm .github/maintenance/tmp_apply_ghost_menu13.py
          rmdir .github/maintenance 2>/dev/null || true
      - name: Commit clean functional patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workshop tests tools README.md CHANGELOG.md docs .github
          git commit -m 'Add Ghost Mode menu and clean dead roster state'
          git push origin HEAD:audit-ghost-menu13-20260827
      - name: Run Ghost regression tests
        run: python -m unittest tests.test_ghost_mode
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Workshop source
        run: python tools/validate_workshop.py
      - name: Preflight Italian clipboard source
        run: python tools/preflight_workshop_it.py
