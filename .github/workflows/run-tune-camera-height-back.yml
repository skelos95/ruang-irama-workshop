name: Run third-person height and distance tuning

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run third-person height and distance tuning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply camera tuning
        run: python .github/scripts/tune_camera_height_back.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/tune_camera_height_back.py .github/workflows/run-tune-camera-height-back.yml
          git diff --cached --check
          git commit -m "Tune third-person camera height and distance"
          git push
