name: Build Crouch Travel Labels

on:
  push:
    branches:
      - chatgpt-crouch-labels
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt-crouch-labels
          fetch-depth: 0

      - name: Apply patch
        run: python tools/chatgpt_crouch_labels_patch.py

      - name: Remove temporary build files before validation
        run: git rm tools/chatgpt_crouch_labels_patch.py .github/workflows/chatgpt-crouch-labels-build.yml

      - name: Python syntax
        run: python -m py_compile tests/test_runtime_maintenance.py tools/validate_workshop.py

      - name: Validate Workshop source
        run: python tools/validate_workshop.py

      - name: Focused runtime tests
        run: python -m unittest tests.test_runtime_maintenance

      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT

      - name: Full regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Publish clean feature tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify Crouch Travel HUD and detach command"
          git push origin HEAD:chatgpt-crouch-labels
