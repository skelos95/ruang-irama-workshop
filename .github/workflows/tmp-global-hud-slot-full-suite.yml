name: Temporary global HUD slot full suite

on:
  push:
    branches:
      - tmp-global-hud-slot-20260826

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Hide temporary workflow from repository checks
        run: rm .github/workflows/tmp-global-hud-slot-full-suite.yml
      - name: Run full validator unit suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Workshop source
        run: python tools/validate_workshop.py
      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
