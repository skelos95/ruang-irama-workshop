name: Run rigid third-person stabilization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run rigid third-person stabilization patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply camera stabilization
        run: python .github/scripts/stabilize_third_person.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop README.md .github/scripts/stabilize_third_person.py .github/workflows/run-stabilize-third-person.yml
          git diff --cached --check
          git commit -m "Stabilize third-person movement tracking"
          git push
