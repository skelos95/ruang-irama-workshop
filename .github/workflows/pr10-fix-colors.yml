name: Temporary PR 10 Color Literal Fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 10 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/italian-color-literals'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/italian-color-literals
          persist-credentials: true

      - name: Check out pinned OverPy palette
        uses: actions/checkout@v4
        with:
          repository: Zezombye/overpy
          ref: d854bf01fc7bbf3b2169f67408c07a8da8989ad6
          path: .overpy
          persist-credentials: false

      - name: Replace named Color literals with RGB
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          constants = Path('.overpy/src/data/constants.ts').read_text(encoding='utf-8')

          def matching_brace(text: str, opening: int) -> int:
              depth = 0
              in_string = False
              escaped = False
              for i in range(opening, len(text)):
                  ch = text[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
              raise RuntimeError('unclosed brace in constants.ts')

          marker = constants.index('"ColorLiteral"')
          opening = constants.index('{', marker)
          closing = matching_brace(constants, opening)
          block = constants[opening + 1:closing]

          field = lambda body, key: re.search(
              rf'"{re.escape(key)}"\s*:\s*("(?:[^"\\]|\\.)*"|-?\d+(?:\.\d+)?)',
              body,
          )
          entry_re = re.compile(r'"([A-Z0-9_]+)"\s*:\s*\{')
          palette = {}
          pos = 0
          while True:
              m = entry_re.search(block, pos)
              if not m:
                  break
              entry_open = block.index('{', m.start(), m.end())
              entry_close = matching_brace(block, entry_open)
              body = block[entry_open + 1:entry_close]
              name_m = field(body, 'en-US')
              red_m = field(body, 'red')
              green_m = field(body, 'green')
              blue_m = field(body, 'blue')
              alpha_m = field(body, 'alpha')
              if name_m and red_m and green_m and blue_m:
                  name = bytes(name_m.group(1)[1:-1], 'utf-8').decode('unicode_escape')
                  palette[name] = (
                      red_m.group(1), green_m.group(1), blue_m.group(1),
                      alpha_m.group(1) if alpha_m else '255',
                  )
              pos = entry_close + 1

          path = Path('workshop/ruang_irama.it-IT.workshop')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(r'(?<!Custom )\bColor\(([^()\n]+)\)')
          names = pattern.findall(source)
          unknown = sorted(set(names) - set(palette))
          if unknown:
              raise SystemExit(f'Unknown named Color literals: {unknown}; palette has {sorted(palette)}')

          def repl(match: re.Match[str]) -> str:
              r, g, b, a = palette[match.group(1)]
              return f'Custom Color({r}, {g}, {b}, {a})'

          output, count = pattern.subn(repl, source)
          if pattern.search(output):
              raise SystemExit('Named Color literal survived conversion')
          if count == 0:
              raise SystemExit('No named Color literals found to convert')
          path.write_text(output, encoding='utf-8')

          tests = Path('tests/test_clipboard_import.py')
          text = tests.read_text(encoding='utf-8')
          old = '''        self.assertIn("Color(White)", self.italian)\n        self.assertNotIn("Color(Bianco)", self.italian)\n        self.assertIn("Color(Yellow)", self.italian)\n        self.assertNotIn("Color(Giallo)", self.italian)\n'''
          new = '''        without_custom_colors = self.italian.replace("Custom Color(", "")\n        self.assertNotIn("Color(", without_custom_colors)\n'''
          if old not in text:
              raise SystemExit('Expected Color assertions not found')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8')

          marker_file = Path('docs/ITALIAN_COLOR_LITERAL_FIX.md')
          if marker_file.exists():
              marker_file.unlink()

          print(f'Converted {count} named Color literals to explicit RGBA values')
          print('Names converted:', ', '.join(sorted(set(names))))
          PY

          python tools/check_clipboard_import.py
          python -m unittest tests.test_clipboard_import

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- workshop/ruang_irama.it-IT.workshop tests/test_clipboard_import.py docs/ITALIAN_COLOR_LITERAL_FIX.md
          git diff --cached --quiet && exit 0
          git commit -m 'Replace named Workshop colors with explicit RGBA'
          git push origin HEAD:chatgpt/italian-color-literals
