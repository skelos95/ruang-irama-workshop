name: Execute Unkillable Spawn guard v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/execute-unkillable-spawn-guard-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute patch with corrected static check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/guard-unkillable-spawn-room.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("          PY\n", start)
          lines = wf[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          append = r'''
val = validator_path.read_text(encoding='utf-8')
pattern = re.compile(
    r'    interact_handlers = rules_containing\(rules, "Event Player\.PerintahMenu == 1;"\).*?'
    r'            "Unkillable: menu 5 non bloccato nella Spawn Room",\n        \)\n',
    re.DOTALL,
)
replacement = '''    checks.require(
        "Else If(Event Player.HalamanMenu == 5);" in source
        and "If(Is In Spawn Room(Event Player) == True);" in source
        and "Event Player.HalamanMenu = -1;" in source
        and "Unkillable + 1 HP is unavailable in the Spawn Room." in source,
        "Unkillable: menu 5 non bloccato nella Spawn Room",
    )
'''
val, count = pattern.subn(replacement, val, count=1)
if count != 1:
    raise SystemExit(f'validator interact guard replacement: expected 1, found {count}')
validator_path.write_text(val, encoding='utf-8')
'''
          script += append
          Path('/tmp/apply_spawn_guard_v2.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_spawn_guard_v2.py
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/VALIDAZIONE.md
          git commit -m "Disable Unkillable in Spawn Rooms"
          git push origin HEAD:main
