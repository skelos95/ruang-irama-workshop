# Trigger after workflow registration
name: Execute Unkillable Spawn guard v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/execute-unkillable-spawn-guard-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Spawn Room source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/guard-unkillable-spawn-room.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("          PY\n", start)
          lines = wf[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_spawn_guard.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_spawn_guard.py
      - name: Simplify Spawn Room validator check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/validate_workshop.py')
          val = path.read_text(encoding='utf-8')
          func = val.index('def check_arcade_features(')
          start = val.index('    interact_handlers = rules_containing(rules, "Event Player.PerintahMenu == 1;")', func)
          end = val.index('    spawn_disable = [', start)
          new = '''    checks.require(\n        "Else If(Event Player.HalamanMenu == 5);" in source\n        and "If(Is In Spawn Room(Event Player) == True);" in source\n        and "Event Player.HalamanMenu = -1;" in source\n        and "Unkillable + 1 HP is unavailable in the Spawn Room." in source,\n        "Unkillable: menu 5 non bloccato nella Spawn Room",\n    )\n'''
          val = val[:start] + new + val[end:]
          path.write_text(val, encoding='utf-8')
          PY
      - name: Validate and push
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/VALIDAZIONE.md
          git commit -m "Disable Unkillable in Spawn Rooms"
          git push origin HEAD:main
