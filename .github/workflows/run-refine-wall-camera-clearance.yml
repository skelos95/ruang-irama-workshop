name: Run safer wall camera clearance

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run safer wall camera clearance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply safer wall camera clearance
        run: python .github/scripts/refine_wall_camera_clearance.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/refine_wall_camera_clearance.py .github/workflows/run-refine-wall-camera-clearance.yml
          git diff --cached --check
          git commit -m "Refine wall camera clearance"
          git push
