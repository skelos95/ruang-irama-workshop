name: Run clean direct third-person camera

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run clean direct third-person camera'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply clean direct camera
        run: python .github/scripts/simplify_third_person_camera.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/simplify_third_person_camera.py .github/workflows/run-simplify-third-person-camera.yml
          git diff --cached --check
          git commit -m "Simplify third-person camera"
          git push
