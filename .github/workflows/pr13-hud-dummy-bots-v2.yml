name: Temporary PR 13 HUD Dummy Bots v2

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/hud-dummy-bots'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/hud-dummy-bots
          persist-credentials: true

      - name: Apply guarded patch
        shell: bash
        run: |
          python tools/apply_pr13_patch.py
          python tools/check_clipboard_import.py
          python -m unittest tests.test_dummy_bots tests.test_clipboard_import

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tests/test_dummy_bots.py docs/HUD_DUMMY_BOTS_WORK.md tools/apply_pr13_patch.py
          git diff --cached --quiet && exit 0
          git commit -m 'Align Player Vibes and add team dummy bots'
          git push origin HEAD:chatgpt/hud-dummy-bots
