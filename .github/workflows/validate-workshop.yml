name: Apply Roster Lifecycle Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: roster-lifecycle-fix-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Remove lifecycle load gate
        run: python .github/maintenance/remove_roster_load_gate.py

      - name: Run focused regression tests
        run: |
          python -m unittest \
            tests.test_runtime_maintenance \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_official_source_passes_all_semantic_checks \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_global_lifecycle_dispatch_excludes_classified_ibots

      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tests/test_runtime_maintenance.py tools/validate_workshop.py docs/VALIDAZIONE.md docs/PROGETTO.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No lifecycle changes to commit."
            exit 0
          fi
          git commit -m "Unblock roster refresh under server load"
          git push origin HEAD:main
