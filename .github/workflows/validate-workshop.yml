name: Apply Persistent Player Lifecycle Patch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: persistent-player-lifecycle-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply persistent lifecycle patch
        run: python tools/apply_persistent_lifecycle.py

      - name: Run targeted semantic regressions
        run: |
          python -m unittest \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_official_source_passes_all_semantic_checks \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_native_match_time_is_paused_until_chill_restart \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_leave_distinguishes_team_switch_from_true_exit \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_rejoin_requires_persistent_profile_restore

      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT

      - name: Commit persistent lifecycle patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tools/validate_workshop.py tests/test_validate_workshop.py docs/VALIDAZIONE.md CHANGELOG.md
          git commit -m "Persist player identity across team changes"
          git push origin HEAD:main
