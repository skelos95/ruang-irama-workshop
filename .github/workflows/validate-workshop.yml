name: Validate Workshop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-pr15:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR 15 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/fix-dummy-objective-teleport
          persist-credentials: true

      - name: Patch dummy teleport destinations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, marker):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected one old block')
                  text = text.replace(old, new, 1)
                  path.write_text(text, encoding='utf-8')
              elif marker not in text:
                  raise SystemExit(f'{path}: safe block not found')

          it_old = '''\tazioni
\t{
\t\tIf(Count Of(All Players On Objective(All Teams)) > 0);
\t\t\tTeleport(Event Player, Position Of(First Of(All Players On Objective(All Teams))));
\t\tElse;
\t\t\tTeleport(Event Player, Objective Position(Objective Index));
\t\tEnd;
\t}
'''
          it_new = '''\tazioni
\t{
\t\tIf(Or(Current Game Mode == Game Mode(Trasporto), Current Game Mode == Game Mode(Ibrida)));
\t\t\tIf(Distance Between(Payload Position, Vector(0, 0, 0)) > 0.100);
\t\t\t\tTeleport(Event Player, Nearest Walkable Position(Payload Position + Vector(2, 0, 0)));
\t\t\tEnd;
\t\tElse If(Current Game Mode == Game Mode(Cattura la Bandiera));
\t\t\tIf(Distance Between(Flag Position(Opposite Team Of(Team Of(Event Player))), Vector(0, 0, 0)) > 0.100);
\t\t\t\tTeleport(Event Player, Nearest Walkable Position(Flag Position(Opposite Team Of(Team Of(Event Player))) + Vector(2, 0, 0)));
\t\t\tEnd;
\t\tElse If(Current Game Mode == Game Mode(Scorta));
\t\t\tIf(Count Of(Filtered Array(All Players(All Teams), And(Has Spawned(Current Array Element) == True, And(Is Alive(Current Array Element) == True, Is On Objective(Current Array Element) == True)))) > 0);
\t\t\t\tTeleport(Event Player, Nearest Walkable Position(Position Of(First Of(Filtered Array(All Players(All Teams), And(Has Spawned(Current Array Element) == True, And(Is Alive(Current Array Element) == True, Is On Objective(Current Array Element) == True))))) + Vector(2, 0, 0)));
\t\t\tElse If(Distance Between(Objective Position(Objective Index), Vector(0, 0, 0)) > 0.100);
\t\t\t\tTeleport(Event Player, Nearest Walkable Position(Objective Position(Objective Index)));
\t\t\tEnd;
\t\tElse If(Distance Between(Objective Position(Objective Index), Vector(0, 0, 0)) > 0.100);
\t\t\tTeleport(Event Player, Nearest Walkable Position(Objective Position(Objective Index)));
\t\tEnd;
\t}
'''
          en_old = '''\tactions
\t{
\t\tIf(Count Of(All Players On Objective(All Teams)) > 0);
\t\t\tTeleport(Event Player, Position Of(First Of(All Players On Objective(All Teams))));
\t\tElse;
\t\t\tTeleport(Event Player, Objective Position(Objective Index));
\t\tEnd;
\t}
'''
          en_new = '''\tactions
\t{
\t\tIf(Or(Current Game Mode == Game Mode(Escort), Current Game Mode == Game Mode(Hybrid)));
\t\t\tIf(Distance Between(Payload Position, Vector(0, 0, 0)) > 0.100);
\t\t\t\tTeleport(Event Player, Nearest Walkable Position(Payload Position + Vector(2, 0, 0)));
\t\t\tEnd;
\t\tElse If(Current Game Mode == Game Mode(Capture The Flag));
\t\t\tIf(Distance Between(Flag Position(Opposite Team Of(Team Of(Event Player))), Vector(0, 0, 0)) > 0.100);
\t\t\t\tTeleport(Event Player, Nearest Walkable Position(Flag Position(Opposite Team Of(Team Of(Event Player))) + Vector(2, 0, 0)));
\t\t\tEnd;
\t\tElse If(Current Game Mode == Game Mode(Push));
\t\t\tIf(Count Of(Filtered Array(All Players(All Teams), And(Has Spawned(Current Array Element) == True, And(Is Alive(Current Array Element) == True, Is On Objective(Current Array Element) == True)))) > 0);
\t\t\t\tTeleport(Event Player, Nearest Walkable Position(Position Of(First Of(Filtered Array(All Players(All Teams), And(Has Spawned(Current Array Element) == True, And(Is Alive(Current Array Element) == True, Is On Objective(Current Array Element) == True))))) + Vector(2, 0, 0)));
\t\t\tElse If(Distance Between(Objective Position(Objective Index), Vector(0, 0, 0)) > 0.100);
\t\t\t\tTeleport(Event Player, Nearest Walkable Position(Objective Position(Objective Index)));
\t\t\tEnd;
\t\tElse If(Distance Between(Objective Position(Objective Index), Vector(0, 0, 0)) > 0.100);
\t\t\tTeleport(Event Player, Nearest Walkable Position(Objective Position(Objective Index)));
\t\tEnd;
\t}
'''

          patch(Path('workshop/ruang_irama.it-IT.workshop'), it_old, it_new, 'Game Mode(Cattura la Bandiera)')
          patch(Path('tests/fixtures/semantic_reference.txt'), en_old, en_new, 'Game Mode(Capture The Flag)')
          PY

          python tools/check_clipboard_import.py
          python -m unittest tests.test_dummy_bots tests.test_clipboard_import

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Use safe objective destinations for dummy bots'
          git push origin HEAD:chatgpt/fix-dummy-objective-teleport

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Workshop source
        run: python tools/validate_workshop.py
