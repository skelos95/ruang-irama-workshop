name: Validate Workshop

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-five-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply five-effect candidate
        run: |
          python .github/maintenance/patch.py
          if test -f .github/maintenance/last-patch-error.txt; then
            cat .github/maintenance/last-patch-error.txt >&2
            exit 1
          fi

      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Workshop source
        run: python tools/validate_workshop.py

      - name: Materialize validated result on PR branch
        shell: bash
        run: |
          rm -f .github/maintenance/patch.py
          rm -f .github/maintenance/five_effects_impl.py
          rm -f .github/maintenance/last-patch-error.txt
          git add -A -- workshop tools .github/maintenance
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Apply validated five-effect Try Your Luck redesign"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
