name: Validate Workshop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-robust-dummy:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/robust-dummy-teleport'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/robust-dummy-teleport
          persist-credentials: true

      - name: Apply robust dummy teleport patch
        run: python tools/patch_robust_dummy_teleport.py

      - name: Run regression checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard dummy teleports with floor validation"
          git push origin HEAD:chatgpt/robust-dummy-teleport

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Workshop source
        run: python tools/validate_workshop.py

      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
