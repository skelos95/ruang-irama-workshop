name: Repair Stale Roster Validation Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: repair-stale-roster-test-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Remove obsolete Server Load test guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_validate_workshop.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def test_pending_roster_refresh_requires_stable_guards_and_canonical_handles')
          end = text.index('\n    def ', start + 1)
          block = text[start:end]
          old = '            "Server Load < 150",\n'
          if old not in block:
              raise SystemExit('obsolete guard not found in target test')
          block = block.replace(old, '', 1)
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run repaired regression
        run: |
          python -m unittest \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_pending_roster_refresh_requires_stable_guards_and_canonical_handles \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_official_source_passes_all_semantic_checks

      - name: Commit repaired test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_validate_workshop.py
          if git diff --cached --quiet; then
            echo "No stale test change to commit."
            exit 0
          fi
          git commit -m "Align roster test with load-independent refresh"
          git push origin HEAD:main
