name: Apply prepared UI patch

on:
  push:
    paths:
      - '.github/workflows/validate-workshop.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch and validate
        shell: bash
        run: |
          git fetch origin agent/hero-icons-crouch-ui
          git show origin/agent/hero-icons-crouch-ui:ui-change.patch > /tmp/ui-change.patch
          if git apply --check /tmp/ui-change.patch; then
            git apply /tmp/ui-change.patch
            python3 tools/validate_workshop.py
            git config user.name "OpenAI"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/PROGETTO.md docs/TEST.md
            git commit -m "Add hero icons and simplify crouch inspection"
            git push origin HEAD:main
          else
            echo "Patch already applied or no longer applicable."
          fi
