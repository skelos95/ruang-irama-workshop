name: Temporary PR 13 HUD Dummy Bots

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/hud-dummy-bots'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/hud-dummy-bots
          persist-credentials: true

      - name: Apply HUD and dummy bot update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          italian = Path('workshop/ruang_irama.it-IT.workshop')
          english = Path('tests/fixtures/semantic_reference.txt')

          it = italian.read_text(encoding='utf-8')
          en = english.read_text(encoding='utf-8')

          # Shift only the right-side section title so it visually lines up with the player rows.
          for old, new in [
              ('Custom String("\\n \\nPLAYER VIBES")', 'Custom String("\\n \\n     PLAYER VIBES")'),
              ('Custom String("\\n \\nMUSIK PEMAIN")', 'Custom String("\\n \\n     MUSIK PEMAIN")'),
              ('Custom String("\\n \\nเพลงของผู้เล่น")', 'Custom String("\\n \\n     เพลงของผู้เล่น")'),
          ]:
              if it.count(old) != 1:
                  raise SystemExit(f'Italian HUD anchor count for {old!r}: {it.count(old)}')
              it = it.replace(old, new, 1)
              if en.count(old) != 1:
                  raise SystemExit(f'English fixture HUD anchor count for {old!r}: {en.count(old)}')
              en = en.replace(old, new, 1)

          old_it_03c = '''\tazioni\n\t{\n\t\tCall Subroutine(KunciBot);\n\t}\n}\n\nregola("04 - Pemain Keluar: Tenangkan lalu bersihkan pendaftaran")'''
          new_it_03c = '''\tazioni\n\t{\n\t\tCall Subroutine(KunciBot);\n\t\tIf(Is Dummy Bot(Event Player) == True);\n\t\t\tSet Respawn Max Time(Event Player, 30);\n\t\tEnd;\n\t}\n}\n\nregola("03d - Bot/Dummy: Buat satu bot acak untuk Squadra 1")\n{\n\tevento\n\t{\n\t\tOngoing - Global;\n\t}\n\n\tcondizioni\n\t{\n\t\tGlobale.Siap == True;\n\t\tIs Game In Progress == True;\n\t\tNumber Of Slots(Squadra 1) > 0;\n\t\tCount Of(Filtered Array(All Players(Squadra 1), Is Dummy Bot(Current Array Element) == True)) == 0;\n\t}\n\n\tazioni\n\t{\n\t\tCreate Dummy Bot(Tutti gli eroi, Squadra 1, -1, Null, Null);\n\t}\n}\n\nregola("03e - Bot/Dummy: Buat satu bot acak untuk Squadra 2")\n{\n\tevento\n\t{\n\t\tOngoing - Global;\n\t}\n\n\tcondizioni\n\t{\n\t\tGlobale.Siap == True;\n\t\tIs Game In Progress == True;\n\t\tNumber Of Slots(Squadra 2) > 0;\n\t\tCount Of(Filtered Array(All Players(Squadra 2), Is Dummy Bot(Current Array Element) == True)) == 0;\n\t}\n\n\tazioni\n\t{\n\t\tCreate Dummy Bot(Tutti gli eroi, Squadra 2, -1, Null, Null);\n\t}\n}\n\nregola("03f - Bot/Dummy: Teletrasporta dalla spawn all'obiettivo")\n{\n\tevento\n\t{\n\t\tOngoing - Each Player;\n\t\tTutti;\n\t\tTutti;\n\t}\n\n\tcondizioni\n\t{\n\t\tGlobale.Siap == True;\n\t\tIs Dummy Bot(Event Player) == True;\n\t\tHas Spawned(Event Player) == True;\n\t\tIs Alive(Event Player) == True;\n\t\tIs In Spawn Room(Event Player) == True;\n\t}\n\n\tazioni\n\t{\n\t\tIf(Count Of(All Players On Objective(All Teams)) > 0);\n\t\t\tTeleport(Event Player, Position Of(First Of(All Players On Objective(All Teams))));\n\t\tElse;\n\t\t\tTeleport(Event Player, Objective Position(0));\n\t\tEnd;\n\t}\n}\n\nregola("03g - Bot/Dummy: Guarda sempre il giocatore vivo piu vicino")\n{\n\tevento\n\t{\n\t\tOngoing - Each Player;\n\t\tTutti;\n\t\tTutti;\n\t}\n\n\tcondizioni\n\t{\n\t\tGlobale.Siap == True;\n\t\tIs Dummy Bot(Event Player) == True;\n\t\tHas Spawned(Event Player) == True;\n\t\tIs Alive(Event Player) == True;\n\t\tCount Of(Filtered Array(Globale.PemainManusia, And(Entity Exists(Current Array Element), And(Has Spawned(Current Array Element), Is Alive(Current Array Element))))) > 0;\n\t}\n\n\tazioni\n\t{\n\t\tStart Facing(Event Player, Direction Towards(Eye Position(Event Player), Eye Position(First Of(Sorted Array(Filtered Array(Globale.PemainManusia, And(Entity Exists(Current Array Element), And(Has Spawned(Current Array Element), Is Alive(Current Array Element)))), Distance Between(Event Player, Current Array Element))))), 1000, To World, Direction and Turn Rate);\n\t}\n}\n\nregola("03h - Bot/Dummy: Ferma lo sguardo senza giocatori vivi")\n{\n\tevento\n\t{\n\t\tOngoing - Each Player;\n\t\tTutti;\n\t\tTutti;\n\t}\n\n\tcondizioni\n\t{\n\t\tGlobale.Siap == True;\n\t\tIs Dummy Bot(Event Player) == True;\n\t\tCount Of(Filtered Array(Globale.PemainManusia, And(Entity Exists(Current Array Element), And(Has Spawned(Current Array Element), Is Alive(Current Array Element))))) == 0;\n\t}\n\n\tazioni\n\t{\n\t\tStop Facing(Event Player);\n\t}\n}\n\nregola("03i - Bot/Dummy: Ferma lo sguardo alla morte")\n{\n\tevento\n\t{\n\t\tPlayer Died;\n\t\tTutti;\n\t\tTutti;\n\t}\n\n\tcondizioni\n\t{\n\t\tIs Dummy Bot(Event Player) == True;\n\t}\n\n\tazioni\n\t{\n\t\tStop Facing(Event Player);\n\t}\n}\n\nregola("04 - Pemain Keluar: Tenangkan lalu bersihkan pendaftaran")'''
          if it.count(old_it_03c) != 1:
              raise SystemExit(f'Italian 03c insertion anchor count: {it.count(old_it_03c)}')
          it = it.replace(old_it_03c, new_it_03c, 1)

          old_en_03c = '''\tactions\n\t{\n\t\tCall Subroutine(KunciBot);\n\t}\n}\n\nrule("04 - Pemain Keluar: Tenangkan lalu bersihkan pendaftaran")'''
          new_en_03c = '''\tactions\n\t{\n\t\tCall Subroutine(KunciBot);\n\t\tIf(Is Dummy Bot(Event Player) == True);\n\t\t\tSet Respawn Max Time(Event Player, 30);\n\t\tEnd;\n\t}\n}\n\nrule("03d - Bot/Dummy: Buat satu bot acak untuk Team 1")\n{\n\tevent\n\t{\n\t\tOngoing - Global;\n\t}\n\n\tconditions\n\t{\n\t\tGlobal.Siap == True;\n\t\tIs Game In Progress == True;\n\t\tNumber Of Slots(Team 1) > 0;\n\t\tCount Of(Filtered Array(All Players(Team 1), Is Dummy Bot(Current Array Element) == True)) == 0;\n\t}\n\n\tactions\n\t{\n\t\tCreate Dummy Bot(All Heroes, Team 1, -1, Null, Null);\n\t}\n}\n\nrule("03e - Bot/Dummy: Buat satu bot acak untuk Team 2")\n{\n\tevent\n\t{\n\t\tOngoing - Global;\n\t}\n\n\tconditions\n\t{\n\t\tGlobal.Siap == True;\n\t\tIs Game In Progress == True;\n\t\tNumber Of Slots(Team 2) > 0;\n\t\tCount Of(Filtered Array(All Players(Team 2), Is Dummy Bot(Current Array Element) == True)) == 0;\n\t}\n\n\tactions\n\t{\n\t\tCreate Dummy Bot(All Heroes, Team 2, -1, Null, Null);\n\t}\n}\n\nrule("03f - Bot/Dummy: Teletrasporta dalla spawn all'obiettivo")\n{\n\tevent\n\t{\n\t\tOngoing - Each Player;\n\t\tAll;\n\t\tAll;\n\t}\n\n\tconditions\n\t{\n\t\tGlobal.Siap == True;\n\t\tIs Dummy Bot(Event Player) == True;\n\t\tHas Spawned(Event Player) == True;\n\t\tIs Alive(Event Player) == True;\n\t\tIs In Spawn Room(Event Player) == True;\n\t}\n\n\tactions\n\t{\n\t\tIf(Count Of(All Players On Objective(All Teams)) > 0);\n\t\t\tTeleport(Event Player, Position Of(First Of(All Players On Objective(All Teams))));\n\t\tElse;\n\t\t\tTeleport(Event Player, Objective Position(0));\n\t\tEnd;\n\t}\n}\n\nrule("03g - Bot/Dummy: Guarda sempre il giocatore vivo piu vicino")\n{\n\tevent\n\t{\n\t\tOngoing - Each Player;\n\t\tAll;\n\t\tAll;\n\t}\n\n\tconditions\n\t{\n\t\tGlobal.Siap == True;\n\t\tIs Dummy Bot(Event Player) == True;\n\t\tHas Spawned(Event Player) == True;\n\t\tIs Alive(Event Player) == True;\n\t\tCount Of(Filtered Array(Global.PemainManusia, And(Entity Exists(Current Array Element), And(Has Spawned(Current Array Element), Is Alive(Current Array Element))))) > 0;\n\t}\n\n\tactions\n\t{\n\t\tStart Facing(Event Player, Direction Towards(Eye Position(Event Player), Eye Position(First Of(Sorted Array(Filtered Array(Global.PemainManusia, And(Entity Exists(Current Array Element), And(Has Spawned(Current Array Element), Is Alive(Current Array Element)))), Distance Between(Event Player, Current Array Element))))), 1000, To World, Direction and Turn Rate);\n\t}\n}\n\nrule("03h - Bot/Dummy: Ferma lo sguardo senza giocatori vivi")\n{\n\tevent\n\t{\n\t\tOngoing - Each Player;\n\t\tAll;\n\t\tAll;\n\t}\n\n\tconditions\n\t{\n\t\tGlobal.Siap == True;\n\t\tIs Dummy Bot(Event Player) == True;\n\t\tCount Of(Filtered Array(Global.PemainManusia, And(Entity Exists(Current Array Element), And(Has Spawned(Current Array Element), Is Alive(Current Array Element))))) == 0;\n\t}\n\n\tactions\n\t{\n\t\tStop Facing(Event Player);\n\t}\n}\n\nrule("03i - Bot/Dummy: Ferma lo sguardo alla morte")\n{\n\tevent\n\t{\n\t\tPlayer Died;\n\t\tAll;\n\t\tAll;\n\t}\n\n\tconditions\n\t{\n\t\tIs Dummy Bot(Event Player) == True;\n\t}\n\n\tactions\n\t{\n\t\tStop Facing(Event Player);\n\t}\n}\n\nrule("04 - Pemain Keluar: Tenangkan lalu bersihkan pendaftaran")'''
          if en.count(old_en_03c) != 1:
              raise SystemExit(f'English 03c insertion anchor count: {en.count(old_en_03c)}')
          en = en.replace(old_en_03c, new_en_03c, 1)

          italian.write_text(it, encoding='utf-8')
          english.write_text(en, encoding='utf-8')

          test = Path('tests/test_dummy_bots.py')
          test.write_text('''from pathlib import Path\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\n\nclass DummyBotFeatureTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.it = (ROOT / "workshop" / "ruang_irama.it-IT.workshop").read_text(encoding="utf-8")\n        cls.en = (ROOT / "tests" / "fixtures" / "semantic_reference.txt").read_text(encoding="utf-8")\n\n    def test_player_vibes_title_is_shifted_right(self):\n        self.assertIn("\\n \\n     PLAYER VIBES", self.it)\n        self.assertIn("\\n \\n     MUSIK PEMAIN", self.it)\n\n    def test_exactly_one_creation_rule_per_team(self):\n        self.assertEqual(self.it.count("Create Dummy Bot(Tutti gli eroi, Squadra 1, -1, Null, Null);"), 1)\n        self.assertEqual(self.it.count("Create Dummy Bot(Tutti gli eroi, Squadra 2, -1, Null, Null);"), 1)\n        self.assertEqual(self.en.count("Create Dummy Bot(All Heroes, Team 1, -1, Null, Null);"), 1)\n        self.assertEqual(self.en.count("Create Dummy Bot(All Heroes, Team 2, -1, Null, Null);"), 1)\n\n    def test_dummy_respawn_is_30_seconds(self):\n        self.assertIn("Set Respawn Max Time(Event Player, 30);", self.it)\n\n    def test_spawn_teleport_targets_objective(self):\n        self.assertIn("Is In Spawn Room(Event Player) == True;", self.it)\n        self.assertIn("All Players On Objective(All Teams)", self.it)\n        self.assertIn("Objective Position(0)", self.it)\n\n    def test_dummy_faces_nearest_living_human_without_loop(self):\n        self.assertIn("Start Facing(Event Player", self.it)\n        self.assertIn("Sorted Array(Filtered Array(Globale.PemainManusia", self.it)\n        self.assertIn("Direction and Turn Rate", self.it)\n        self.assertIn("Stop Facing(Event Player);", self.it)\n        self.assertEqual(self.it.count("Loop;"), 1)\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          marker = Path('docs/HUD_DUMMY_BOTS_WORK.md')
          if marker.exists():
              marker.unlink()
          PY

          python tools/check_clipboard_import.py
          python -m unittest tests.test_dummy_bots tests.test_clipboard_import

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tests/test_dummy_bots.py docs/HUD_DUMMY_BOTS_WORK.md
          git diff --cached --quiet && exit 0
          git commit -m 'Align Player Vibes and add team dummy bots'
          git push origin HEAD:chatgpt/hud-dummy-bots
