name: Run pitch-aware tank camera fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run pitch-aware tank camera fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply camera fix
        run: python .github/scripts/fix_pitch_tank_camera.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/fix_pitch_tank_camera.py .github/workflows/run-fix-pitch-tank-camera.yml
          git diff --cached --check
          git commit -m "Fix pitch tracking and tank camera distance"
          git push
