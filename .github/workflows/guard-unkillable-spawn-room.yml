name: Guard Unkillable in Spawn Room

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/guard-unkillable-spawn-room.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Unkillable Spawn Room behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('workshop/ruang_irama.workshop')
          validator_path = Path('tools/validate_workshop.py')
          readme_path = Path('README.md')
          report_path = Path('docs/VALIDAZIONE.md')

          def replace_exact(text, old, new, expected=1, label='replacement'):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected}, found {count}')
              return text.replace(old, new)

          def edit_rule(text, prefix, next_prefix, transform):
              start = text.index(f'rule("{prefix}')
              end = text.index(f'\nrule("{next_prefix}', start)
              block = text[start:end]
              new_block = transform(block)
              if new_block == block:
                  raise SystemExit(f'{prefix}: no change')
              return text[:start] + new_block + text[end:]

          src = source_path.read_text(encoding='utf-8')

          # Menu 5 cannot be entered from the main Arcade Menu while in Spawn Room.
          old_open = '''\t\t\tElse If(Event Player.HalamanMenu == 5);\n\t\t\t\tEvent Player.KursorUnkillable = Event Player.UnkillableAktif ? 1 : 0;\n\t\t\tElse;'''
          new_open = '''\t\t\tElse If(Event Player.HalamanMenu == 5);\n\t\t\t\tIf(Is In Spawn Room(Event Player) == True);\n\t\t\t\t\tEvent Player.HalamanMenu = -1;\n\t\t\t\t\tSmall Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Unkillable + 1 HP is unavailable in the Spawn Room.") : Event Player.IndeksBahasa == 1 ? Custom String(\n\t\t\t\t\t\t"Unkillable + 1 HP tidak tersedia di ruang muncul.") : Custom String("ไม่สามารถใช้ Unkillable + 1 HP ในห้องเกิดได้"));\n\t\t\t\tElse;\n\t\t\t\t\tEvent Player.KursorUnkillable = Event Player.UnkillableAktif ? 1 : 0;\n\t\t\t\tEnd;\n\t\t\tElse;'''
          src = replace_exact(src, old_open, new_open, label='block menu 5 in spawn')

          # Even if an input lands on the same frame as Spawn Room entry, enabling is rejected.
          src = replace_exact(
              src,
              'Event Player.UnkillableAktif = Event Player.KursorUnkillable == 1;',
              'Event Player.UnkillableAktif = And(Event Player.KursorUnkillable == 1, Is In Spawn Room(Event Player) == False);',
              label='spawn-safe unkillable apply',
          )

          # Do not reapply Unkillable or the full-health reset while the player is in Spawn Room.
          def add_spawn_false(block):
              return replace_exact(
                  block,
                  '\t\tEvent Player.UnkillableAktif == True;\n',
                  '\t\tEvent Player.UnkillableAktif == True;\n\t\tIs In Spawn Room(Event Player) == False;\n',
                  label='spawn exclusion condition',
              )
          src = edit_rule(src, '18 - Unkillable:', '18b - Unkillable:', add_spawn_false)
          src = edit_rule(src, '18b - Unkillable:', '19 - Teleport Crouch:', add_spawn_false)

          # Entering Spawn Room immediately disables the feature and closes submenu 5 if open.
          spawn_rule = '''rule("18c - Unkillable: Nonaktifkan otomatis di Spawn Room")\n{\n\tevent\n\t{\n\t\tOngoing - Each Player;\n\t\tAll;\n\t\tAll;\n\t}\n\n\tconditions\n\t{\n\t\tEvent Player.Manusia == True;\n\t\tIs In Spawn Room(Event Player) == True;\n\t\tOr(Event Player.UnkillableAktif == True, And(Event Player.MenuTerbuka == True, Event Player.HalamanMenu == 5)) == True;\n\t}\n\n\tactions\n\t{\n\t\tIf(Event Player.UnkillableAktif == True);\n\t\t\tEvent Player.UnkillableAktif = False;\n\t\t\tEvent Player.KursorUnkillable = 0;\n\t\t\tClear Status(Event Player, Unkillable);\n\t\t\tIf(Is Alive(Event Player) == True);\n\t\t\t\tSet Player Health(Event Player, Max Health(Event Player));\n\t\t\tEnd;\n\t\t\tSmall Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Unkillable + 1 HP disabled: you entered the Spawn Room.") : Event Player.IndeksBahasa == 1 ? Custom String(\n\t\t\t\t"Unkillable + 1 HP dinonaktifkan: kamu masuk ruang muncul.") : Custom String("ปิด Unkillable + 1 HP แล้ว: คุณเข้าไปในห้องเกิด"));\n\t\tEnd;\n\t\tIf(And(Event Player.MenuTerbuka == True, Event Player.HalamanMenu == 5));\n\t\t\tEvent Player.HalamanMenu = -1;\n\t\t\tEvent Player.KursorUtama = 5;\n\t\t\tCall Subroutine(GambarMenu);\n\t\tEnd;\n\t}\n}\n\n'''
          src = replace_exact(src, 'rule("19 - Teleport Crouch:', spawn_rule + 'rule("19 - Teleport Crouch:', label='spawn auto-disable rule')
          source_path.write_text(src, encoding='utf-8')

          # Static validator: require both the menu lock and the automatic disable path.
          val = validator_path.read_text(encoding='utf-8')
          a = val.index('def check_arcade_features(')
          b = val.index('def check_vpn_country_setting(', a)
          block = val[a:b].rstrip()
          checks = '''\n    interact_handlers = rules_containing(rules, "Event Player.PerintahMenu == 1;")\n    checks.equal(len(interact_handlers), 1, "handler Interact menu per guard Spawn Room")\n    if interact_handlers:\n        checks.require(\n            code_contains(\n                interact_handlers[0].body,\n                "Else If(Event Player.HalamanMenu == 5);",\n                "Is In Spawn Room(Event Player) == True;",\n                "Event Player.HalamanMenu = -1;",\n            ),\n            "Unkillable: menu 5 non bloccato nella Spawn Room",\n        )\n    spawn_disable = [\n        rule\n        for rule in rules\n        if code_contains(\n            rule.body,\n            "Is In Spawn Room(Event Player) == True;",\n            "Event Player.UnkillableAktif = False;",\n            "Clear Status(Event Player, Unkillable);",\n            "Set Player Health(Event Player, Max Health(Event Player));",\n            "Event Player.HalamanMenu = -1;",\n        )\n    ]\n    checks.equal(len(spawn_disable), 1, "regola auto-disattivazione Unkillable in Spawn Room")\n    for title in ("18 - Unkillable:", "18b - Unkillable:"):\n        matching = [rule for rule in rules if rule.name.startswith(title)]\n        checks.equal(len(matching), 1, f"regola {title} per guard Spawn Room")\n        if matching:\n            checks.require(\n                code_contains(matching[0].body, "Is In Spawn Room(Event Player) == False;"),\n                f"{title} non esclude la Spawn Room",\n            )\n'''
          val = val[:a] + block + checks + '\n\n\n' + val[b:]
          validator_path.write_text(val, encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '- Sette menu: `0 - Soundtrack`, `1 - Third-Person Camera`, `2 - Name Color`, `3 - HUD Language`, `4 - Revenge`, `5 - Unkillable + 1 HP` e `6 - Voice Modifier`.',
              '- Sette menu: `0 - Soundtrack`, `1 - Third-Person Camera`, `2 - Name Color`, `3 - HUD Language`, `4 - Revenge`, `5 - Unkillable + 1 HP` e `6 - Voice Modifier`. Il menu Unkillable è bloccato nelle Spawn Room e la funzione si disattiva automaticamente quando il player vi rientra.',
          )
          readme_path.write_text(readme, encoding='utf-8')

          data = source_path.read_bytes().replace(b'\r\n', b'\n')
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          report = report_path.read_text(encoding='utf-8')
          report, n = re.subn(r'```text\n[0-9a-f]{40}\n```', f'```text\n{blob}\n```', report, count=1)
          if n != 1:
              raise SystemExit('validation report blob marker not found')
          report_path.write_text(report, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/VALIDAZIONE.md
          git commit -m "Disable Unkillable in Spawn Rooms"
          git push origin HEAD:main
