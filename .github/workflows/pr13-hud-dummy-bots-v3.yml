name: Temporary PR 13 HUD Dummy Bots v3

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/hud-dummy-bots'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/hud-dummy-bots
          persist-credentials: true

      - name: Apply patch and correct regression tests
        shell: bash
        run: |
          python tools/apply_pr13_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_dummy_bots.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('self.assertIn("\\n \\n     PLAYER VIBES", self.it)', 'self.assertIn("\\\\n \\\\n     PLAYER VIBES", self.it)')
          text = text.replace('self.assertIn("\\n \\n     MUSIK PEMAIN", self.it)', 'self.assertIn("\\\\n \\\\n     MUSIK PEMAIN", self.it)')
          text = text.replace('self.assertEqual(self.it.count("Loop;"), 1)', 'self.assertEqual(self.it.count("Loop If Condition Is True;"), 1)')
          path.write_text(text, encoding='utf-8')
          PY
          python tools/check_clipboard_import.py
          python -m unittest tests.test_dummy_bots tests.test_clipboard_import

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tests/test_dummy_bots.py docs/HUD_DUMMY_BOTS_WORK.md tools/apply_pr13_patch.py
          git diff --cached --quiet && exit 0
          git commit -m 'Align Player Vibes and add team dummy bots'
          git push origin HEAD:chatgpt/hud-dummy-bots
