name: Fix VPN Workshop option limit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-vpn-option-limit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace oversized VPN combo with numeric ID
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('workshop/ruang_irama.workshop')
          validator_path = Path('tools/validate_workshop.py')
          readme_path = Path('README.md')
          project_path = Path('docs/PROGETTO.md')
          report_path = Path('docs/VALIDAZIONE.md')
          country_doc_path = Path('docs/VPN_COUNTRIES.md')

          src = source_path.read_text(encoding='utf-8')

          def find_matching(text, opening):
              depth = 1
              in_string = False
              escaped = False
              for i in range(opening + 1, len(text)):
                  c = text[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          in_string = False
                      continue
                  if c == '"':
                      in_string = True
                  elif c == '(':
                      depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0:
                          return i
              raise SystemExit('Unclosed parenthesis')

          # Extract canonical country list from the runtime array, which remains unchanged.
          marker = 'Global.DaftarNegaraVPN = Array('
          m = src.index(marker)
          open_array = src.index('(', m)
          close_array = find_matching(src, open_array)
          countries = re.findall(r'Custom String\("([^"]+)"\)', src[open_array:close_array + 1])
          if len(countries) != 149 or len(set(countries)) != 149 or countries[62] != 'Indonesia':
              raise SystemExit('VPN country array invariant failed')

          # Replace only the oversized Workshop Setting Combo call. The 149-country
          # runtime array stays available for HUD lookup, but no longer counts as settings options.
          assign = 'Global.IndeksNegaraVPN = Workshop Setting Combo('
          start = src.index(assign)
          opening = src.index('(', start)
          closing = find_matching(src, opening)
          semicolon = src.index(';', closing)
          replacement = ('Global.IndeksNegaraVPN = Workshop Setting Integer('
                         'Custom String("AFK DEDICATED SERVER"), '
                         'Custom String("VPN country ID (0-148)"), 62, 0, 148, 1);')
          src = src[:start] + replacement + src[semicolon + 1:]
          if 'VPN country (NordVPN)' in src or 'Global.IndeksNegaraVPN = Workshop Setting Combo' in src:
              raise SystemExit('Oversized VPN combo still present')
          source_path.write_text(src, encoding='utf-8')

          # Replace the validator's VPN check with the numeric-setting contract.
          val = validator_path.read_text(encoding='utf-8')
          a = val.index('def check_vpn_country_setting(')
          b = val.index('def check_diagnostics(', a)
          new_check = '''def check_vpn_country_setting(checks: Checks, source: str) -> None:\n    try:\n        countries = custom_strings(array_body(source, "Global.DaftarNegaraVPN"))\n    except ParseError as exc:\n        checks.require(False, f"VPN countries: {exc}")\n        return\n    checks.equal(len(countries), 149, "paesi VPN configurabili")\n    checks.equal(len(set(countries)), 149, "paesi VPN unici")\n    checks.require("Indonesia" in countries, "VPN: Indonesia assente dalla lista")\n    if "Indonesia" in countries:\n        checks.equal(countries.index("Indonesia"), 62, "indice VPN predefinito Indonesia")\n    checks.require(\n        'Global.IndeksNegaraVPN = Workshop Setting Integer' in mask_strings(source),\n        "VPN: Workshop Setting Integer non assegnato a Global.IndeksNegaraVPN",\n    )\n    checks.require(\n        'Custom String("VPN country ID (0-148)")' in source,\n        "VPN: nome dell'impostazione numerica non trovato",\n    )\n    checks.require(\n        'Custom String("VPN country ID (0-148)"), 62, 0, 148, 1)' in source,\n        "VPN: default/range/ordine del Country ID non corretti",\n    )\n    checks.require(\n        'Global.IndeksNegaraVPN = Workshop Setting Combo' not in mask_strings(source),\n        "VPN: la combo con troppe opzioni non deve essere presente",\n    )\n    checks.require(\n        'Custom String("SERVER VPN: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source\n        and 'Custom String("เซิร์ฟเวอร์ VPN: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source,\n        "HUD SERVER VPN non usa il Country ID configurato",\n    )\n\n\n'''
          val = val[:a] + new_check + val[b:]
          validator_path.write_text(val, encoding='utf-8')

          # Generate a human-readable ID table so all 149 choices remain practical.
          lines = [
              '# VPN Country IDs',
              '',
              'La Workshop Setting `VPN country ID (0-148)` usa questi valori. Il default è **62 = Indonesia**.',
              '',
              '| ID | Country |',
              '|---:|---|',
          ]
          lines += [f'| {i} | {country} |' for i, country in enumerate(countries)]
          country_doc_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'Il paese mostrato nell’HUD `SERVER VPN` è selezionabile con `VPN country (NordVPN)`; il default resta Indonesia.',
              'Il paese mostrato nell’HUD `SERVER VPN` è selezionabile con `VPN country ID (0-148)`; il default resta `62 = Indonesia`. La tabella completa è in [`docs/VPN_COUNTRIES.md`](docs/VPN_COUNTRIES.md).',
          )
          readme = readme.replace(
              '6. Imposta durata, paese `SERVER VPN` e diagnostica dalle opzioni Workshop.',
              '6. Imposta durata, `VPN country ID (0-148)` e diagnostica dalle opzioni Workshop; per gli ID consulta [`docs/VPN_COUNTRIES.md`](docs/VPN_COUNTRIES.md).',
          )
          readme_path.write_text(readme, encoding='utf-8')

          project = project_path.read_text(encoding='utf-8')
          project = project.replace(
              'La stessa categoria di Workshop Settings espone `VPN country (NordVPN)`, una combo alfabetica di 149 paesi con Indonesia come default.',
              'La stessa categoria di Workshop Settings espone `VPN country ID (0-148)`, un intero che indicizza la lista alfabetica di 149 paesi con `62 = Indonesia` come default. La scelta numerica evita il limite del client sul numero di opzioni di una Workshop Setting Combo.',
          )
          project_path.write_text(project, encoding='utf-8')

          data = source_path.read_bytes().replace(b'\r\n', b'\n')
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          report = report_path.read_text(encoding='utf-8')
          report, n = re.subn(r'```text\n[0-9a-f]{40}\n```', f'```text\n{blob}\n```', report, count=1)
          if n != 1:
              raise SystemExit('validation report blob marker not found')
          report_path.write_text(report, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/PROGETTO.md docs/VALIDAZIONE.md docs/VPN_COUNTRIES.md
          git commit -m "Fix VPN Workshop setting option limit"
          git push origin HEAD:main
