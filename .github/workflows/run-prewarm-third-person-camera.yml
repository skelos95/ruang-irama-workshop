name: Run flicker-free camera activation

on:
  push:
    paths:
      - '.github/workflows/run-prewarm-third-person-camera.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-frame camera prewarm
        run: python .github/scripts/prewarm_third_person_camera.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prewarm third-person camera activation"
          git push
