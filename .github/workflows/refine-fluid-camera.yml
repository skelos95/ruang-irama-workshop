name: Refine fluid third-person camera

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Refine camera smoothing and health scaling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch camera
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('workshop/ruang_irama.workshop')
          s = p.read_text(encoding='utf-8')

          for old, new in [
              ('Global.JarakKamera = 3.000;', 'Global.JarakKamera = 1.650;'),
              ('Global.GeserKamera = 1.150;', 'Global.GeserKamera = 0.700;'),
              ('Global.JarakBidik = 1000;', 'Global.JarakBidik = 300;'),
          ]:
              if old not in s:
                  raise SystemExit(f'missing global pattern: {old}')
              s = s.replace(old, new, 1)

          start = s.find('rule("93 - Subrutin: Kamera terza persona dinamica sulla spalla sinistra")')
          end = s.find('\nrule("94 - Subrutin:', start)
          if start < 0 or end < 0:
              raise SystemExit('camera rule boundaries not found')

          new_rule = r'''rule("93 - Subrutin: Kamera terza persona dinamica sulla spalla sinistra")
{
	event
	{
		Subroutine;
		MulaiKamera;
	}

	actions
	{
		Abort If(Event Player.TargetKamera == Null);
		Stop Camera(Event Player);
		"Camera fluida: distanza 1,65-3,60 m e offset sinistro 0,70-1,45 m, entrambi scalati con Max Health. Blend 50 riduce gli scatti."
		Start Camera(Event Player,
			Ray Cast Hit Position(
				Eye Position(Event Player.TargetKamera) + World Vector Of(Vector(
					0 - Min(1.450, Max(Global.GeserKamera, Global.GeserKamera + (Max Health(Event Player.TargetKamera) - 200) * 0.0012)),
					0, 0), Event Player.TargetKamera, Rotation),
				Eye Position(Event Player.TargetKamera) + World Vector Of(Vector(
					0 - Min(1.450, Max(Global.GeserKamera, Global.GeserKamera + (Max Health(Event Player.TargetKamera) - 200) * 0.0012)),
					0, 0), Event Player.TargetKamera, Rotation)
					- Facing Direction Of(Event Player.TargetKamera) * Min(3.600, Max(Global.JarakKamera,
						Global.JarakKamera + (Max Health(Event Player.TargetKamera) - 200) * 0.0024)),
				Null, All Players(All Teams), True)
			+ Direction Towards(
				Ray Cast Hit Position(
					Eye Position(Event Player.TargetKamera) + World Vector Of(Vector(
						0 - Min(1.450, Max(Global.GeserKamera, Global.GeserKamera + (Max Health(Event Player.TargetKamera) - 200) * 0.0012)),
						0, 0), Event Player.TargetKamera, Rotation),
					Eye Position(Event Player.TargetKamera) + World Vector Of(Vector(
						0 - Min(1.450, Max(Global.GeserKamera, Global.GeserKamera + (Max Health(Event Player.TargetKamera) - 200) * 0.0012)),
						0, 0), Event Player.TargetKamera, Rotation)
						- Facing Direction Of(Event Player.TargetKamera) * Min(3.600, Max(Global.JarakKamera,
							Global.JarakKamera + (Max Health(Event Player.TargetKamera) - 200) * 0.0024)),
					Null, All Players(All Teams), True),
				Eye Position(Event Player.TargetKamera) + World Vector Of(Vector(
					0 - Min(1.450, Max(Global.GeserKamera, Global.GeserKamera + (Max Health(Event Player.TargetKamera) - 200) * 0.0012)),
					0, 0), Event Player.TargetKamera, Rotation)) * Global.BantalanDinding,
			Ray Cast Hit Position(Eye Position(Event Player.TargetKamera),
				Eye Position(Event Player.TargetKamera) + Facing Direction Of(Event Player.TargetKamera) * Global.JarakBidik,
				All Players(All Teams), Event Player.TargetKamera, True), 50);
	}
}
'''

          s = s[:start] + new_rule + s[end:]
          p.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = re.sub(
              r'- Menu `1 - Third-Person Camera`:.*?\n',
              '- Menu `1 - Third-Person Camera`: prima persona, terza persona sul proprio eroe o visuale di un altro player/bot. La camera usa un blend fluido, parte da circa 1,65 m dietro e arriva fino a circa 3,60 m in base alla salute massima; anche l’offset a sinistra scala con Max Health (circa 0,70–1,45 m). Il mirino converge sul raycast reale della mira e il raycast della camera evita i muri.\n',
              r,
              count=1,
          )
          readme.write_text(r, encoding='utf-8')

          # Self-delete temporary workflow.
          Path('.github/workflows/refine-fluid-camera.yml').unlink()
          PY

      - name: Commit camera refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop README.md .github/workflows/refine-fluid-camera.yml
          git diff --cached --check
          git commit -m "Smooth and rescale third-person camera"
          git push
