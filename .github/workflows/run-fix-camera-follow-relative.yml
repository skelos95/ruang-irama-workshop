name: Run relative-offset camera follow fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run relative-offset camera follow fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply relative camera follow fix
        run: python .github/scripts/fix_camera_follow_relative.py

      - name: Check diff
        run: git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop README.md .github/scripts/fix_camera_follow_relative.py .github/workflows/run-fix-camera-follow-relative.yml
          git commit -m "Fix smooth camera follow using relative offset"
          git push
