name: Rename AFK to CHILL

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rename-afk-to-chill.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename mode text and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('workshop/ruang_irama.workshop')
          readme_path = Path('README.md')
          project_path = Path('docs/PROGETTO.md')
          report_path = Path('docs/VALIDAZIONE.md')

          # Workshop: use natural player-facing wording, then remove any remaining AFK token.
          src = source_path.read_text(encoding='utf-8')
          src = src.replace('AFK DEDICATED SERVER', 'CHILL DEDICATED SERVER')
          src = src.replace('LOBBY ROSTER & AFK TIME', 'LOBBY ROSTER & CHILL TIME')
          src = src.replace('AFK FOR {0} MIN', 'CHILLING FOR {0} MIN')
          src = src.replace('AFK for {0} min', 'CHILLING FOR {0} MIN')
          src = src.replace('AFK', 'CHILL')
          source_path.write_text(src, encoding='utf-8')

          # Documentation: the project has been renamed, so remove the old term everywhere.
          for path in (readme_path, project_path, report_path):
              text = path.read_text(encoding='utf-8')
              text = text.replace('AFK Dedicated Server', 'CHILL Dedicated Server')
              text = text.replace('AFK DEDICATED SERVER', 'CHILL DEDICATED SERVER')
              text = text.replace('AFK TIME', 'CHILL TIME')
              text = text.replace('AFK FOR', 'CHILLING FOR')
              text = text.replace('AFK', 'CHILL')
              path.write_text(text, encoding='utf-8')

          # Fail if the old branding remains in current source/docs.
          for path in (source_path, readme_path, project_path, report_path):
              text = path.read_text(encoding='utf-8')
              if 'AFK' in text:
                  raise SystemExit(f'AFK still present in {path}')

          # Keep validation report tied to the new Workshop blob.
          data = source_path.read_bytes().replace(b'\r\n', b'\n')
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          report = report_path.read_text(encoding='utf-8')
          report, n = re.subn(r'```text\n[0-9a-f]{40}\n```', f'```text\n{blob}\n```', report, count=1)
          if n != 1:
              raise SystemExit('validation report blob marker not found')
          report_path.write_text(report, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop README.md docs/PROGETTO.md docs/VALIDAZIONE.md
          git commit -m "Rename AFK Dedicated Server to CHILL"
          git push origin HEAD:main
