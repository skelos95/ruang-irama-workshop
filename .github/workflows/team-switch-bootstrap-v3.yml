name: Team Switch Bootstrap V3

on:
  push:
    branches:
      - fix/team-switch-crash
    paths:
      - .github/workflows/team-switch-bootstrap-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reuse patch with corrected generated method indentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/team-switch-bootstrap-v2.yml').read_text(encoding='utf-8')
          script = workflow.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())

          needle = '''def replace_method(text: str, name: str, replacement: str) -> str:
    pattern = re.compile(rf'^    def {re.escape(name)}\\b.*?(?=^    def |^if __name__ ==)', re.M | re.S)
'''
          fixed = '''def replace_method(text: str, name: str, replacement: str) -> str:
    lines = replacement.rstrip().splitlines()
    if len(lines) > 1:
        lines[1:] = [('    ' + line) if line.strip() else line for line in lines[1:]]
    replacement = '\\n'.join(lines)
    pattern = re.compile(rf'^    def {re.escape(name)}\\b.*?(?=^    def |^if __name__ ==)', re.M | re.S)
'''
          if needle not in script:
              raise SystemExit('replace_method helper not found in V2 patch')
          script = script.replace(needle, fixed, 1)
          exec(compile(script, 'team-switch-v2-patch', 'exec'), {})
          PY

          rm -f \
            .github/workflows/team-switch-bootstrap.yml \
            .github/workflows/team-switch-bootstrap-v2.yml \
            .github/workflows/team-switch-bootstrap-v3.yml

      - name: Validate focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_workshop.py tests/test_runtime_maintenance.py tests/test_validate_workshop.py tests/test_ghost_fly.py
          python -m unittest tests.test_runtime_maintenance tests.test_ghost_fly tests.test_roster_rejoin_regressions tests.test_validate_workshop
          python tools/validate_workshop.py
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
          git diff --check

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix team-switch crash with lightweight lifecycle"
          git push origin HEAD:fix/team-switch-crash
