name: Temporary inspect lazy roster validator

on:
  push:
    branches:
      - fix-lazy-roster-hud-20260827

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show stale validator checks
        run: |
          grep -n -C 22 -e 'profilo speciale: renderer roster globale assente' -e 'renderer roster persistente post-team-switch assente' -e 'entrypoint umano assente: HUD player' tools/validate_workshop.py
