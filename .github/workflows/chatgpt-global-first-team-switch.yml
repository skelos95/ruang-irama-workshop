name: Validate Global First Team Switch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt-global-first-team-switch
          fetch-depth: 0

      - name: Apply global-first lifecycle fix and validate
        shell: bash
        run: |
          set -euo pipefail
          python tools/chatgpt_fix_global_first_patcher.py
          python tools/chatgpt_global_first_team_switch.py
          python tools/chatgpt_fix_wait_limit_test.py
          git rm -f tools/chatgpt_fix_global_first_patcher.py tools/chatgpt_global_first_team_switch.py tools/chatgpt_fix_wait_limit_test.py .github/workflows/chatgpt-global-first-team-switch.yml

          python -m py_compile tools/validate_workshop.py tests/test_validate_workshop.py tests/test_runtime_maintenance.py
          python tools/validate_workshop.py
          python -m unittest tests.test_runtime_maintenance tests.test_validate_workshop
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
          python -m unittest discover -s tests -p 'test_*.py'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make team switch lifecycle global-first"
          git push origin HEAD:chatgpt-global-first-team-switch
