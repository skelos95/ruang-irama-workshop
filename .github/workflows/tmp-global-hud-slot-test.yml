name: Temporary global HUD slot test validation

on:
  push:
    branches:
      - tmp-global-hud-slot-20260826

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Repair focused test
        run: python .github/maintenance/tmp_fix_global_slot_test.py
      - name: Remove temporary staging files
        run: |
          rm .github/workflows/tmp-global-hud-slot-test.yml
          rm .github/maintenance/tmp_fix_global_slot_test.py
          rmdir .github/maintenance 2>/dev/null || true
      - name: Commit repaired test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_runtime_maintenance.py .github
          git commit -m "Repair global HUD slot runtime test"
          git push origin HEAD:tmp-global-hud-slot-20260826
      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
      - name: Run focused global slot runtime test
        run: python -m unittest tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_roster_is_owned_by_persistent_global_hud_slots
      - name: Validate Workshop source
        run: python tools/validate_workshop.py
