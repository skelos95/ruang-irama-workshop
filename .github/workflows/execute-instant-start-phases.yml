name: Execute instant match start patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/execute-instant-start-phases.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/instant-start-phases.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("          PY\n", start)
          lines = wf[start:end].splitlines()
          Path('/tmp/instant_start.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n', encoding='utf-8')
          PY
      - name: Apply and validate
        shell: bash
        run: |
          python /tmp/instant_start.py
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/PROGETTO.md docs/TEST.md docs/VALIDAZIONE.md
          git commit -m "Skip pre-match phases for instant start"
          git push origin HEAD:main
