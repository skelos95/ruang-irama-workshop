name: Temporary PR 9 Italian Import Fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 9 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/italian-import-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/italian-import-fix
          persist-credentials: true

      - name: Check out pinned OverPy localization database
        uses: actions/checkout@v4
        with:
          repository: Zezombye/overpy
          ref: d854bf01fc7bbf3b2169f67408c07a8da8989ad6
          path: .overpy
          persist-credentials: false

      - name: Regenerate conservative it-IT Workshop source
        shell: bash
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import json
          import re
          import shutil

          root = Path('.overpy/src/data')
          workshop_english = Path('workshop/ruang_irama.workshop')
          fixture_path = Path('tests/fixtures/semantic_reference.txt')
          english_path = workshop_english if workshop_english.exists() else fixture_path
          italian_path = Path('workshop/ruang_irama.it-IT.workshop')
          manifest_path = Path('workshop/ruang_irama.it-IT.manifest')
          source = english_path.read_text(encoding='utf-8')

          candidates: dict[str, set[str]] = defaultdict(set)
          locale_line = re.compile(
              r'^(?P<indent>\s*)"(?P<locale>en-US|it-IT)"\s*:\s*'
              r'(?P<value>"(?:[^"\\]|\\.)*")\s*,?\s*$'
          )

          for path in sorted(root.glob('*.ts')):
              lines = path.read_text(encoding='utf-8').splitlines()
              i = 0
              while i < len(lines):
                  m = locale_line.match(lines[i])
                  if not m or m.group('locale') != 'en-US':
                      i += 1
                      continue
                  indent = len(m.group('indent'))
                  en = json.loads(m.group('value'))
                  target = en
                  j = i + 1
                  while j < len(lines):
                      m2 = locale_line.match(lines[j])
                      stripped = lines[j].strip()
                      leading = len(lines[j]) - len(lines[j].lstrip())
                      if m2 and len(m2.group('indent')) == indent and m2.group('locale') == 'it-IT':
                          target = json.loads(m2.group('value'))
                          break
                      if stripped.startswith('}') and leading < indent:
                          break
                      j += 1
                  if isinstance(en, str) and en:
                      candidates[en].add(target)
                  i += 1

          quoted = re.compile(r'"(?:[^"\\]|\\.)*"')
          color_call = re.compile(r'\bColor\(([^()]+)\)')
          protected_colors: dict[str, str] = {}
          color_counter = 0

          def protect_colors(segment: str) -> str:
              global color_counter
              def repl(match: re.Match[str]) -> str:
                  global color_counter
                  key = f'__CHILL_COLOR_LITERAL_{color_counter}__'
                  color_counter += 1
                  protected_colors[key] = match.group(0)
                  return key
              return color_call.sub(repl, segment)

          all_tokens = sorted(candidates, key=lambda item: (-len(item), item))
          token_re = re.compile(
              r'(?<![A-Za-z0-9_])(?:'
              + '|'.join(re.escape(item) for item in all_tokens)
              + r')(?![A-Za-z0-9_])'
          )

          def translate_code(segment: str) -> tuple[str, int]:
              segment = protect_colors(segment)
              count = 0
              def repl(match: re.Match[str]) -> str:
                  nonlocal count
                  en = match.group(0)
                  targets = candidates[en]
                  if len(targets) == 1:
                      target = next(iter(targets))
                      if target != en:
                          count += 1
                      return target
                  return en
              translated = token_re.sub(repl, segment)
              translated, n = re.subn(r'(?<![A-Za-z0-9_])Damage(?=\s*\()', 'Danneggia', translated)
              count += n
              translated, n = re.subn(r'Game Mode\(Escort\)', 'Game Mode(Trasporto)', translated)
              count += n
              translated, n = re.subn(r'(?m)^(\s*)All;(\s*)$', r'\1Tutti;\2', translated)
              count += n
              for key, original in protected_colors.items():
                  translated = translated.replace(key, original)
              return translated, count

          out: list[str] = []
          cursor = 0
          replacements = 0
          for m in quoted.finditer(source):
              translated, n = translate_code(source[cursor:m.start()])
              replacements += n
              out.append(translated)
              out.append(m.group(0))
              cursor = m.end()
          translated, n = translate_code(source[cursor:])
          replacements += n
          out.append(translated)
          output = ''.join(out)

          if not output.lstrip().startswith('variabili\n{'):
              raise SystemExit('Italian structural grammar was not generated')
          if re.search(r'Color\((?:Bianco|Giallo)\)', output):
              raise SystemExit('Localized Color literal survived regeneration')
          if color_call.findall(source) != color_call.findall(output):
              raise SystemExit('Color literal sequence changed during localization')
          if 'Ongoing - Globale;' in output:
              raise SystemExit('Partial localization survived: Ongoing - Globale')

          italian_path.write_text(output, encoding='utf-8')
          fixture_path.parent.mkdir(parents=True, exist_ok=True)
          if english_path != fixture_path:
              shutil.copyfile(english_path, fixture_path)
              english_path.unlink()
          if manifest_path.exists():
              manifest_path.unlink()

          print(f'Applied {replacements} conservative replacements')
          print(f'Preserved {len(color_call.findall(source))} Color literal options in en-US form')
          PY

      - name: Align tooling and docs to Italian-only Workshop folder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path('tools/validate_workshop.py')
          text = validator.read_text(encoding='utf-8')
          old = 'SOURCE = ROOT / "workshop" / "ruang_irama.workshop"'
          new = 'SOURCE = ROOT / "tests" / "fixtures" / "semantic_reference.txt"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('validate_workshop SOURCE path not found')
          validator.write_text(text, encoding='utf-8')

          checker = Path('tools/check_clipboard_import.py')
          text = checker.read_text(encoding='utf-8')
          text = text.replace(
              "Overwatch's Workshop clipboard grammar is localized. The canonical project source\nis kept in en-US syntax, while the Italian client must receive the generated\nit-IT clipboard variant. This checker validates either profile without pretending\nto reproduce the client's compiled Element Count or Largest Rule metrics.",
              "Overwatch's Workshop clipboard grammar is localized. The repository exposes one\ncopy/paste Workshop source: the it-IT variant used by the Italian client. The\nsemantic validator keeps a separate internal text fixture, not a user-facing\nWorkshop file. This checker validates clipboard structure without pretending to\nreproduce the client's compiled Element Count or Largest Rule metrics.",
          )
          text = text.replace(
              'DEFAULT_SOURCE = ROOT / "workshop" / "ruang_irama.workshop"\nITALIAN_SOURCE = ROOT / "workshop" / "ruang_irama.it-IT.workshop"',
              'DEFAULT_SOURCE = ROOT / "workshop" / "ruang_irama.it-IT.workshop"',
          )
          checker.write_text(text, encoding='utf-8')

          tests = Path('tests/test_clipboard_import.py')
          tests.write_text(r'''from __future__ import annotations

from pathlib import Path
import sys
import unittest

ROOT = Path(__file__).resolve().parents[1]
sys.path.insert(0, str(ROOT / "tools"))
import check_clipboard_import as clipboard  # noqa: E402


class ClipboardImportTests(unittest.TestCase):
    @classmethod
    def setUpClass(cls) -> None:
        cls.italian_path = ROOT / "workshop" / "ruang_irama.it-IT.workshop"
        cls.italian = cls.italian_path.read_text(encoding="utf-8")

    def test_canonical_italian_source_is_clipboard_safe(self) -> None:
        report = clipboard.check_path(self.italian_path, "it-IT")
        self.assertEqual(report.language, "it-IT")
        self.assertGreater(report.rule_count, 0)
        self.assertLess(report.largest_rule.bytes_utf8, clipboard.CLIENT_LARGEST_RULE_LIMIT_BYTES)
        self.assertLessEqual(report.largest_rule.bytes_utf8, clipboard.SOURCE_RULE_SAFETY_TARGET_BYTES)

    def test_workshop_folder_contains_only_italian_source(self) -> None:
        names = {path.name for path in (ROOT / "workshop").iterdir() if path.is_file()}
        self.assertEqual(names, {"ruang_irama.it-IT.workshop"})

    def test_italian_source_uses_localized_structural_grammar(self) -> None:
        stripped = self.italian.lstrip()
        self.assertTrue(stripped.startswith("variabili\n{"))
        self.assertIn("\nsubroutine\n{", self.italian)
        self.assertIn('\nregola("', self.italian)
        self.assertIn("\n\tevento\n", self.italian)
        self.assertIn("\n\tcondizioni\n", self.italian)
        self.assertIn("\n\tazioni\n", self.italian)

    def test_context_sensitive_identity_tokens_are_preserved(self) -> None:
        self.assertIn("Ongoing - Global;", self.italian)
        self.assertNotIn("Ongoing - Globale;", self.italian)
        self.assertIn("Color(White)", self.italian)
        self.assertNotIn("Color(Bianco)", self.italian)
        self.assertIn("Color(Yellow)", self.italian)
        self.assertNotIn("Color(Giallo)", self.italian)

    def test_default_checker_targets_italian_source(self) -> None:
        self.assertEqual(clipboard.DEFAULT_SOURCE, self.italian_path)
        self.assertEqual(clipboard.check_path().language, "it-IT")

    def test_windows_crlf_clipboard_is_accepted(self) -> None:
        crlf = self.italian.replace("\r\n", "\n").replace("\n", "\r\n")
        self.assertEqual(clipboard.check_text(crlf).language, "it-IT")

    def test_wrong_explicit_language_is_rejected(self) -> None:
        with self.assertRaisesRegex(clipboard.ClipboardImportError, "fornita al controllo"):
            clipboard.check_text(self.italian, "en-US")

    def test_mixed_structural_grammar_is_rejected(self) -> None:
        mutated = self.italian.replace("\tazioni\n", "\tactions\n", 1)
        with self.assertRaises(clipboard.ClipboardImportError):
            clipboard.check_text(mutated, "it-IT")

    def test_utf8_bom_is_rejected(self) -> None:
        with self.assertRaisesRegex(clipboard.ClipboardImportError, "BOM UTF-8"):
            clipboard.check_text("\ufeff" + self.italian)

    def test_markdown_fence_is_rejected(self) -> None:
        with self.assertRaisesRegex(clipboard.ClipboardImportError, "Markdown"):
            clipboard.check_text("```\n" + self.italian + "\n```")

    def test_smart_quote_in_rule_header_is_rejected(self) -> None:
        mutated = self.italian.replace('regola("', 'regola(“', 1)
        with self.assertRaises(clipboard.ClipboardImportError):
            clipboard.check_text(mutated, "it-IT")

    def test_italian_words_inside_custom_strings_are_allowed(self) -> None:
        mutated = self.italian.replace(
            'Custom String("Lowercase")',
            'Custom String("azioni e condizioni")',
            1,
        )
        self.assertGreater(clipboard.check_text(mutated, "it-IT").rule_count, 0)

    def test_unclosed_string_is_rejected(self) -> None:
        mutated = self.italian.replace(
            'Custom String("Lowercase")', 'Custom String("Lowercase)', 1
        )
        with self.assertRaisesRegex(clipboard.ClipboardImportError, "stringa Workshop non chiusa"):
            clipboard.check_text(mutated, "it-IT")

    def test_static_rule_safety_target_is_enforced(self) -> None:
        oversized = (
            "variabili\n{\n}\n\n"
            "subroutine\n{\n}\n\n"
            'regola("test")\n{\n'
            "\tevento\n\t{\n\t\tOngoing - Global;\n\t}\n"
            "\tcondizioni\n\t{\n\t\tTrue == True;\n\t}\n"
            "\tazioni\n\t{\n\t\t"
            + 'Custom String("'
            + ("x" * (clipboard.SOURCE_RULE_SAFETY_TARGET_BYTES + 1024))
            + '");\n\t}\n}\n'
        )
        with self.assertRaisesRegex(clipboard.ClipboardImportError, "80 KB"):
            clipboard.check_text(oversized, "it-IT")


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              '- Identificatori, titoli regola, subroutine e commenti personalizzati restano in Bahasa Indonesia in entrambe le varianti clipboard.\n- Il **linguaggio del clipboard Workshop è localizzato**: il sorgente canonico usa `en-US`, mentre il client italiano deve ricevere la variante `it-IT`. Alcuni token cambiano (`variables → variabili`, `rule → regola`, `event → evento`), mentre altri restano identici in italiano (`Ongoing - Global`, `Button(Secondary Fire)`).',
              '- Identificatori, titoli regola, subroutine e commenti personalizzati restano in Bahasa Indonesia.\n- Il repository espone un solo file Workshop da copiare: `workshop/ruang_irama.it-IT.workshop`. La grammatica strutturale è `it-IT`, mentre alcuni literal contestuali restano inglesi quando il parser italiano lo richiede (per esempio `Color(White)` e `Ongoing - Global`).',
          )
          old_import = '''Il sorgente funzionale canonico è [`workshop/ruang_irama.workshop`](workshop/ruang_irama.workshop), in grammatica `en-US`. Serve per manutenzione e validazione semantica.

Con Overwatch impostato in **italiano**, il file da copiare è invece:

[`workshop/ruang_irama.it-IT.workshop`](workshop/ruang_irama.it-IT.workshop)

Apri la vista Raw di quel file e copia tutto, dalla prima riga `variabili` fino alla graffa finale. La variante italiana è generata dal canonico usando le tabelle di localizzazione di OverPy 9.7.13 e un manifest SHA-256 impedisce che diventi stale rispetto al sorgente principale.

Se si copia il file `en-US` nel client italiano, il sintomo può essere proprio quello osservato nel test live: **il pulsante arancione per incollare le regole non compare**. La guida completa è in [`docs/IMPORTAZIONE_ITALIANO.md`](docs/IMPORTAZIONE_ITALIANO.md).'''
          new_import = '''L'unico file Workshop da copiare è:

[`workshop/ruang_irama.it-IT.workshop`](workshop/ruang_irama.it-IT.workshop)

Apri la vista Raw e copia tutto dalla prima riga `variabili` fino alla graffa finale. Il file è mantenuto direttamente come sorgente di importazione `it-IT`. Il validatore semantico usa una fixture interna `.txt`, che non è un secondo file Workshop destinato al client.

Il test live ha mostrato che alcuni literal contestuali non devono essere tradotti anche se vecchie tabelle di localizzazione li espongono in italiano: `Color(Bianco)` viene rifiutato dal client, mentre `Color(White)` è la forma accettata. La guida completa è in [`docs/IMPORTAZIONE_ITALIANO.md`](docs/IMPORTAZIONE_ITALIANO.md).'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          text = text.replace(
              'python tools/check_clipboard_import.py workshop/ruang_irama.workshop --language en-US\npython tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT',
              'python tools/check_clipboard_import.py',
          )
          text = text.replace(
              '`check_clipboard_import.py` verifica il formato testuale di paste per entrambi i profili',
              '`check_clipboard_import.py` verifica il formato testuale del file `it-IT`',
          )
          readme.write_text(text, encoding='utf-8')

          guide = Path('docs/IMPORTAZIONE_ITALIANO.md')
          guide.write_text('''# Importazione Workshop con client Overwatch in italiano

Il repository espone **un solo file Workshop da copiare**:

`workshop/ruang_irama.it-IT.workshop`

## Procedura

1. Apri `workshop/ruang_irama.it-IT.workshop` su GitHub.
2. Premi **Raw**.
3. Copia tutto con `Ctrl+A` e `Ctrl+C`.
4. In Overwatch apri Partita personalizzata > Impostazioni > Workshop.
5. Deve comparire il pulsante arancione **Incolla regole**.
6. Incolla e attendi l'elaborazione del client.
7. Apri **Diagnostica script** e registra `Numero totale elementi` e `Regola più grande`.

## Nota sui literal localizzati

La grammatica strutturale del clipboard italiano usa token come `variabili`, `regola`, `evento`, `condizioni` e `azioni`. Non tutti i literal però devono essere tradotti.

Il test live del 21/08/2026 ha isolato un caso concreto: il client rifiuta `Color(Bianco)` con l'errore `richiesta un'opzione dopo 'Color('`. Il file corretto conserva quindi i literal colore nella forma inglese prevista dal parser, per esempio `Color(White)` e `Color(Yellow)`.

Anche token identitari come `Ongoing - Global` vengono preservati quando il parser `it-IT` li richiede.

## Preflight

Dalla radice del repository:

```powershell
python tools/check_clipboard_import.py
```

Il checker verifica UTF-8/BOM, delimitatori, stringhe, grammatica strutturale `it-IT`, assenza di formato misto e dimensione testuale delle regole.

## Limiti mostrati dal client

- Numero totale elementi: massimo `32768`.
- Regola più grande: `< 98 KB`.
- Combinazioni massime eroe/modello: `12`.
- Dummy bot extra-slot: `0` nella configurazione mostrata.

Queste metriche vanno lette **dopo un import riuscito**. Il preflight statico non può sostituire la Diagnostica script del client.
''', encoding='utf-8')

          # User-facing docs should never point to the removed en-US Workshop file.
          for path in Path('docs').glob('*.md'):
              if path == guide:
                  continue
              doc = path.read_text(encoding='utf-8')
              doc = doc.replace('workshop/ruang_irama.workshop', 'workshop/ruang_irama.it-IT.workshop')
              doc = doc.replace('workshop/ruang_irama.it-IT.manifest', 'workshop/ruang_irama.it-IT.workshop')
              path.write_text(doc, encoding='utf-8')
          PY

          python tools/check_clipboard_import.py --language it-IT

      - name: Commit corrected source and cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Make Italian Workshop source canonical'
          git push origin HEAD:chatgpt/italian-import-fix
