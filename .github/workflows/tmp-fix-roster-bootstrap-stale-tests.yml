name: Temporary roster bootstrap stale-test alignment

on:
  push:
    branches:
      - fix-roster-bootstrap-20260827

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Align stale tests
        run: python .github/maintenance/fix_roster_bootstrap_stale_tests.py
      - name: Remove temporary files
        run: |
          rm .github/workflows/tmp-fix-roster-bootstrap-stale-tests.yml
          rm .github/maintenance/fix_roster_bootstrap_stale_tests.py
          rmdir .github/maintenance 2>/dev/null || true
      - name: Commit aligned tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_runtime_maintenance.py tests/test_validate_workshop.py .github
          git commit -m 'Align stale tests with slot-only roster bootstrap'
          git push origin HEAD:fix-roster-bootstrap-20260827
      - name: Run focused affected tests
        run: |
          python -m unittest tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_roster_is_owned_by_persistent_global_hud_slots
          python -m unittest tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_team_switch_is_lightweight_and_leave_cleanup_is_exact
          python -m unittest tests.test_validate_workshop.SemanticWorkshop081Tests.test_roster_ready_flag_is_written_after_both_global_aliases
          python -m unittest tests.test_validate_workshop.SemanticWorkshop081Tests.test_lazy_roster_rows_require_assigned_identity_before_creation
          python -m unittest tests.test_validate_workshop.SemanticWorkshop081Tests.test_pending_roster_refresh_cannot_block_roster_bootstrap
      - name: Validate Workshop source
        run: python tools/validate_workshop.py
      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
