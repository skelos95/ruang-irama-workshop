name: Temporary Ghost CI repair

on:
  push:
    branches:
      - audit-ghost-menu13-20260827

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Repair Ghost audit findings
        run: |
          sed -i 's/    expected=3,/    expected=1,/' .github/maintenance/tmp_fix_ghost_ci.py
          python .github/maintenance/tmp_fix_ghost_ci.py

      - name: Remove temporary maintenance files before validation
        run: git rm -f .github/maintenance/tmp_fix_ghost_ci.py .github/workflows/tmp-fix-ghost-ci.yml

      - name: Run full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Workshop source
        run: python tools/validate_workshop.py

      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT

      - name: Commit clean repaired tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Ghost Mode audit cleanup"
          git push origin HEAD:audit-ghost-menu13-20260827
