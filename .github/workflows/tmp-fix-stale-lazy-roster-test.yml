name: Temporary align stale lazy roster runtime test

on:
  push:
    branches:
      - fix-lazy-roster-hud-20260827

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix-lazy-roster-hud-20260827
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Repair stale runtime test
        run: python .github/maintenance/fix_stale_lazy_roster_test.py

      - name: Run repaired runtime test
        run: python -m unittest tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_roster_is_owned_by_persistent_global_hud_slots

      - name: Remove temporary files and commit
        run: |
          rm .github/maintenance/fix_stale_lazy_roster_test.py
          rm .github/workflows/tmp-fix-stale-lazy-roster-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align runtime test with lazy roster HUD creation'
          git push origin HEAD:fix-lazy-roster-hud-20260827
