name: Validate Dummy Respawn and Jump Resurrect

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt-dummy-respawn-jump-resurrect
          fetch-depth: 0

      - name: Apply changes and validate
        shell: bash
        run: |
          set -euo pipefail
          python tools/chatgpt_dummy_respawn_jump_resurrect.py
          git rm tools/chatgpt_dummy_respawn_jump_resurrect.py .github/workflows/chatgpt-dummy-respawn-jump-resurrect.yml

          python -m py_compile tests/test_dummy_bots.py tests/test_runtime_maintenance.py tools/validate_workshop.py
          python tools/validate_workshop.py
          python -m unittest tests.test_dummy_bots tests.test_runtime_maintenance
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
          python -m unittest discover -s tests -p 'test_*.py'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set dummy respawn to 3s and harden Jump resurrect"
          git push origin HEAD:chatgpt-dummy-respawn-jump-resurrect
