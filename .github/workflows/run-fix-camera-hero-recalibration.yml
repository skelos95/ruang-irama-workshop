name: Run reliable camera hero recalibration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run reliable camera hero recalibration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply hero camera recalibration fix
        run: python .github/scripts/fix_camera_hero_recalibration.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/fix_camera_hero_recalibration.py .github/workflows/run-fix-camera-hero-recalibration.yml
          git diff --cached --check
          git commit -m "Fix third-person hero recalibration"
          git push
