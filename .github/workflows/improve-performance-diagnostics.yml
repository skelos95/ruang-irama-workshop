name: Improve performance diagnostics HUD

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/improve-performance-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move diagnostics under left player list
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('workshop/ruang_irama.workshop')
          validator_path = Path('tools/validate_workshop.py')
          readme_path = Path('README.md')
          project_path = Path('docs/PROGETTO.md')
          report_path = Path('docs/VALIDAZIONE.md')

          src = source_path.read_text(encoding='utf-8')

          # Remove the old standalone top diagnostics HUD.
          start = src.index('rule("00d - Global: Tampilkan diagnostik performa hanya kepada host")')
          end = src.index('\nrule("01 - Pemain Masuk:', start)
          src = src[:start] + src[end + 1:]

          # Attach diagnostics to the text field of the last LEFT player row.
          rule_start = src.index('rule("02 - Pemain: Pisahkan manusia dari pasukan kaleng")')
          rule_end = src.index('\nrule("02c - Ruang Muncul:', rule_start)
          block = src[rule_start:rule_end]
          marker = '), Null, Left, -99 + Event Player.UrutanHUD, Color(White), Event Player.WarnaNama, Color(White),'
          if block.count(marker) != 1:
              raise SystemExit(f'left HUD marker: expected 1, found {block.count(marker)}')

          hud_count = '3 + Count Of(Global.HudKiriPemain) * 2 + Count Of(Filtered Array(Global.HudMenuPemain, Current Array Element != 0))'
          iwt_count = 'Count Of(Filtered Array(Global.TeksDuniaPemain, Current Array Element != 0)) + Count Of(Filtered Array(Global.TeksDiriPemain, Current Array Element != 0))'
          diag = (
              '), And(Global.DiagnostikPerforma == True, And(Local Player == Host Player, Event Player == Last Of(Sorted Array(Global.PemainManusia, '
              'Player Variable(Current Array Element, UrutanHUD))))) ? Custom String("{0}\\n{1}", Custom String("\\n \\nLOAD {0}% | AVG {1}% | MAX {2}%", '
              'Server Load, Server Load Average, Server Load Peak), Custom String("HUD {0} | IWT {1}", '
              + hud_count + ', ' + iwt_count + ')) : Null, Left, -99 + Event Player.UrutanHUD, Color(White), Event Player.WarnaNama, Color(White),'
          )
          block = block.replace(marker, diag, 1)
          src = src[:rule_start] + block + src[rule_end:]
          source_path.write_text(src, encoding='utf-8')

          # Replace diagnostics validator with the new embedded-HUD contract.
          val = validator_path.read_text(encoding='utf-8')
          func_start = val.index('def check_diagnostics(')
          next_match = re.search(r'\ndef [A-Za-z_][A-Za-z0-9_]*\(', val[func_start + 1:])
          if next_match is None:
              raise SystemExit('next validator function not found')
          func_end = func_start + 1 + next_match.start() + 1
          new_func = '''def check_diagnostics(checks: Checks, source: str, rules: list[Rule]) -> None:\n    clean_source = mask_strings(source)\n    checks.require(\n        "Global.DiagnostikPerforma = Workshop Setting Toggle" in clean_source,\n        "toggle Performance diagnostics non assegnato a Global.DiagnostikPerforma",\n    )\n    toggles = [\n        call for call in call_texts(source, "Workshop Setting Toggle")\n        if "Performance diagnostics" in call\n    ]\n    checks.equal(len(toggles), 1, "Workshop Setting Toggle Performance diagnostics")\n    if toggles:\n        opening = toggles[0].find("(")\n        arguments = top_level_items(toggles[0][opening + 1 : -1])\n        checks.require(\n            len(arguments) >= 3 and arguments[2].strip() == "False",\n            "Performance diagnostics deve essere OFF per impostazione predefinita",\n        )\n    for metric in ("Server Load", "Server Load Average", "Server Load Peak"):\n        checks.require(metric in clean_source, f"diagnostica priva di {metric}")\n\n    left_hud_rules = [\n        rule for rule in rules\n        if code_contains(\n            rule.body,\n            "Global.HudKiriPemain = Append To Array",\n            "Global.DiagnostikPerforma == True",\n            "Local Player == Host Player",\n            "Server Load",\n            "Server Load Average",\n            "Server Load Peak",\n        )\n    ]\n    checks.equal(len(left_hud_rules), 1, "diagnostica integrata nella lista sinistra")\n    if left_hud_rules:\n        diagnostic = mask_strings(left_hud_rules[0].body)\n        checks.require(\n            all(token in diagnostic for token in (\n                "Last Of", "Sorted Array", "Global.PemainManusia", "UrutanHUD",\n            )),\n            "diagnostica non ancorata all'ultimo player della lista sinistra",\n        )\n        checks.require(\n            all(token in diagnostic for token in (\n                "HudKiriPemain", "HudMenuPemain", "TeksDuniaPemain", "TeksDiriPemain",\n            )),\n            "diagnostica priva dei conteggi HUD/IWT",\n        )\n    checks.require(\n        'Custom String("\\n \\nLOAD {0}% | AVG {1}% | MAX {2}%"' in source,\n        "diagnostica priva della riga LOAD compatta o dello spazio superiore",\n    )\n    checks.require(\n        'Custom String("HUD {0} | IWT {1}"' in source,\n        "diagnostica priva della riga HUD/IWT compatta",\n    )\n    checks.require(\n        'rule("00d - Global: Tampilkan diagnostik performa hanya kepada host")' not in source,\n        "vecchio HUD diagnostica separato ancora presente",\n    )\n    inspector_rules = rules_containing(\n        rules, "Global.DiagnostikPerforma == False", "Disable Inspector Recording;"\n    )\n    checks.require(bool(inspector_rules), "Inspector Recording non disattivato con diagnostica OFF")\n\n\n'''
          val = val[:func_start] + new_func + val[func_end:]
          validator_path.write_text(val, encoding='utf-8')

          # Documentation.
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '- Diagnostica prestazionale opzionale, visibile soltanto all\'host e disattivata per impostazione predefinita.',
              '- Diagnostica prestazionale opzionale, visibile soltanto all\'host e disattivata per impostazione predefinita; quando attiva compare in forma compatta sotto l’ultimo player della lista sinistra.',
          )
          readme = readme.replace(
              '- Con `Performance diagnostics` disattivato non viene mantenuta la telemetria Inspector dedicata. Quando è attivo, soltanto l\'host vede carico corrente, medio, picco e conteggi HUD/IWT.',
              '- Con `Performance diagnostics` disattivato non viene mantenuta la telemetria Inspector dedicata. Quando è attivo, soltanto l’host vede sotto la lista sinistra `LOAD / AVG / MAX` e i conteggi `HUD / IWT`.',
          )
          readme_path.write_text(readme, encoding='utf-8')

          project = project_path.read_text(encoding='utf-8')
          project = project.replace(
              'La diagnostica prestazionale opzionale è visibile soltanto all’host.',
              'La diagnostica prestazionale opzionale è visibile soltanto all’host e viene integrata sotto l’ultimo player della lista sinistra, con una riga di separazione e testo compatto `LOAD / AVG / MAX` più `HUD / IWT`.',
          )
          project_path.write_text(project, encoding='utf-8')

          # Keep validation report tied to the source blob and current rule count.
          data = source_path.read_bytes().replace(b'\r\n', b'\n')
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          report = report_path.read_text(encoding='utf-8')
          report, n = re.subn(r'```text\n[0-9a-f]{40}\n```', f'```text\n{blob}\n```', report, count=1)
          if n != 1:
              raise SystemExit('validation report blob marker not found')
          rule_count = len(re.findall(r'(?m)^\s*rule\s*\(', src))
          report = re.sub(
              r'Generi: 100 \| Lingue: 3 \| Regole: \d+ \| Raycast camera: 1',
              f'Generi: 100 | Lingue: 3 | Regole: {rule_count} | Raycast camera: 1',
              report,
              count=1,
          )
          report_path.write_text(report, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/PROGETTO.md docs/VALIDAZIONE.md
          git commit -m "Improve compact performance diagnostics HUD"
          git push origin HEAD:main
