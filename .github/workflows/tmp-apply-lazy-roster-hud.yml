name: Temporary lazy roster HUD patch

on:
  push:
    branches:
      - fix-lazy-roster-hud-20260827

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply lazy roster HUD patch
        run: python .github/maintenance/apply_lazy_roster_hud.py
      - name: Remove temporary staging files
        run: |
          rm -f .github/workflows/tmp-apply-lazy-roster-hud.yml
          rm -f .github/maintenance/apply_lazy_roster_hud.py
          rmdir .github/maintenance 2>/dev/null || true
      - name: Commit patched branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create roster HUD rows after slot assignment"
          git push origin HEAD:fix-lazy-roster-hud-20260827
      - name: Run focused roster tests
        run: |
          python -m unittest \
            tests.test_dummy_bots.DummyBotFeatureTests.test_static_hud_uses_the_reference_grid_without_embedded_label_spacing \
            tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_cached_player_name_drives_roster_and_world_text \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_special_player_roster_main_and_locked_renderers_are_guarded \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_left_roster_rows_start_immediately_below_their_label \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_right_roster_stays_before_the_native_team_status_indicator \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_left_roster_text_cannot_reintroduce_the_client_zero \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_left_diagnostics_remain_inside_the_subheader \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_left_diagnostic_fallback_is_an_empty_string_not_null \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_roster_ready_flag_is_written_after_both_global_aliases
      - name: Validate Workshop source
        run: python tools/validate_workshop.py
      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
