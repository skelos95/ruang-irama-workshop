name: Team Switch Bootstrap

on:
  push:
    branches:
      - fix/team-switch-crash
    paths:
      - .github/workflows/team-switch-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply lightweight team-switch fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_method(text: str, name: str, replacement: str) -> str:
              pattern = re.compile(rf'^    def {re.escape(name)}\b.*?(?=^    def |^if __name__ ==)', re.M | re.S)
              new, count = pattern.subn(replacement.rstrip() + '\n\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'expected one method {name}, found {count}')
              return new

          def patch_workshop(path: str, global_name: str, rule_kw: str, actions_kw: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              start = text.index(f'{rule_kw}("01a - Siklus tim: Reset penuh pada konteks pemain")')
              end = text.index(f'{rule_kw}("01b - Siklus tim: Pekerja penyiapan dari penjadwal global")', start)
              text = text[:start] + text[end:]

              marker = f'{rule_kw}("89a - Subrutin: Proses status cepat pemain")'
              rstart = text.index(marker)
              rend = text.find(f'\n{rule_kw}("', rstart + len(marker))
              if rend < 0:
                  rend = len(text)
              body = text[rstart:rend]
              opening = f'\t{actions_kw}\n\t{{\n'
              pos = body.index(opening) + len(opening)
              owner = f'{global_name}.PemainAktif'
              branch = (
                  f'\t\tIf(And(Is Dummy Bot({owner}) == False, And({owner}.BotOtomatis == False, '
                  f'And(Array Contains({global_name}.PemainManusia, {owner}) == True, '
                  f'And({owner}.PernahDisiapkan == True, {owner}.TimTerakhir != Team Of({owner}))))));\n'
                  '\t\t\t"Perubahan tim pemain terdaftar hanya menyegarkan identitas tim; roster, HUD, menu, pilihan, dan status tidak dibangun ulang."\n'
                  f'\t\t\t{owner}.TimTerakhir = Team Of({owner});\n'
                  f'\t\t\t{owner}.TimSiklusTarget = Team Of({owner});\n'
                  f'\t\t\t{owner}.PindahTimDiproses = False;\n'
                  f'\t\t\t{owner}.SiklusPemainAktif = False;\n'
                  f'\t\t\t{owner}.WaktuSiklusTim = 0;\n'
                  f'\t\t\tIf({global_name}.PemainSiklusGlobal == {owner});\n'
                  f'\t\t\t\t{global_name}.PemainSiklusGlobal = Null;\n'
                  f'\t\t\t\t{global_name}.WaktuSiklusGlobal = Total Time Elapsed + 0.250;\n'
                  '\t\t\tEnd;\n'
                  '\t\tEnd;\n'
              )
              body = body[:pos] + branch + body[pos:]
              text = text[:rstart] + body + text[rend:]
              p.write_text(text, encoding='utf-8')

          patch_workshop('workshop/ruang_irama.it-IT.workshop', 'Globale', 'regola', 'azioni')
          patch_workshop('tests/fixtures/semantic_reference.txt', 'Global', 'rule', 'actions')

          # Runtime regression: a registered team switch must stay on the scheduler fast path.
          p = Path('tests/test_runtime_maintenance.py')
          text = p.read_text(encoding='utf-8')
          replacement = '''    def test_team_switch_is_lightweight_and_leave_cleanup_is_exact(self):
              for source, global_name, rule_kw in ((self.it, "Globale", "regola"), (self.en, "Global", "rule")):
                  self.assertNotIn(f'{rule_kw}("01a - Siklus tim: Reset penuh pada konteks pemain")', source)
                  fast = _rule(source, "89a - Subrutin: Proses status cepat pemain")
                  owner = f"{global_name}.PemainAktif"
                  marker = f"{owner}.TimTerakhir != Team Of({owner})"
                  self.assertIn(marker, fast)
                  branch = fast[fast.index(marker):fast.index("End;", fast.index(marker)) + len("End;")]
                  for token in (
                      f"Array Contains({global_name}.PemainManusia, {owner}) == True",
                      f"{owner}.PernahDisiapkan == True",
                      f"{owner}.TimTerakhir = Team Of({owner});",
                      f"{owner}.TimSiklusTarget = Team Of({owner});",
                      f"{owner}.PindahTimDiproses = False;",
                      f"{owner}.SiklusPemainAktif = False;",
                      f"{owner}.WaktuSiklusTim = 0;",
                  ):
                      self.assertIn(token, branch)
                  for forbidden in (
                      "Call Subroutine(TenangkanPemain);",
                      "Call Subroutine(BersihkanPemain);",
                      "Call Subroutine(SiapkanPemain);",
                      "Wait(",
                      "Loop;",
                      "For Global Variable(",
                  ):
                      self.assertNotIn(forbidden, branch)

                  setup_worker = _rule(source, "01b - Siklus tim: Pekerja penyiapan dari penjadwal global")
                  self.assertIn(f"Array Contains({global_name}.PemainManusia, Event Player) == False;", setup_worker)
                  self.assertIn("Call Subroutine(TenangkanPemain);", setup_worker)
                  self.assertIn("Call Subroutine(SiapkanPemain);", setup_worker)

                  leave = next(body for name, body in _rules(source) if "Pemain Keluar" in name and "Player Left Match;" in body)
                  self.assertIn("Wait(0.500, Ignore Condition);", leave)
                  self.assertIn("Abort If(Entity Exists(Event Player) == True);", leave)
                  self.assertIn("Call Subroutine(BersihkanPemain);", leave)
          '''
          text = replace_method(text, 'test_team_switch_uses_full_cleanup_and_leave_cleanup_is_exact', replacement)
          p.write_text(text, encoding='utf-8')

          # Ghost/Fly regression follows the same lightweight branch instead of the removed per-player reset rule.
          p = Path('tests/test_ghost_fly.py')
          text = p.read_text(encoding='utf-8')
          old = re.compile(
              r'            fast = subroutine\(source, "ProsesCepatPemain"\).*?'
              r'            self\.assertNotIn\("Wait\(", team_rule\)\n',
              re.S,
          )
          new = '''            fast = subroutine(source, "ProsesCepatPemain")
              self.assertNotIn("Call Subroutine(TenangkanPemain);", fast)
              self.assertNotIn("Call Subroutine(BersihkanPemain);", fast)
              owner = f"{global_name}.PemainAktif"
              marker = f"{owner}.TimTerakhir != Team Of({owner})"
              self.assertIn(marker, fast)
              team_branch = fast[fast.index(marker):fast.index("End;", fast.index(marker)) + len("End;")]
              self.assertIn(f"{owner}.TimTerakhir = Team Of({owner});", team_branch)
              self.assertIn(f"{owner}.TimSiklusTarget = Team Of({owner});", team_branch)
              self.assertNotIn("Call Subroutine(", team_branch)
              self.assertNotIn("Wait(", team_branch)
          '''
          text, count = old.subn(new, text, count=1)
          if count != 1:
              raise SystemExit(f'ghost/fly team switch block replacement count={count}')
          p.write_text(text, encoding='utf-8')

          # Validator: locate team switch in the scheduler fast path and require it to remain lightweight.
          p = Path('tools/validate_workshop.py')
          text = p.read_text(encoding='utf-8')
          helper = '''def team_switch_worker(rules: list[Rule]) -> Rule | None:
              fast = rule_by_subroutine(rules, "ProsesCepatPemain")
              if fast is None:
                  return None
              marker = "Global.PemainAktif.TimTerakhir != Team Of(Global.PemainAktif)"
              return fast if marker in mask_strings(fast.body) else None
          '''
          text, count = re.subn(
              r'def team_switch_worker\(rules: list\[Rule\]\) -> Rule \| None:\n.*?(?=\ndef )',
              helper.rstrip() + '\n\n', text, count=1, flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'team_switch_worker replacement count={count}')

          # Lightweight team-switch wording is current again; only the obsolete spawned/alive claim stays forbidden.
          for label in (
              'team-switch senza alcuna ricostruzione HUD',
              'team-switch descritto come solo aggiornamento dei campi Team',
          ):
              idx = text.find(f'        "{label}",')
              if idx < 0:
                  raise SystemExit(f'obsolete pattern not found: {label}')
              start = text.rfind('    (\n', 0, idx)
              end = text.find('    ),\n', idx)
              if start < 0 or end < 0:
                  raise SystemExit(f'cannot bound obsolete pattern: {label}')
              text = text[:start] + text[end + len('    ),\n'):]

          # Remove the old assertion that the fast path must not observe a Team mismatch.
          text, count = re.subn(
              r'\s*checks\.require\(\s*"Global\.PemainAktif\.TimTerakhir != Team Of\(Global\.PemainAktif\)"\s*not in mask_strings\(fast\.body\),\s*"[^"]*"\s*\)\n',
              '\n', text, count=1,
          )
          if count != 1:
              raise SystemExit(f'old fast-path negative assertion replacement count={count}')

          lightweight_validation = '''    team_switch = team_switch_worker(rules)
              checks.require(team_switch is not None, "dispatcher team-switch leggero assente")
              if team_switch:
                  actions = rule_block(team_switch, "actions") or ""
                  masked_actions = mask_strings(actions)
                  marker = "Global.PemainAktif.TimTerakhir != Team Of(Global.PemainAktif)"
                  marker_pos = masked_actions.find(marker)
                  checks.require(marker_pos >= 0, "dispatcher team-switch leggero: mismatch Team assente")
                  branches = conditional_branches_containing(actions, marker_pos) if marker_pos >= 0 else []
                  switch_branch = mask_strings(branches[0]) if branches else ""
                  checks.require(bool(switch_branch), "dispatcher team-switch leggero: ramo condizionale assente")
                  for token in (
                      "Is Dummy Bot(Global.PemainAktif) == False",
                      "Global.PemainAktif.BotOtomatis == False",
                      "Array Contains(Global.PemainManusia, Global.PemainAktif) == True",
                      "Global.PemainAktif.PernahDisiapkan == True",
                      marker,
                  ):
                      checks.require(token in switch_branch, f"dispatcher team-switch leggero senza guardia: {token}")
                  for token in (
                      "Global.PemainAktif.TimTerakhir = Team Of(Global.PemainAktif);",
                      "Global.PemainAktif.TimSiklusTarget = Team Of(Global.PemainAktif);",
                      "Global.PemainAktif.PindahTimDiproses = False;",
                      "Global.PemainAktif.SiklusPemainAktif = False;",
                      "Global.PemainAktif.WaktuSiklusTim = 0;",
                  ):
                      checks.require(token in switch_branch, f"dispatcher team-switch leggero incompleto: {token}")
                  for forbidden in (
                      "Call Subroutine(TenangkanPemain);",
                      "Call Subroutine(BersihkanPemain);",
                      "Call Subroutine(SiapkanPemain);",
                      "Wait(",
                      "Loop;",
                      "For Global Variable(",
                  ):
                      checks.require(forbidden not in switch_branch,
                                     f"dispatcher team-switch leggero non deve eseguire lavoro pesante: {forbidden}")
          '''
          roster_anchor = '    roster_hud = next(('
          rend = text.index(roster_anchor)
          rstart = text.rfind('    team_switch = team_switch_worker(rules)', 0, rend)
          if rstart < 0:
              raise SystemExit('lifecycle team-switch validation block not found')
          text = text[:rstart] + lightweight_validation.rstrip() + '\n\n' + text[rend:]

          ghost_validation = '''    team_switch = team_switch_worker(rules)
              checks.require(team_switch is not None, "Ghost/Fly: refresh leggero cambio squadra assente")
              if team_switch:
                  actions = rule_block(team_switch, "actions") or ""
                  marker = "Global.PemainAktif.TimTerakhir != Team Of(Global.PemainAktif)"
                  pos = mask_strings(actions).find(marker)
                  branches = conditional_branches_containing(actions, pos) if pos >= 0 else []
                  switch_branch = mask_strings(branches[0]) if branches else ""
                  for token in ("ModeHantuAktif", "ModeTerbangAktif", "FisikaHantuTerbangDiterapkan"):
                      checks.require(re.search(rf"{token}\\s*=(?!=)", switch_branch) is None,
                                     f"Ghost/Fly cambio squadra leggero non deve azzerare {token}")
                  checks.require("Call Subroutine(" not in switch_branch,
                                 "Ghost/Fly cambio squadra leggero non deve chiamare cleanup/setup")
          '''
          gend = text.index('    timestamp_writers: list[tuple[str, str]] = []')
          gstart = text.rfind('    team_switch = team_switch_worker(rules)', 0, gend)
          if gstart < 0:
              raise SystemExit('ghost/fly team-switch validation block not found')
          text = text[:gstart] + ghost_validation.rstrip() + '\n\n' + text[gend:]
          p.write_text(text, encoding='utf-8')

          # Validator regression tests: assert the lightweight branch and its ownership guards.
          p = Path('tests/test_validate_workshop.py')
          text = p.read_text(encoding='utf-8')
          replacement = '''    def test_team_switch_dispatcher_requires_lightweight_state_commit(self) -> None:
              fast = self.rule(lambda rule: validator.subroutine_target(rule) == "ProsesCepatPemain")
              marker = "Global.PemainAktif.TimTerakhir != Team Of(Global.PemainAktif)"
              self.assertIn(marker, fast.body)
              mutated = self.replace_in_rule(fast, marker, "False")
              self.assert_rejected(mutated, "dispatcher team-switch leggero")
          '''
          text = replace_method(text, 'test_team_switch_detector_requires_full_cleanup_calls', replacement)
          replacement = '''    def test_team_switch_dispatcher_requires_registered_identity_guards(self) -> None:
              fast = self.rule(lambda rule: validator.subroutine_target(rule) == "ProsesCepatPemain")
              for token in (
                  "Is Dummy Bot(Global.PemainAktif) == False",
                  "Global.PemainAktif.BotOtomatis == False",
                  "Array Contains(Global.PemainManusia, Global.PemainAktif) == True",
                  "Global.PemainAktif.PernahDisiapkan == True",
              ):
                  with self.subTest(token=token):
                      mutated = self.replace_in_rule(fast, token, "True")
                      self.assert_rejected(mutated, "dispatcher team-switch leggero senza guardia")
          '''
          text = replace_method(text, 'test_team_switch_worker_requires_owner_and_registered_identity_guards', replacement)
          replacement = '''    def test_obsolete_current_team_switch_claim_is_rejected(self) -> None:
              claim = "Dopo un cambio squadra il refresh leggero attende che il player sia spawned e vivo."
              mutated = self.source + f"\\n// {claim}\\n"
              self.assert_rejected(mutated, "team-switch attende spawned e vivo")
          '''
          text = replace_method(text, 'test_obsolete_current_team_switch_claim_is_rejected', replacement)
          p.write_text(text, encoding='utf-8')

          # Current docs: registered team switches are lightweight; true leave/rejoin still owns cleanup/setup.
          p = Path('docs/PROGETTO.md')
          text = p.read_text(encoding='utf-8')
          start = text.index('### Cambio squadra')
          end = text.find('\n### ', start + len('### Cambio squadra'))
          if end < 0:
              end = len(text)
          section = '''### Cambio squadra

          Il cambio Team 1 ↔ Team 2 di un umano già registrato è intenzionalmente leggero. Il dispatcher globale `ProsesCepatPemain` rileva il mismatch tra `TimTerakhir` e `Team Of`, aggiorna soltanto l'identità Team e i latch lifecycle e, se necessario, rilascia il lock globale. Non richiama `TenangkanPemain`, `BersihkanPemain` o `SiapkanPemain`, non ricostruisce HUD/roster e non esegue reset engine durante la transizione di squadra.

          Cleanup completo e setup fresco restano riservati a una vera uscita/rejoin o a una nuova entità non ancora registrata. In questo modo il cambio squadra non concentra distruzione HUD, reset effetti, scansioni roster e riclassificazione nello stesso frame in cui il motore trasferisce il player.
          '''
          text = text[:start] + section.rstrip() + '\n' + text[end:]
          p.write_text(text, encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'cambio squadra e leave/rejoin passano dal reset completo dello stato engine e dal setup iniziale.',
              'il cambio squadra di un umano già registrato preserva lo stato e aggiorna solo l’identità Team; il reset completo resta per un vero leave/rejoin.',
          )
          p.write_text(text, encoding='utf-8')

          p = Path('docs/TEST.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'la 0.8.1 introduce il reset completo al cambio squadra,',
              'la 0.8.1 include un refresh leggero e crash-safe al cambio squadra,',
          )
          p.write_text(text, encoding='utf-8')

          p = Path('docs/VALIDAZIONE.md')
          text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'- cambio squadra di un umano registrato implementato come reset completo.*?(?=\n- )',
              '- cambio squadra di un umano registrato gestito nel fast-path globale come refresh leggero: aggiorna Team/latch senza `TenangkanPemain`, `BersihkanPemain`, `SiapkanPemain`, `Wait`, `Loop` o scansioni roster;',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace(
              '- assenza del vecchio worker/consumer pending dedicato: il team-switch non usa più il modello pending leggero;',
              '- assenza di un worker per-player dedicato al team-switch: il refresh leggero resta nel dispatcher globale già serializzato;',
          )
          text = text.replace(
              '- cambio squadra e leave/rejoin passano da setup fresco: preferenze e cursori tornano ai default;',
              '- cambio squadra preserva preferenze, menu e HUD; solo leave/rejoin passa da setup fresco e default;',
          )
          p.write_text(text, encoding='utf-8')

          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          anchor = 'Stato: **live-pending**.\n'
          note = ('\n- Corretto il crash al cambio squadra: un umano già registrato ora usa un refresh Team leggero nel dispatcher globale, '
                  'senza cleanup/setup, reset engine o ricostruzione roster nello stesso frame; il cleanup completo resta riservato al vero leave/rejoin.\n')
          if note.strip() not in text:
              text = text.replace(anchor, anchor + note, 1)
          p.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/team-switch-bootstrap.yml

      - name: Validate focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_workshop.py tests/test_runtime_maintenance.py tests/test_validate_workshop.py tests/test_ghost_fly.py
          python -m unittest tests.test_runtime_maintenance tests.test_ghost_fly tests.test_roster_rejoin_regressions tests.test_validate_workshop
          python tools/validate_workshop.py
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
          git diff --check

      - name: Commit validated fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix team-switch crash with lightweight lifecycle"
          git push origin HEAD:fix/team-switch-crash
