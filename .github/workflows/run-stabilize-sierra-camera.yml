name: Run Sierra-specific camera stabilization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Sierra-specific camera stabilization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Sierra camera stabilization
        run: python .github/scripts/stabilize_sierra_camera.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/stabilize_sierra_camera.py .github/workflows/run-stabilize-sierra-camera.yml
          git diff --cached --check
          git commit -m "Stabilize Sierra third-person camera"
          git push
