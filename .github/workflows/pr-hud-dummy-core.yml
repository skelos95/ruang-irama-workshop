name: One-shot PR Dummy Damage Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'chatgpt/dummy-damage-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/dummy-damage-cleanup
          persist-credentials: true

      - name: Patch dummy damage and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch_lock(path: Path, start_marker: str, end_marker: str) -> None:
              text = path.read_text(encoding='utf-8')
              start = text.find(start_marker)
              end = text.find(end_marker, start + 1)
              if start < 0 or end < 0:
                  raise SystemExit(f'{path}: bot lock markers missing')
              block = text[start:end]
              if 'Set Damage Received(Event Player, 0);' in block:
                  block = block.replace('Set Damage Received(Event Player, 0);', 'Set Damage Received(Event Player, 100);', 1)
              elif 'Set Damage Received(Event Player, 100);' not in block:
                  anchor = '\t\tSet Knockback Dealt(Event Player, 0);\n'
                  if block.count(anchor) != 1:
                      raise SystemExit(f'{path}: expected one damage anchor, got {block.count(anchor)}')
                  block = block.replace(anchor, anchor + '\t\tSet Damage Received(Event Player, 100);\n', 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding='utf-8')

          patch_lock(
              Path('workshop/ruang_irama.it-IT.workshop'),
              'regola("92 - Subrutin: Kunci bot/dummy, kaki tetap bisa bergerak")',
              'regola("91o - Subrutin: Gambar menu pilihan pemain")',
          )
          patch_lock(
              Path('tests/fixtures/semantic_reference.txt'),
              'rule("92 - Subrutin: Kunci bot/dummy, kaki tetap bisa bergerak")',
              'rule("91o - Subrutin: Gambar menu pilihan pemain")',
          )

          test_path = Path('tests/test_dummy_bots.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'def test_dummy_receives_normal_damage' not in tests:
              marker = '    def test_dummy_faces_nearest_living_human_without_extra_loop(self):\n'
              method = '''    def test_dummy_receives_normal_damage(self):\n        self.assertEqual(self.it.count("Set Damage Received(Event Player, 100);"), 1)\n        self.assertEqual(self.en.count("Set Damage Received(Event Player, 100);"), 1)\n        self.assertNotIn("Set Damage Received(Event Player, 0);", self.it)\n        self.assertNotIn("Set Damage Received(Event Player, 0);", self.en)\n\n'''
              if marker not in tests:
                  raise SystemExit('dummy test insertion marker missing')
              tests = tests.replace(marker, method + marker, 1)
              test_path.write_text(tests, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git diff --check
          python -m unittest tests.test_dummy_bots
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tests/test_dummy_bots.py
          git commit -m "Allow player damage to dummy bots"
          git push origin HEAD:chatgpt/dummy-damage-cleanup
