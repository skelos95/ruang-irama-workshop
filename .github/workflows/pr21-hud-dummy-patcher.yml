name: Temporary PR21 HUD and dummy patcher

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'chatgpt/fix-first-dummy-spawn-hud'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-first-dummy-spawn-hud
          fetch-depth: 0

      - name: Apply live HUD and first-spawn fixes
        shell: bash
        run: |
          if [ ! -f .github/pr21-hud-dummy-trigger ]; then
            echo "Already patched; nothing to do."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          it_path = root / 'workshop' / 'ruang_irama.it-IT.workshop'
          en_path = root / 'tests' / 'fixtures' / 'semantic_reference.txt'
          test_path = root / 'tests' / 'test_dummy_bots.py'
          readme_path = root / 'README.md'
          changelog_path = root / 'CHANGELOG.md'
          project_path = root / 'docs' / 'PROGETTO.md'

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          it = it_path.read_text(encoding='utf-8')
          en = en_path.read_text(encoding='utf-8')

          # Main HUD: mirror the live reference with independent sort rows.
          it_start = it.index('\t\tCreate HUD Text(Globale.PemainManusia, Null,', it.index('Disable Inspector Recording;'))
          it_end = it.index('\t\tGlobale.Siap = True;', it_start)
          it_hud = '''\t\tCreate HUD Text(Globale.PemainManusia, Null, Null, Custom String("{0}    {1}", Custom String("CHILL DEDICATED SERVER"), Globale.TeksWaktuServer), Top, 0, Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Globale.RGB, Visible To String and Color, Visible Never);
\t\tCreate HUD Text(Globale.PemainManusia, Null, Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("SERVER LOCATION: {0}", Globale.NamaLokasiInggris[Globale.IndeksLokasiServer]) : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("LOKASI SERVER: {0}", Globale.NamaLokasiIndonesia[Globale.IndeksLokasiServer]) : Custom String("ตำแหน่งเซิร์ฟเวอร์: {0}", Globale.NamaLokasiThai[Globale.IndeksLokasiServer]), Null, Top, 1, Custom Color(255, 255, 255, 255), Custom Color(80, 235, 255, 255), Custom Color(255, 255, 255, 255), Visible To and String, Visible Never);
\t\tCreate HUD Text(Globale.PemainManusia, Null, Null, Custom String(" "), Top, 2, Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Visible To and String, Visible Never);
\t\tCreate HUD Text(Globale.PemainManusia, Null, Null, Custom String("MENU"), Top, 3, Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Globale.RGB, Visible To String and Color, Visible Never);
\t\tCreate HUD Text(Globale.PemainManusia, Null, Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("HOLD {0}:", Input Binding String(Button(Crouch))) : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("TAHAN {0}:", Input Binding String(Button(Crouch))) : Custom String("กด {0} ค้าง:", Input Binding String(Button(Crouch))), Null, Left, -2, Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Visible To and String, Visible Never);
\t\tCreate HUD Text(Globale.PemainManusia, Null, Custom String(" "), Null, Left, -1, Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Visible To and String, Visible Never);
\t\tCreate HUD Text(Globale.PemainManusia, Null, Null, Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("LOBBY & CHILL TIME") : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("LOBI & WAKTU SANTAI") : Custom String("ล็อบบี้ & เวลาชิล"), Left, 0, Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Custom Color(70, 225, 255, 255), Visible To and String, Visible Never);
\t\tCreate HUD Text(Globale.PemainManusia, Null, Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("HOLD {0} 0.5 SEC", Input Binding String(Button(Melee))) : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("TAHAN {0} 0,5 DTK", Input Binding String(Button(Melee))) : Custom String("กด {0} 0.5 วิ", Input Binding String(Button(Melee))), Null, Right, -2, Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Visible To and String, Visible Never);
\t\tCreate HUD Text(Globale.PemainManusia, Null, Null, Custom String("  "), Right, -1, Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Visible To and String, Visible Never);
\t\tCreate HUD Text(Globale.PemainManusia, Null, Null, Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("PLAYER VIBES") : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("MUSIK PEMAIN") : Custom String("เพลงของผู้เล่น"), Right, 0, Custom Color(255, 255, 255, 255), Custom Color(255, 255, 255, 255), Custom Color(210, 110, 255, 255), Visible To and String, Visible Never);
'''
          it = it[:it_start] + it_hud + it[it_end:]

          en_start = en.index('\t\tCreate HUD Text(Global.PemainManusia, Null,', en.index('Disable Inspector Recording;'))
          en_end = en.index('\t\tGlobal.Siap = True;', en_start)
          en_hud = '''\t\tCreate HUD Text(Global.PemainManusia, Null, Null, Custom String("{0}    {1}", Custom String("CHILL DEDICATED SERVER"), Global.TeksWaktuServer), Top, 0, Color(White), Color(White), Global.RGB, Visible To String and Color, Visible Never);
\t\tCreate HUD Text(Global.PemainManusia, Null, Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("SERVER LOCATION: {0}", Global.NamaLokasiInggris[Global.IndeksLokasiServer]) : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("LOKASI SERVER: {0}", Global.NamaLokasiIndonesia[Global.IndeksLokasiServer]) : Custom String("ตำแหน่งเซิร์ฟเวอร์: {0}", Global.NamaLokasiThai[Global.IndeksLokasiServer]), Null, Top, 1, Color(White), Custom Color(80, 235, 255, 255), Color(White), Visible To and String, Visible Never);
\t\tCreate HUD Text(Global.PemainManusia, Null, Null, Custom String(" "), Top, 2, Color(White), Color(White), Color(White), Visible To and String, Visible Never);
\t\tCreate HUD Text(Global.PemainManusia, Null, Null, Custom String("MENU"), Top, 3, Color(White), Color(White), Global.RGB, Visible To String and Color, Visible Never);
\t\tCreate HUD Text(Global.PemainManusia, Null, Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("HOLD {0}:", Input Binding String(Button(Crouch))) : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("TAHAN {0}:", Input Binding String(Button(Crouch))) : Custom String("กด {0} ค้าง:", Input Binding String(Button(Crouch))), Null, Left, -2, Color(White), Color(White), Color(White), Visible To and String, Visible Never);
\t\tCreate HUD Text(Global.PemainManusia, Null, Custom String(" "), Null, Left, -1, Color(White), Color(White), Color(White), Visible To and String, Visible Never);
\t\tCreate HUD Text(Global.PemainManusia, Null, Null, Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("LOBBY & CHILL TIME") : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("LOBI & WAKTU SANTAI") : Custom String("ล็อบบี้ & เวลาชิล"), Left, 0, Color(White), Color(White), Custom Color(70, 225, 255, 255), Visible To and String, Visible Never);
\t\tCreate HUD Text(Global.PemainManusia, Null, Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("HOLD {0} 0.5 SEC", Input Binding String(Button(Melee))) : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("TAHAN {0} 0,5 DTK", Input Binding String(Button(Melee))) : Custom String("กด {0} 0.5 วิ", Input Binding String(Button(Melee))), Null, Right, -2, Color(White), Color(White), Color(White), Visible To and String, Visible Never);
\t\tCreate HUD Text(Global.PemainManusia, Null, Null, Custom String("  "), Right, -1, Color(White), Color(White), Color(White), Visible To and String, Visible Never);
\t\tCreate HUD Text(Global.PemainManusia, Null, Null, Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("PLAYER VIBES") : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("MUSIK PEMAIN") : Custom String("เพลงของผู้เล่น"), Right, 0, Color(White), Color(White), Custom Color(210, 110, 255, 255), Visible To and String, Visible Never);
'''
          en = en[:en_start] + en_hud + en[en_end:]

          if it.count('-99 + Event Player.UrutanHUD') != 2 or en.count('-99 + Event Player.UrutanHUD') != 2:
              raise SystemExit('Unexpected roster HUD sort-order cardinality')
          it = it.replace('-99 + Event Player.UrutanHUD', '1 + Event Player.UrutanHUD')
          en = en.replace('-99 + Event Player.UrutanHUD', '1 + Event Player.UrutanHUD')
          it = once(it, '3 + Count Of(Filtered Array(Globale.HudKiriPemain', '10 + Count Of(Filtered Array(Globale.HudKiriPemain', 'Italian diagnostic static HUD count')
          en = once(en, '3 + Count Of(Filtered Array(Global.HudKiriPemain', '10 + Count Of(Filtered Array(Global.HudKiriPemain', 'English diagnostic static HUD count')

          # First spawn: never create at Null. Wait until the team exposes a real Spawn Point.
          for team in (1, 2):
              it = once(it,
                  f'\t\tNumber Of Slots(Team {team}) > 0;\n\t\tCount Of(Filtered Array(All Players(Team {team}), Is Dummy Bot(Current Array Element) == True)) == 0;',
                  f'\t\tNumber Of Slots(Team {team}) > 0;\n\t\tCount Of(Spawn Points(Team {team})) > 0;\n\t\tCount Of(Filtered Array(All Players(Team {team}), Is Dummy Bot(Current Array Element) == True)) == 0;',
                  f'IT team {team} spawn guard')
              it = once(it,
                  f'Create Dummy Bot(Tutti gli eroi, Team {team}, -1, Null, Null);',
                  f'Create Dummy Bot(Tutti gli eroi, Team {team}, -1, Position Of(First Of(Spawn Points(Team {team}))), Null);',
                  f'IT team {team} create position')
              en = once(en,
                  f'\t\tNumber Of Slots(Team {team}) > 0;\n\t\tCount Of(Filtered Array(All Players(Team {team}), Is Dummy Bot(Current Array Element) == True)) == 0;',
                  f'\t\tNumber Of Slots(Team {team}) > 0;\n\t\tCount Of(Spawn Points(Team {team})) > 0;\n\t\tCount Of(Filtered Array(All Players(Team {team}), Is Dummy Bot(Current Array Element) == True)) == 0;',
                  f'EN team {team} spawn guard')
              en = once(en,
                  f'Create Dummy Bot(All Heroes, Team {team}, -1, Null, Null);',
                  f'Create Dummy Bot(All Heroes, Team {team}, -1, Position Of(First Of(Spawn Points(Team {team}))), Null);',
                  f'EN team {team} create position')

          it_path.write_text(it, encoding='utf-8')
          en_path.write_text(en, encoding='utf-8')

          test_path.write_text('''from pathlib import Path
import unittest

ROOT = Path(__file__).resolve().parents[1]


class DummyBotFeatureTests(unittest.TestCase):
    @classmethod
    def setUpClass(cls):
        cls.it = (ROOT / "workshop" / "ruang_irama.it-IT.workshop").read_text(encoding="utf-8")
        cls.en = (ROOT / "tests" / "fixtures" / "semantic_reference.txt").read_text(encoding="utf-8")

    def test_primary_hud_matches_live_reference_rows(self):
        self.assertIn('Custom String("HOLD {0}:", Input Binding String(Button(Crouch)))', self.it)
        self.assertIn('Custom String("HOLD {0} 0.5 SEC", Input Binding String(Button(Melee)))', self.it)
        self.assertIn('Custom String("MENU")', self.it)
        for token in ('Left, -2,', 'Left, -1,', 'Left, 0,', 'Right, -2,', 'Right, -1,', 'Right, 0,', 'Top, 0,', 'Top, 1,', 'Top, 2,', 'Top, 3,'):
            self.assertIn(token, self.it)
        self.assertEqual(self.it.count('1 + Event Player.UrutanHUD'), 2)
        self.assertNotIn('-99 + Event Player.UrutanHUD', self.it)
        self.assertIn('10 + Count Of(Filtered Array(Globale.HudKiriPemain', self.it)

    def test_exactly_one_creation_rule_per_team_uses_real_spawn_point(self):
        self.assertEqual(self.it.count("Create Dummy Bot(Tutti gli eroi, Team 1, -1, Position Of(First Of(Spawn Points(Team 1))), Null);"), 1)
        self.assertEqual(self.it.count("Create Dummy Bot(Tutti gli eroi, Team 2, -1, Position Of(First Of(Spawn Points(Team 2))), Null);"), 1)
        self.assertEqual(self.en.count("Create Dummy Bot(All Heroes, Team 1, -1, Position Of(First Of(Spawn Points(Team 1))), Null);"), 1)
        self.assertEqual(self.en.count("Create Dummy Bot(All Heroes, Team 2, -1, Position Of(First Of(Spawn Points(Team 2))), Null);"), 1)
        self.assertIn("Count Of(Spawn Points(Team 1)) > 0;", self.it)
        self.assertIn("Count Of(Spawn Points(Team 2)) > 0;", self.it)
        self.assertNotIn("Create Dummy Bot(Tutti gli eroi, Team 1, -1, Null, Null);", self.it)
        self.assertNotIn("Create Dummy Bot(Tutti gli eroi, Team 2, -1, Null, Null);", self.it)

    def test_runtime_team_literals_stay_english_in_it_clipboard(self):
        self.assertIn("Number Of Slots(Team 1)", self.it)
        self.assertIn("Number Of Slots(Team 2)", self.it)
        self.assertIn("All Players(Team 1)", self.it)
        self.assertIn("All Players(Team 2)", self.it)
        self.assertNotIn("Number Of Slots(Squadra 1)", self.it)
        self.assertNotIn("Number Of Slots(Squadra 2)", self.it)

    def test_dummy_respawn_is_30_seconds(self):
        self.assertIn("Set Respawn Max Time(Event Player, 30);", self.it)

    def test_spawn_teleport_uses_safe_mode_specific_destinations(self):
        self.assertIn("Is In Spawn Room(Event Player) == True;", self.it)
        self.assertIn("Current Game Mode == Game Mode(Trasporto)", self.it)
        self.assertIn("Current Game Mode == Game Mode(Ibrida)", self.it)
        self.assertIn("Current Game Mode == Game Mode(Cattura la Bandiera)", self.it)
        self.assertIn("Current Game Mode == Game Mode(Scorta)", self.it)
        self.assertIn("Payload Position", self.it)
        self.assertIn("Flag Position(Opposite Team Of(Team Of(Event Player)))", self.it)
        self.assertIn("Is On Objective(Current Array Element) == True", self.it)
        self.assertIn("Nearest Walkable Position", self.it)
        self.assertNotIn("All Players On Objective(All Teams)", self.it)
        self.assertNotIn("Teleport(Event Player, Objective Position(Objective Index));", self.it)

    def test_dummy_faces_nearest_living_human_without_extra_loop(self):
        self.assertIn("Start Facing(Event Player", self.it)
        self.assertIn("Sorted Array(Filtered Array(Globale.PemainManusia", self.it)
        self.assertIn("Direction and Turn Rate", self.it)
        self.assertIn("Stop Facing(Event Player);", self.it)
        self.assertEqual(self.it.count("Loop If Condition Is True;"), 1)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme = once(readme,
              '- Un dummy nativo per squadra quando esiste uno slot libero, respawn massimo 30 s e uscita dalla Spawn Room verso una destinazione mode-specific percorribile.',
              '- Un dummy nativo per squadra quando esiste uno slot libero: il primo spawn nasce direttamente sul primo Spawn Point valido della squadra, il respawn massimo resta 30 s e l’uscita dalla Spawn Room usa una destinazione mode-specific percorribile.',
              'README dummy summary')
          readme = once(readme,
              '- Menu e liste separano contenuto e comandi con la spaziatura HUD prevista.',
              '- Menu e liste separano contenuto e comandi con la spaziatura HUD prevista. L’HUD principale usa righe indipendenti `HOLD → vuoto → titolo → lista` sui lati e `server/time → location → vuoto → MENU` al centro.',
              'README HUD layout')
          readme_path.write_text(readme, encoding='utf-8')

          changelog = changelog_path.read_text(encoding='utf-8')
          needle = '- Confermati massimo un dummy nativo per squadra e respawn massimo 30 secondi, con regressioni statiche dedicate al routing dalla Spawn Room.\n'
          changelog = once(changelog, needle, needle + '- Corretto il primo spawn dei dummy: vengono creati direttamente sul primo Spawn Point valido della propria squadra, evitando la morte iniziale osservata con posizione `Null`.\n- HUD principale riallineato al layout live di riferimento con righe indipendenti per HOLD, spacer, titolo/lista e blocco centrale server/location/MENU.\n', 'CHANGELOG')
          changelog_path.write_text(changelog, encoding='utf-8')

          project = project_path.read_text(encoding='utf-8')
          old = 'Per i dummy nativi il runtime mantiene al massimo un\'istanza per Team 1 e una per Team 2 quando esiste uno slot libero. Il tempo massimo di respawn è 30 secondi. Quando un dummy vivo si trova nella Spawn Room, la regola di uscita sceglie una destinazione coerente con la modalità e la passa sempre da `Nearest Walkable Position`; se la posizione richiesta non è valida, non viene eseguito alcun teleport e il controllo viene rivalutato al ciclo successivo.'
          new = 'Per i dummy nativi il runtime mantiene al massimo un\'istanza per Team 1 e una per Team 2 quando esiste uno slot libero. La creazione attende un vero Spawn Point e usa direttamente il primo Spawn Point valido della squadra, così anche il primo spawn nasce su geometria valida; il tempo massimo di respawn è 30 secondi. Quando un dummy vivo si trova nella Spawn Room, la regola di uscita sceglie una destinazione coerente con la modalità e la passa sempre da `Nearest Walkable Position`; se la posizione richiesta non è valida, non viene eseguito alcun teleport e il controllo viene rivalutato al ciclo successivo.'
          project = once(project, old, new, 'PROGETTO dummy lifecycle')
          hud_old = 'Il nuovo Team Status Indicator del client non deve essere coperto da blocchi Top/Left/Right: il test live verifica leggibilità, spaziatori e assenza di collisioni.'
          hud_new = 'L’HUD principale usa righe indipendenti: sui lati `HOLD` a sort -2, spacer a -1, titolo a 0 e roster da 1 in poi; al centro server/time a 0, location a 1, spacer a 2 e `MENU` a 3. Il nuovo Team Status Indicator del client non deve essere coperto da blocchi Top/Left/Right: il test live verifica leggibilità, spaziatori e assenza di collisioni.'
          project = once(project, hud_old, hud_new, 'PROGETTO HUD layout')
          project_path.write_text(project, encoding='utf-8')
          PY

          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py

      - name: Commit patched branch
        shell: bash
        run: |
          rm -f .github/pr21-hud-dummy-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tests/test_dummy_bots.py README.md CHANGELOG.md docs/PROGETTO.md .github/pr21-hud-dummy-trigger
          git commit -m "Fix first dummy spawn and primary HUD layout"
          git push origin HEAD:chatgpt/fix-first-dummy-spawn-hud
