name: Fix menu text and current selection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-menu-text-current.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch menu text and current values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('workshop/ruang_irama.workshop')
          src = path.read_text(encoding='utf-8')

          def replace_exact(text, old, new, expected=1, label='replacement'):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected}, found {count}')
              return text.replace(old, new)

          # The previous patch accidentally emitted a literal backslash followed by a
          # physical newline. Workshop renders that backslash on screen. Convert every
          # such occurrence to the normal Workshop newline escape: \n.
          bad_break = chr(92) + chr(10)
          bad_count = src.count(bad_break)
          if bad_count == 0:
              raise SystemExit('No broken backslash-newline sequences found')
          src = src.replace(bad_break, chr(92) + 'n')
          if bad_break in src:
              raise SystemExit('Broken backslash-newline sequence still present')

          # When opening menu 5/6, initialize their own cursor from the applied value.
          old_open = '''\t\t\tElse If(Event Player.HalamanMenu == 4);\n\t\t\t\tEvent Player.KursorBalasDendam = 0;\n\t\t\t\tCall Subroutine(SegarkanTargetBalasDendam);\n\t\t\tElse;\n\t\t\t\tEvent Player.KursorTeleportasi = 0;\n\t\t\t\tCall Subroutine(SegarkanTargetTeleportasi);\n\t\t\tEnd;'''
          new_open = '''\t\t\tElse If(Event Player.HalamanMenu == 4);\n\t\t\t\tEvent Player.KursorBalasDendam = 0;\n\t\t\t\tCall Subroutine(SegarkanTargetBalasDendam);\n\t\t\tElse If(Event Player.HalamanMenu == 5);\n\t\t\t\tEvent Player.KursorUnkillable = Event Player.UnkillableAktif ? 1 : 0;\n\t\t\tElse;\n\t\t\t\tEvent Player.KursorSuara = Event Player.IndeksSuara;\n\t\t\tEnd;'''
          src = replace_exact(src, old_open, new_open, label='menu 5/6 open cursor initialization')

          # Soundtrack submenu: current applied value + currently highlighted value.
          old = '''Event Player.IndeksBahasa == 0 ? Custom String("0 - SOUNDTRACK {0}/100\\n{1}\\n> {2}", Event Player.KursorGenre + 1,\n\t\t\tGlobal.NamaHalamanEN[Round To Integer(Event Player.KursorGenre / 10, Down)], Global.DaftarGenre[Event Player.KursorGenre]) : Event Player.IndeksBahasa == 1 ? Custom String(\n\t\t\t"0 - SOUNDTRACK {0}/100\\n{1}\\n> {2}", Event Player.KursorGenre + 1, Global.NamaHalaman[Round To Integer(Event Player.KursorGenre / 10, Down)],\n\t\t\tGlobal.DaftarGenre[Event Player.KursorGenre]) : Custom String("0 - เพลงประกอบ {0}/100\\n{1}\\n> {2}", Event Player.KursorGenre + 1,\n\t\t\tGlobal.NamaHalamanTH[Round To Integer(Event Player.KursorGenre / 10, Down)], Global.DaftarGenre[Event Player.KursorGenre])'''
          new = '''Event Player.IndeksBahasa == 0 ? Custom String("{0}\\n{1}\\n> {2}", Custom String("0 - SOUNDTRACK {0}/100\\nCURRENT: {1}",\n\t\t\tEvent Player.KursorGenre + 1, Event Player.IndeksGenre >= 0 ? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("no soundtrack yet")),\n\t\t\tGlobal.NamaHalamanEN[Round To Integer(Event Player.KursorGenre / 10, Down)], Global.DaftarGenre[Event Player.KursorGenre]) : Event Player.IndeksBahasa == 1 ? Custom String(\n\t\t\t"{0}\\n{1}\\n> {2}", Custom String("0 - SOUNDTRACK {0}/100\\nSAAT INI: {1}", Event Player.KursorGenre + 1, Event Player.IndeksGenre >= 0\n\t\t\t? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("belum pilih soundtrack")), Global.NamaHalaman[Round To Integer(Event Player.KursorGenre / 10, Down)],\n\t\t\tGlobal.DaftarGenre[Event Player.KursorGenre]) : Custom String("{0}\\n{1}\\n> {2}", Custom String("0 - เพลงประกอบ {0}/100\\nปัจจุบัน: {1}",\n\t\t\tEvent Player.KursorGenre + 1, Event Player.IndeksGenre >= 0 ? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("ยังไม่ได้เลือกเพลง")),\n\t\t\tGlobal.NamaHalamanTH[Round To Integer(Event Player.KursorGenre / 10, Down)], Global.DaftarGenre[Event Player.KursorGenre])'''
          src = replace_exact(src, old, new, label='soundtrack current line')

          # Camera submenu.
          old = '''Event Player.IndeksBahasa == 0 ? Custom String(\n\t\t\t"1 - THIRD-PERSON CAMERA {0}/{1}\\n> {2}", Event Player.KursorKamera + 1, Count Of(Event Player.DaftarTargetKamera) + 2,\n\t\t\tEvent Player.KursorKamera == 0 ? Custom String("CAMERA OFF") : Event Player.KursorKamera == 1 ? Custom String("YOUR HERO") : Custom String(\n\t\t\t"WATCH {0} {1}", Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2], Hero Icon String(Is Duplicating(Event Player.DaftarTargetKamera[\n\t\t\tEvent Player.KursorKamera - 2]) ? Hero Being Duplicated(Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2]) : Hero Of(\n\t\t\tEvent Player.DaftarTargetKamera[Event Player.KursorKamera - 2])))) : Event Player.IndeksBahasa == 1 ? Custom String("1 - KAMERA ORANG KETIGA {0}/{1}\\n> {2}",\n\t\t\tEvent Player.KursorKamera + 1, Count Of(Event Player.DaftarTargetKamera) + 2, Event Player.KursorKamera == 0 ? Custom String("KAMERA MATI")\n\t\t\t: Event Player.KursorKamera == 1 ? Custom String("HERO SENDIRI") : Custom String("TONTON {0} {1}", Event Player.DaftarTargetKamera[\n\t\t\tEvent Player.KursorKamera - 2], Hero Icon String(Is Duplicating(Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2])\n\t\t\t? Hero Being Duplicated(Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2]) : Hero Of(Event Player.DaftarTargetKamera[\n\t\t\tEvent Player.KursorKamera - 2])))) : Custom String("1 - กล้องบุคคลที่สาม {0}/{1}\\n> {2}", Event Player.KursorKamera + 1,\n\t\t\tCount Of(Event Player.DaftarTargetKamera) + 2, Event Player.KursorKamera == 0 ? Custom String("ปิดกล้อง") : Event Player.KursorKamera == 1\n\t\t\t? Custom String("ฮีโร่ของคุณ") : Custom String("ดู {0}", Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2]))'''
          new = '''Event Player.IndeksBahasa == 0 ? Custom String("{0}\\n> {1}", Custom String("1 - THIRD-PERSON CAMERA {0}/{1}\\nCURRENT: {2}",\n\t\t\tEvent Player.KursorKamera + 1, Count Of(Event Player.DaftarTargetKamera) + 2, Event Player.ModeKamera == 0 ? Custom String("CAMERA OFF")\n\t\t\t: Event Player.ModeKamera == 1 ? Custom String("YOUR HERO") : Custom String("WATCH {0}", Event Player.TargetKamera)), Event Player.KursorKamera == 0\n\t\t\t? Custom String("CAMERA OFF") : Event Player.KursorKamera == 1 ? Custom String("YOUR HERO") : Custom String("WATCH {0} {1}", Event Player.DaftarTargetKamera[\n\t\t\tEvent Player.KursorKamera - 2], Hero Icon String(Is Duplicating(Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2])\n\t\t\t? Hero Being Duplicated(Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2]) : Hero Of(Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2]))))\n\t\t\t: Event Player.IndeksBahasa == 1 ? Custom String("{0}\\n> {1}", Custom String("1 - KAMERA ORANG KETIGA {0}/{1}\\nSAAT INI: {2}", Event Player.KursorKamera + 1,\n\t\t\tCount Of(Event Player.DaftarTargetKamera) + 2, Event Player.ModeKamera == 0 ? Custom String("KAMERA MATI") : Event Player.ModeKamera == 1\n\t\t\t? Custom String("HERO SENDIRI") : Custom String("TONTON {0}", Event Player.TargetKamera)), Event Player.KursorKamera == 0 ? Custom String("KAMERA MATI")\n\t\t\t: Event Player.KursorKamera == 1 ? Custom String("HERO SENDIRI") : Custom String("TONTON {0} {1}", Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2],\n\t\t\tHero Icon String(Is Duplicating(Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2]) ? Hero Being Duplicated(Event Player.DaftarTargetKamera[\n\t\t\tEvent Player.KursorKamera - 2]) : Hero Of(Event Player.DaftarTargetKamera[Event Player.KursorKamera - 2])))) : Custom String("{0}\\n> {1}", Custom String(\n\t\t\t"1 - กล้องบุคคลที่สาม {0}/{1}\\nปัจจุบัน: {2}", Event Player.KursorKamera + 1, Count Of(Event Player.DaftarTargetKamera) + 2, Event Player.ModeKamera == 0\n\t\t\t? Custom String("ปิดกล้อง") : Event Player.ModeKamera == 1 ? Custom String("ฮีโร่ของคุณ") : Custom String("ดู {0}", Event Player.TargetKamera)),\n\t\t\tEvent Player.KursorKamera == 0 ? Custom String("ปิดกล้อง") : Event Player.KursorKamera == 1 ? Custom String("ฮีโร่ของคุณ") : Custom String("ดู {0}",\n\t\t\tEvent Player.DaftarTargetKamera[Event Player.KursorKamera - 2]))'''
          src = replace_exact(src, old, new, label='camera current line')

          # Name color submenu.
          old = '''Event Player.IndeksBahasa == 0 ? Custom String(\n\t\t\t"2 - NAME COLOR {0}/{1}\\n> {2}", Event Player.KursorWarna + 1, Count Of(Global.DaftarWarna), Global.NamaWarnaEN[Event Player.KursorWarna])\n\t\t\t: Event Player.IndeksBahasa == 1 ? Custom String("2 - WARNA NAMA {0}/{1}\\n> {2}", Event Player.KursorWarna + 1, Count Of(Global.DaftarWarna),\n\t\t\tGlobal.NamaWarna[Event Player.KursorWarna]) : Custom String("2 - สีชื่อ {0}/{1}\\n> {2}", Event Player.KursorWarna + 1,\n\t\t\tCount Of(Global.DaftarWarna), Global.NamaWarnaTH[Event Player.KursorWarna])'''
          new = '''Event Player.IndeksBahasa == 0 ? Custom String("{0}\\n> {1}", Custom String("2 - NAME COLOR {0}/{1}\\nCURRENT: {2}", Event Player.KursorWarna + 1,\n\t\t\tCount Of(Global.DaftarWarna), Global.NamaWarnaEN[Event Player.IndeksWarna]), Global.NamaWarnaEN[Event Player.KursorWarna]) : Event Player.IndeksBahasa == 1\n\t\t\t? Custom String("{0}\\n> {1}", Custom String("2 - WARNA NAMA {0}/{1}\\nSAAT INI: {2}", Event Player.KursorWarna + 1, Count Of(Global.DaftarWarna),\n\t\t\tGlobal.NamaWarna[Event Player.IndeksWarna]), Global.NamaWarna[Event Player.KursorWarna]) : Custom String("{0}\\n> {1}", Custom String(\n\t\t\t"2 - สีชื่อ {0}/{1}\\nปัจจุบัน: {2}", Event Player.KursorWarna + 1, Count Of(Global.DaftarWarna), Global.NamaWarnaTH[Event Player.IndeksWarna]),\n\t\t\tGlobal.NamaWarnaTH[Event Player.KursorWarna])'''
          src = replace_exact(src, old, new, label='color current line')

          # HUD language submenu.
          old = '''Event Player.IndeksBahasa == 0 ? Custom String(\n\t\t\t"3 - HUD LANGUAGE {0}/3\\n> {1}", Event Player.KursorBahasa + 1, Global.NamaBahasa[Event Player.KursorBahasa]) : Event Player.IndeksBahasa == 1 ? Custom String(\n\t\t\t"3 - BAHASA HUD {0}/3\\n> {1}", Event Player.KursorBahasa + 1, Global.NamaBahasa[Event Player.KursorBahasa]) : Custom String(\n\t\t\t"3 - ภาษา HUD {0}/3\\n> {1}", Event Player.KursorBahasa + 1, Global.NamaBahasa[Event Player.KursorBahasa])'''
          new = '''Event Player.IndeksBahasa == 0 ? Custom String("{0}\\n> {1}", Custom String("3 - HUD LANGUAGE {0}/3\\nCURRENT: {1}", Event Player.KursorBahasa + 1,\n\t\t\tGlobal.NamaBahasa[Event Player.IndeksBahasa]), Global.NamaBahasa[Event Player.KursorBahasa]) : Event Player.IndeksBahasa == 1 ? Custom String(\n\t\t\t"{0}\\n> {1}", Custom String("3 - BAHASA HUD {0}/3\\nSAAT INI: {1}", Event Player.KursorBahasa + 1, Global.NamaBahasa[Event Player.IndeksBahasa]),\n\t\t\tGlobal.NamaBahasa[Event Player.KursorBahasa]) : Custom String("{0}\\n> {1}", Custom String("3 - ภาษา HUD {0}/3\\nปัจจุบัน: {1}", Event Player.KursorBahasa + 1,\n\t\t\tGlobal.NamaBahasa[Event Player.IndeksBahasa]), Global.NamaBahasa[Event Player.KursorBahasa])'''
          src = replace_exact(src, old, new, label='language current line')

          # Unkillable submenu.
          old = '''Event Player.IndeksBahasa == 0 ? Custom String("5 - UNKILLABLE + 1 HP {0}/2\\n> {1}", Event Player.KursorUnkillable + 1, Event Player.KursorUnkillable == 0\n\t\t\t? Custom String("OFF") : Custom String("ON")) : Event Player.IndeksBahasa == 1 ? Custom String("5 - UNKILLABLE + 1 HP {0}/2\\n> {1}",\n\t\t\tEvent Player.KursorUnkillable + 1, Event Player.KursorUnkillable == 0 ? Custom String("MATI") : Custom String("AKTIF")) : Custom String(\n\t\t\t"5 - UNKILLABLE + 1 HP {0}/2\\n> {1}", Event Player.KursorUnkillable + 1, Event Player.KursorUnkillable == 0 ? Custom String("ปิด") : Custom String("เปิด"))'''
          new = '''Event Player.IndeksBahasa == 0 ? Custom String("{0}\\n> {1}", Custom String("5 - UNKILLABLE + 1 HP {0}/2\\nCURRENT: {1}",\n\t\t\tEvent Player.KursorUnkillable + 1, Event Player.UnkillableAktif ? Custom String("ON") : Custom String("OFF")), Event Player.KursorUnkillable == 0\n\t\t\t? Custom String("OFF") : Custom String("ON")) : Event Player.IndeksBahasa == 1 ? Custom String("{0}\\n> {1}", Custom String(\n\t\t\t"5 - UNKILLABLE + 1 HP {0}/2\\nSAAT INI: {1}", Event Player.KursorUnkillable + 1, Event Player.UnkillableAktif ? Custom String("AKTIF") : Custom String("MATI")),\n\t\t\tEvent Player.KursorUnkillable == 0 ? Custom String("MATI") : Custom String("AKTIF")) : Custom String("{0}\\n> {1}", Custom String(\n\t\t\t"5 - UNKILLABLE + 1 HP {0}/2\\nปัจจุบัน: {1}", Event Player.KursorUnkillable + 1, Event Player.UnkillableAktif ? Custom String("เปิด") : Custom String("ปิด")),\n\t\t\tEvent Player.KursorUnkillable == 0 ? Custom String("ปิด") : Custom String("เปิด"))'''
          src = replace_exact(src, old, new, label='unkillable current line')

          # Voice submenu.
          old = '''Event Player.IndeksBahasa == 0 ? Custom String("6 - VOICE MODIFIER {0}/5\\n> {1}", Event Player.KursorSuara + 1, Event Player.KursorSuara == 0 ? Custom String("NORMAL")\n\t\t\t: Event Player.KursorSuara == 1 ? Custom String("LOW 0.50x") : Event Player.KursorSuara == 2 ? Custom String("LOW 0.75x") : Event Player.KursorSuara == 3\n\t\t\t? Custom String("HIGH 1.25x") : Custom String("HIGH 1.50x")) : Event Player.IndeksBahasa == 1 ? Custom String("6 - PENGUBAH SUARA {0}/5\\n> {1}",\n\t\t\tEvent Player.KursorSuara + 1, Event Player.KursorSuara == 0 ? Custom String("NORMAL") : Event Player.KursorSuara == 1 ? Custom String("RENDAH 0.50x")\n\t\t\t: Event Player.KursorSuara == 2 ? Custom String("RENDAH 0.75x") : Event Player.KursorSuara == 3 ? Custom String("TINGGI 1.25x") : Custom String("TINGGI 1.50x"))\n\t\t\t: Custom String("6 - ปรับเสียงฮีโร่ {0}/5\\n> {1}", Event Player.KursorSuara + 1, Event Player.KursorSuara == 0 ? Custom String("ปกติ") : Event Player.KursorSuara == 1\n\t\t\t? Custom String("ต่ำ 0.50x") : Event Player.KursorSuara == 2 ? Custom String("ต่ำ 0.75x") : Event Player.KursorSuara == 3 ? Custom String("สูง 1.25x")\n\t\t\t: Custom String("สูง 1.50x"))'''
          voice_current_en = '''Event Player.IndeksSuara == 0 ? Custom String("NORMAL") : Event Player.IndeksSuara == 1 ? Custom String("LOW 0.50x") : Event Player.IndeksSuara == 2 ? Custom String("LOW 0.75x") : Event Player.IndeksSuara == 3 ? Custom String("HIGH 1.25x") : Custom String("HIGH 1.50x")'''
          voice_pick_en = '''Event Player.KursorSuara == 0 ? Custom String("NORMAL") : Event Player.KursorSuara == 1 ? Custom String("LOW 0.50x") : Event Player.KursorSuara == 2 ? Custom String("LOW 0.75x") : Event Player.KursorSuara == 3 ? Custom String("HIGH 1.25x") : Custom String("HIGH 1.50x")'''
          voice_current_id = '''Event Player.IndeksSuara == 0 ? Custom String("NORMAL") : Event Player.IndeksSuara == 1 ? Custom String("RENDAH 0.50x") : Event Player.IndeksSuara == 2 ? Custom String("RENDAH 0.75x") : Event Player.IndeksSuara == 3 ? Custom String("TINGGI 1.25x") : Custom String("TINGGI 1.50x")'''
          voice_pick_id = '''Event Player.KursorSuara == 0 ? Custom String("NORMAL") : Event Player.KursorSuara == 1 ? Custom String("RENDAH 0.50x") : Event Player.KursorSuara == 2 ? Custom String("RENDAH 0.75x") : Event Player.KursorSuara == 3 ? Custom String("TINGGI 1.25x") : Custom String("TINGGI 1.50x")'''
          voice_current_th = '''Event Player.IndeksSuara == 0 ? Custom String("ปกติ") : Event Player.IndeksSuara == 1 ? Custom String("ต่ำ 0.50x") : Event Player.IndeksSuara == 2 ? Custom String("ต่ำ 0.75x") : Event Player.IndeksSuara == 3 ? Custom String("สูง 1.25x") : Custom String("สูง 1.50x")'''
          voice_pick_th = '''Event Player.KursorSuara == 0 ? Custom String("ปกติ") : Event Player.KursorSuara == 1 ? Custom String("ต่ำ 0.50x") : Event Player.KursorSuara == 2 ? Custom String("ต่ำ 0.75x") : Event Player.KursorSuara == 3 ? Custom String("สูง 1.25x") : Custom String("สูง 1.50x")'''
          new = f'''Event Player.IndeksBahasa == 0 ? Custom String("{{0}}\\n> {{1}}", Custom String("6 - VOICE MODIFIER {{0}}/5\\nCURRENT: {{1}}", Event Player.KursorSuara + 1, {voice_current_en}), {voice_pick_en})\n\t\t\t: Event Player.IndeksBahasa == 1 ? Custom String("{{0}}\\n> {{1}}", Custom String("6 - PENGUBAH SUARA {{0}}/5\\nSAAT INI: {{1}}", Event Player.KursorSuara + 1, {voice_current_id}), {voice_pick_id})\n\t\t\t: Custom String("{{0}}\\n> {{1}}", Custom String("6 - ปรับเสียงฮีโร่ {{0}}/5\\nปัจจุบัน: {{1}}", Event Player.KursorSuara + 1, {voice_current_th}), {voice_pick_th})'''
          src = replace_exact(src, old, new, label='voice current line')

          # Redraw immediately after applying settings whose previous menu did not redraw.
          src = replace_exact(src,
              '''\t\t\t\t"เลือกเพลงประกอบแล้ว: {0} รสนิยมดี...น่าจะนะ", Global.DaftarGenre[Event Player.IndeksGenre]));\n\t\tElse If(Event Player.HalamanMenu == 1);''',
              '''\t\t\t\t"เลือกเพลงประกอบแล้ว: {0} รสนิยมดี...น่าจะนะ", Global.DaftarGenre[Event Player.IndeksGenre]));\n\t\t\tCall Subroutine(GambarMenu);\n\t\tElse If(Event Player.HalamanMenu == 1);''',
              label='soundtrack redraw')
          src = replace_exact(src,
              '''\t\t\t\tEnd;\n\t\t\tEnd;\n\t\tElse If(Event Player.HalamanMenu == 2);''',
              '''\t\t\t\tEnd;\n\t\t\tEnd;\n\t\t\tCall Subroutine(GambarMenu);\n\t\tElse If(Event Player.HalamanMenu == 2);''',
              label='camera redraw')
          src = replace_exact(src,
              '''\t\t\t\t"ตั้งสีชื่อเป็น {0} แล้ว จะเด่นแค่ไหนก็ได้", Global.NamaWarnaTH[Event Player.IndeksWarna]));\n\t\tElse If(Event Player.HalamanMenu == 3);''',
              '''\t\t\t\t"ตั้งสีชื่อเป็น {0} แล้ว จะเด่นแค่ไหนก็ได้", Global.NamaWarnaTH[Event Player.IndeksWarna]));\n\t\t\tCall Subroutine(GambarMenu);\n\t\tElse If(Event Player.HalamanMenu == 3);''',
              label='color redraw')

          path.write_text(src, encoding='utf-8')
          print(f'Fixed {bad_count} broken visible backslash/newline sequences')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop
          git commit -m "Fix menu newlines and show current selections"
          git push origin HEAD:main
