name: Fix Workshop Custom String Args

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt-fix-workshop-custom-string-args
          fetch-depth: 0

      - name: Apply fix, validate, test, and publish result
        shell: bash
        run: |
          set -euo pipefail
          python tools/chatgpt_fix_custom_string_args.py
          git rm tools/chatgpt_fix_custom_string_args.py .github/workflows/chatgpt-fix-custom-string-args.yml

          python -m py_compile tests/test_runtime_maintenance.py tools/validate_workshop.py
          python tools/validate_workshop.py
          python -m unittest tests.test_runtime_maintenance
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
          python -m unittest discover -s tests -p 'test_*.py'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Workshop Custom String argument limit"
          git push origin HEAD:chatgpt-fix-workshop-custom-string-args
