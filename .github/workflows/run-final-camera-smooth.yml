name: Run final smooth camera patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final camera patch
        run: python .github/scripts/final_camera_smooth.py
      - name: Cleanup temporary workflows
        run: |
          rm -f .github/workflows/run-final-camera-smooth.yml
          rm -f .github/workflows/run-refine-fluid-camera.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize smooth health-scaled third-person camera"
          git push
