name: Run native camera activation blend
on:
  push:
    paths:
      - '.github/scripts/set_camera_native_blend.py'
      - '.github/workflows/run-set-camera-native-blend.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply native camera activation blend
        run: python .github/scripts/set_camera_native_blend.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/set_camera_native_blend.py .github/workflows/run-set-camera-native-blend.yml
          git commit -m "Blend third-person camera activation"
          git push
