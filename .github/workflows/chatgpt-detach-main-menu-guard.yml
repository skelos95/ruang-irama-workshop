name: Guard Attach Detach During Main Menu

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt-detach-main-menu-guard
          fetch-depth: 0

      - name: Apply fix, validate, test, and publish result
        shell: bash
        run: |
          set -euo pipefail
          python tools/chatgpt_detach_main_menu_guard.py
          git rm tools/chatgpt_detach_main_menu_guard.py .github/workflows/chatgpt-detach-main-menu-guard.yml

          python -m py_compile tests/test_runtime_maintenance.py tools/validate_workshop.py
          python tools/validate_workshop.py
          python -m unittest tests.test_runtime_maintenance
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent detach while main menu is open"
          git push origin HEAD:chatgpt-detach-main-menu-guard
