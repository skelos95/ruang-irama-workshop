name: Patch endless guard and spectator HUD

'on':
  push:
    paths:
      - '.github/trigger-camera-bots'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch endless guard and spectator visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('workshop/ruang_irama.workshop')
          s = p.read_text(encoding='utf-8')

          # Keep built-in completion/scoring disabled for the whole custom session.
          # This is intentionally lightweight: only two actions every 0.5 s.
          marker = 'rule("00b - Global: Riavvia il server solo quando il timer personalizzato finisce")\n'
          guard = '''rule("00a - Global: Nessun vincitore prima della fine del timer AFK")
          {
          \tevent
          \t{
          \t\tOngoing - Global;
          \t}

          \tconditions
          \t{
          \t\tGlobal.Siap == True;
          \t\tTotal Time Elapsed < Global.DurataServerMinuti * 60;
          \t}

          \tactions
          \t{
          \t\t"Protezione leggera: la modalita non puo dichiarare vincitori o assegnare punti prima del countdown AFK."
          \t\tDisable Built-In Game Mode Completion;
          \t\tDisable Built-In Game Mode Scoring;
          \t\tWait(0.500, Ignore Condition);
          \t\tLoop If Condition Is True;
          \t}
          }

          '''
          if 'rule("00a - Global: Nessun vincitore prima della fine del timer AFK")' not in s:
              if marker not in s:
                  raise SystemExit('restart rule marker not found')
              s = s.replace(marker, guard + marker, 1)

          # Spectator Visibility: non-team spectators must never see any custom HUD/IWT.
          count_default = s.count('Default Visibility')
          if count_default == 0:
              raise SystemExit('no Default Visibility entries found')
          s = s.replace('Default Visibility', 'Visible Never')

          # Safety checks: keep stable server/camera/teleport behavior intact.
          required = [
              'Disable Built-In Game Mode Completion;',
              'Disable Built-In Game Mode Scoring;',
              'Restart Match;',
              'Total Time Elapsed >= Global.DurataServerMinuti * 60;',
              'Objective Position(Objective Index)',
              'Wait(0.016, Ignore Condition);',
              'Event Player.ModeKamera = 1;',
              'rule("00c - Global: Avvia subito la partita senza Assemble Heroes o countdown")',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit(f'missing stable behavior: {item}')

          if 'Default Visibility' in s:
              raise SystemExit('some custom visual still uses Default Visibility')
          if s.count('Visible Never') < count_default:
              raise SystemExit('spectator visibility conversion incomplete')
          if 'Wait(0.250, Ignore Condition);' in s and 'Mantieni nascosti UI' in s:
              raise SystemExit('old aggressive UI loop unexpectedly returned')

          p.write_text(s, encoding='utf-8')
          print(f'Converted {count_default} custom visual spectator-visibility entries to Visible Never.')
          PY

      - name: Commit Workshop patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop
          git diff --cached --check
          git commit -m "Keep matches endless and hide custom HUD from spectators"
          git push
