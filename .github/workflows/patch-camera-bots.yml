name: Patch normal startup and crouch outlines

'on':
  push:
    paths:
      - '.github/trigger-camera-bots'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch startup and crouch outlines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('workshop/ruang_irama.workshop')
          s = p.read_text(encoding='utf-8')

          # 1) Endless guard: apply once when gameplay actually enters Game In Progress.
          old_guard_start = s.find('rule("00a - Global: Nessun vincitore prima della fine del timer AFK")')
          old_guard_end = s.find('rule("00b - Global: Riavvia il server solo quando il timer personalizzato finisce")', old_guard_start)
          if old_guard_start < 0 or old_guard_end < 0:
              raise SystemExit('endless guard block not found')

          new_guard = '''rule("00a - Global: Blocca completamento quando il gameplay inizia")
          {
          \tevent
          \t{
          \t\tOngoing - Global;
          \t}

          \tconditions
          \t{
          \t\tGlobal.Siap == True;
          \t\tIs Game In Progress == True;
          \t}

          \tactions
          \t{
          \t\t"Una sola applicazione quando la modalita entra davvero in gioco: niente polling, niente Wait/Loop."
          \t\tDisable Built-In Game Mode Completion;
          \t\tDisable Built-In Game Mode Scoring;
          \t}
          }

          '''
          s = s[:old_guard_start] + new_guard + s[old_guard_end:]

          # 2) Let Overwatch handle Assemble Heroes and pre-match setup normally.
          startup_start = s.find('rule("00c - Global: Avvia subito la partita senza Assemble Heroes o countdown")')
          startup_end = s.find('rule("01 - Pemain Masuk: Mulai jam nongkrong")', startup_start)
          if startup_start < 0 or startup_end < 0:
              raise SystemExit('forced startup rule not found')
          s = s[:startup_start] + s[startup_end:]

          # 3) HUD hint now also mentions outlines.
          s = s.replace(
              '"Hold {0}: inspect player, hero & ultimate"',
              '"Hold {0}: inspect player, hero, ultimate & outlines"',
              1,
          )
          s = s.replace(
              '"Tahan {0}: lihat pemain, hero & ultimate"',
              '"Tahan {0}: lihat pemain, hero, ultimate & outline"',
              1,
          )

          # 4) When crouch inspection starts, outline every human in that player\'s chosen color.
          outline_marker = '''\t\tEvent Player.InspeksiAktif = True;
          \t\tDisable Nameplates(All Players(All Teams), Event Player);
          \t\tCall Subroutine(SegarkanTargetInspeksi);'''
          if outline_marker not in s:
              raise SystemExit('inspection start marker not found')

          outline_actions = [
              '\t\t"Outline di crouch: Always e la visibilita massima del Workshop, anche dietro la geometria. Ogni umano usa il proprio colore scelto."',
              '\t\tStart Forcing Player Outlines(Event Player, Event Player, True, Event Player.WarnaNama, Always);',
          ]
          for i in range(20):
              outline_actions.append(
                  f'\t\tStart Forcing Player Outlines(Filtered Array(Global.PemainManusia, And(Current Array Element != Event Player, Player Variable(Current Array Element, IndeksWarna) == {i})), Event Player, True, Global.DaftarWarna[{i}], Always);'
              )
          replacement = '''\t\tEvent Player.InspeksiAktif = True;
          \t\tDisable Nameplates(All Players(All Teams), Event Player);
          ''' + '\n'.join(outline_actions) + '''
          \t\tCall Subroutine(SegarkanTargetInspeksi);'''
          s = s.replace(outline_marker, replacement, 1)

          # 5) Releasing crouch / opening menu / dying / remote camera removes all forced outlines for that viewer.
          stop_marker = '''\tactions
          \t{
          \t\tEnable Nameplates(All Players(All Teams), Event Player);
          \t\tIf(Event Player.TeksDunia != Null);'''
          stop_replacement = '''\tactions
          \t{
          \t\tEnable Nameplates(All Players(All Teams), Event Player);
          \t\tStop Forcing Player Outlines(Global.PemainManusia, Event Player);
          \t\tIf(Event Player.TeksDunia != Null);'''
          if stop_marker not in s:
              raise SystemExit('inspection stop marker not found')
          s = s.replace(stop_marker, stop_replacement, 1)

          # Safety: preserve the stable camera activation and spectator visibility.
          required = [
              'Wait(0.016, Ignore Condition);',
              'Event Player.ModeKamera = 1;',
              'Visible Never',
              'Objective Position(Objective Index)',
              'Restart Match;',
              'Total Time Elapsed >= Global.DurataServerMinuti * 60;',
              'Start Forcing Player Outlines(Event Player, Event Player, True, Event Player.WarnaNama, Always);',
              'Stop Forcing Player Outlines(Global.PemainManusia, Event Player);',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit(f'missing required behavior: {item}')

          if 'Start Game Mode;' in s:
              raise SystemExit('forced game startup still exists')

          # This specific endless guard must no longer poll.
          guard_check_start = s.find('rule("00a - Global: Blocca completamento quando il gameplay inizia")')
          guard_check_end = s.find('rule("00b - Global:', guard_check_start)
          guard_block = s[guard_check_start:guard_check_end]
          if 'Wait(' in guard_block or 'Loop' in guard_block:
              raise SystemExit('endless guard still contains Wait/Loop')

          p.write_text(s, encoding='utf-8')
          print('Normal startup restored; crouch outlines added for 20 selectable player colors.')
          PY

      - name: Commit Workshop patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop
          git diff --cached --check
          git commit -m "Restore normal startup and add crouch player outlines"
          git push
