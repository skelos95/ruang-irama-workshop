name: Patch startup phases and mode UI

'on':
  push:
    paths:
      - '.github/trigger-camera-bots'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Workshop startup and mode UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('workshop/ruang_irama.workshop')
          s = p.read_text(encoding='utf-8')

          old = '''rule("00c - Global: Avvia subito la partita senza Assemble Heroes o countdown")
          {
          \tevent
          \t{
          \t\tOngoing - Global;
          \t}

          \tconditions
          \t{
          \t\tGlobal.Siap == True;
          \t\tIs Game In Progress == False;
          \t}

          \tactions
          \t{
          \t\t"Forza tutte le modalita oltre Waiting/Assemble Heroes/setup finche il gameplay e realmente iniziato."
          \t\tStart Game Mode;
          \t\tWait(0.050, Ignore Condition);
          \t\tLoop If Condition Is True;
          \t}
          }

          '''

          new = '''rule("00c - Global: Esci subito da Waiting For Players")
          {
          \tevent
          \t{
          \t\tOngoing - Global;
          \t}

          \tconditions
          \t{
          \t\tGlobal.Siap == True;
          \t\tIs Waiting For Players == True;
          \t}

          \tactions
          \t{
          \t\t"Usa Start Game Mode solo per lasciare Waiting For Players."
          \t\tDisable Built-In Game Mode Announcer;
          \t\tDisable Built-In Game Mode Music;
          \t\tDisable Game Mode HUD(All Players(All Teams));
          \t\tDisable Game Mode In-World UI(All Players(All Teams));
          \t\tStart Game Mode;
          \t\tWait(0.016, Ignore Condition);
          \t\tLoop If Condition Is True;
          \t}
          }

          rule("00d - Global: Salta Assemble Heroes")
          {
          \tevent
          \t{
          \t\tOngoing - Global;
          \t}

          \tconditions
          \t{
          \t\tGlobal.Siap == True;
          \t\tIs Assembling Heroes == True;
          \t}

          \tactions
          \t{
          \t\t"Azzera direttamente Assemble Heroes."
          \t\tDisable Built-In Game Mode Announcer;
          \t\tDisable Built-In Game Mode Music;
          \t\tDisable Game Mode HUD(All Players(All Teams));
          \t\tDisable Game Mode In-World UI(All Players(All Teams));
          \t\tSet Match Time(0);
          \t\tWait(0.016, Ignore Condition);
          \t\tLoop If Condition Is True;
          \t}
          }

          rule("00e - Global: Salta il pre-inizio Setup")
          {
          \tevent
          \t{
          \t\tOngoing - Global;
          \t}

          \tconditions
          \t{
          \t\tGlobal.Siap == True;
          \t\tIs In Setup == True;
          \t}

          \tactions
          \t{
          \t\t"Azzera il countdown di setup/pre-inizio."
          \t\tDisable Built-In Game Mode Announcer;
          \t\tDisable Built-In Game Mode Music;
          \t\tDisable Game Mode HUD(All Players(All Teams));
          \t\tDisable Game Mode In-World UI(All Players(All Teams));
          \t\tSet Match Time(0);
          \t\tWait(0.016, Ignore Condition);
          \t\tLoop If Condition Is True;
          \t}
          }

          rule("00f - Global: Mantieni nascosti UI, icone e announcer della modalita")
          {
          \tevent
          \t{
          \t\tOngoing - Global;
          \t}

          \tconditions
          \t{
          \t\tGlobal.Siap == True;
          \t}

          \tactions
          \t{
          \t\t"Le transizioni possono ricreare UI/audio nativi: disattivali di nuovo."
          \t\tDisable Built-In Game Mode Announcer;
          \t\tDisable Built-In Game Mode Music;
          \t\tDisable Game Mode HUD(All Players(All Teams));
          \t\tDisable Game Mode In-World UI(All Players(All Teams));
          \t\tWait(0.250, Ignore Condition);
          \t\tLoop;
          \t}
          }

          '''

          if old not in s:
              raise SystemExit('old immediate-start rule not found')
          s = s.replace(old, new, 1)

          required = [
              'Global.DurataServerMinuti = Workshop Setting Integer',
              'Disable Built-In Game Mode Completion;',
              'Disable Built-In Game Mode Scoring;',
              'Restart Match;',
              'Event Player.TargetKamera = Event Player;',
              'Wait(0.016, Ignore Condition);',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit(f'missing stable behavior: {item}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Restore helper workflow and trigger, then commit Workshop patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 378b20081c71724e24081ff6435a0bec1a753d01 -- .github/workflows/patch-camera-bots.yml .github/trigger-camera-bots
          git add workshop/ruang_irama.workshop .github/workflows/patch-camera-bots.yml .github/trigger-camera-bots
          git diff --cached --check
          git commit -m "Fix startup phases and persistent mode UI"
          git push
