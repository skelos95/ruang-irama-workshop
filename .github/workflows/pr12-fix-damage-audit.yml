name: Temporary PR 12 Damage Fix And Token Audit

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 12 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/fix-italian-condition-line-2962'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-italian-condition-line-2962
          persist-credentials: true

      - name: Check out pinned OverPy data
        uses: actions/checkout@v4
        with:
          repository: Zezombye/overpy
          ref: d854bf01fc7bbf3b2169f67408c07a8da8989ad6
          path: .overpy
          persist-credentials: false

      - name: Fix Damage and audit localized callables
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path('workshop/ruang_irama.it-IT.workshop')
          source = path.read_text(encoding='utf-8')
          count = source.count('Danneggia(')
          if count < 1:
              raise SystemExit('Expected at least one Danneggia( occurrence')
          source = source.replace('Danneggia(', 'Damage(')
          if 'Danneggia(' in source:
              raise SystemExit('Danneggia survived replacement')
          path.write_text(source, encoding='utf-8')
          print(f'Replaced {count} Danneggia( occurrence(s) with Damage(')

          tests = Path('tests/test_clipboard_import.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '        self.assertNotIn("Color(", without_custom_colors)\n'
          addition = '        self.assertNotIn("Danneggia(", self.italian)\n        self.assertIn("Damage(", self.italian)\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('Clipboard test anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
          tests.write_text(text, encoding='utf-8')

          localized = set()
          lang_re = re.compile(r'"it-IT"\s*:\s*"((?:\\.|[^"\\])*)"')
          for data_file in Path('.overpy/src/data').rglob('*.ts'):
              raw = data_file.read_text(encoding='utf-8')
              for encoded in lang_re.findall(raw):
                  try:
                      localized.add(json.loads('"' + encoded + '"'))
                  except json.JSONDecodeError:
                      pass

          code = re.sub(r'"(?:\\.|[^"\\])*"', '""', source)
          callable_re = re.compile(r'(?<![A-Za-zÀ-ÿ0-9_])([A-ZÀ-Ü][A-Za-zÀ-ÿ0-9]*(?: [A-ZÀ-Ü][A-Za-zÀ-ÿ0-9]*)*)\s*\(')
          callables = set(callable_re.findall(code))
          syntax_allow = {
              'If', 'Else If', 'And', 'Or', 'Not', 'Array', 'Vector',
              'Custom String', 'Custom Color', 'Button', 'Game Mode',
              # Regex fragments from longer official tokens containing digits/hyphens.
              'Enabled', 'World Text', 'World UI',
          }
          unknown = sorted(name for name in callables if name not in localized and name not in syntax_allow)
          print('Callable token count:', len(callables))
          print('Unknown callable tokens:', unknown)
          if unknown:
              raise SystemExit('Italian clipboard contains callable tokens absent from pinned OverPy it-IT data')
          PY

          python tools/check_clipboard_import.py
          python -m unittest tests.test_clipboard_import

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- workshop/ruang_irama.it-IT.workshop tests/test_clipboard_import.py
          git diff --cached --quiet && exit 0
          git commit -m 'Use official it-IT Damage action token'
          git push origin HEAD:chatgpt/fix-italian-condition-line-2962
