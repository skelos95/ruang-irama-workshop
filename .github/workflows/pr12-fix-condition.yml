name: Temporary PR 12 Condition Fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 12 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/fix-italian-condition-line-2962'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-italian-condition-line-2962
          persist-credentials: true

      - name: Rewrite remaining Try Your Luck conditions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              (Path('workshop/ruang_irama.it-IT.workshop'), 'Globale', 'Danneggia'),
              (Path('tests/fixtures/semantic_reference.txt'), 'Global', 'Damage'),
          ]

          for path, g, damage in files:
              text = path.read_text(encoding='utf-8')

              old = f'''\t\tIf(And({g}.PemainAktif.Manusia == True, And({g}.PemainAktif.KartuNasibAktif == True, And({g}.PemainAktif.PutaranKartuNasib == 0, And({g}.PemainAktif.EfekNasibBerakhir > 0, Total Time Elapsed >= {g}.PemainAktif.EfekNasibBerakhir)))));\n\t\t\tClear Status({g}.PemainAktif, Burning);\n\t\t\tClear Status({g}.PemainAktif, Hacked);\n\t\t\tStop Accelerating({g}.PemainAktif);\n\t\t\tIf({g}.PemainAktif.HudEfekNasib != Null);\n\t\t\t\tDestroy HUD Text({g}.PemainAktif.HudEfekNasib);\n\t\t\tEnd;\n\t\t\t{g}.PemainAktif.HudEfekNasib = Null;\n\t\t\tSet Move Speed({g}.PemainAktif, 100);\n\t\t\t{g}.PemainAktif.PrivasiNasibAktif = False;\n\t\t\t{g}.PemainAktif.EfekNasib = 0;\n\t\t\t{g}.PemainAktif.EfekNasibBerakhir = 0;\n\t\t\t{g}.PemainAktif.WaktuBakarNasibBerikut = 0;\n\t\t\t{g}.PemainAktif.KartuNasibAktif = False;\n\t\t\t{g}.PemainAktif.MenuNasibHarusDibuka = True;\n\t\tEnd;'''
              new = f'''\t\tIf({g}.PemainAktif.Manusia == True);\n\t\t\tIf({g}.PemainAktif.KartuNasibAktif == True);\n\t\t\t\tIf({g}.PemainAktif.PutaranKartuNasib == 0);\n\t\t\t\t\tIf({g}.PemainAktif.EfekNasibBerakhir > 0);\n\t\t\t\t\t\tIf(Total Time Elapsed >= {g}.PemainAktif.EfekNasibBerakhir);\n\t\t\t\t\t\t\tClear Status({g}.PemainAktif, Burning);\n\t\t\t\t\t\t\tClear Status({g}.PemainAktif, Hacked);\n\t\t\t\t\t\t\tStop Accelerating({g}.PemainAktif);\n\t\t\t\t\t\t\tIf({g}.PemainAktif.HudEfekNasib != Null);\n\t\t\t\t\t\t\t\tDestroy HUD Text({g}.PemainAktif.HudEfekNasib);\n\t\t\t\t\t\t\tEnd;\n\t\t\t\t\t\t\t{g}.PemainAktif.HudEfekNasib = Null;\n\t\t\t\t\t\t\tSet Move Speed({g}.PemainAktif, 100);\n\t\t\t\t\t\t\t{g}.PemainAktif.PrivasiNasibAktif = False;\n\t\t\t\t\t\t\t{g}.PemainAktif.EfekNasib = 0;\n\t\t\t\t\t\t\t{g}.PemainAktif.EfekNasibBerakhir = 0;\n\t\t\t\t\t\t\t{g}.PemainAktif.WaktuBakarNasibBerikut = 0;\n\t\t\t\t\t\t\t{g}.PemainAktif.KartuNasibAktif = False;\n\t\t\t\t\t\t\t{g}.PemainAktif.MenuNasibHarusDibuka = True;\n\t\t\t\t\t\tEnd;\n\t\t\t\t\tEnd;\n\t\t\t\tEnd;\n\t\t\tEnd;\n\t\tEnd;'''
              if text.count(old) != 1:
                  raise SystemExit(f'Effect expiry block count in {path}: {text.count(old)}')
              text = text.replace(old, new, 1)

              old = f'''\t\tIf(And({g}.PemainAktif.WaktuIkonNasibBerakhir > 0, Total Time Elapsed >= {g}.PemainAktif.WaktuIkonNasibBerakhir));\n\t\t\tIf({g}.PemainAktif.IkonKartuNasib != Null);\n\t\t\t\tDestroy Icon({g}.PemainAktif.IkonKartuNasib);\n\t\t\tEnd;\n\t\t\t{g}.PemainAktif.IkonKartuNasib = Null;\n\t\t\t{g}.PemainAktif.WaktuIkonNasibBerakhir = 0;\n\t\t\tIf(And({g}.PemainAktif.KartuNasibAktif == False, {g}.PemainAktif.MenuTerbuka == False));\n\t\t\t\t{g}.PemainAktif.MenuNasibHarusDibuka = True;\n\t\t\tEnd;\n\t\tEnd;'''
              new = f'''\t\tIf({g}.PemainAktif.WaktuIkonNasibBerakhir > 0);\n\t\t\tIf(Total Time Elapsed >= {g}.PemainAktif.WaktuIkonNasibBerakhir);\n\t\t\t\tIf({g}.PemainAktif.IkonKartuNasib != Null);\n\t\t\t\t\tDestroy Icon({g}.PemainAktif.IkonKartuNasib);\n\t\t\t\tEnd;\n\t\t\t\t{g}.PemainAktif.IkonKartuNasib = Null;\n\t\t\t\t{g}.PemainAktif.WaktuIkonNasibBerakhir = 0;\n\t\t\t\tIf({g}.PemainAktif.KartuNasibAktif == False);\n\t\t\t\t\tIf({g}.PemainAktif.MenuTerbuka == False);\n\t\t\t\t\t\t{g}.PemainAktif.MenuNasibHarusDibuka = True;\n\t\t\t\t\tEnd;\n\t\t\t\tEnd;\n\t\t\tEnd;\n\t\tEnd;'''
              if text.count(old) != 1:
                  raise SystemExit(f'Icon expiry block count in {path}: {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_clipboard_import.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '        self.assertNotIn("If(And(Globale.PemainAktif.Manusia == True, And(Globale.PemainAktif.EfekNasib == 5", self.italian)\n'
          additions = (
              '        self.assertNotIn("If(And(Globale.PemainAktif.Manusia == True, And(Globale.PemainAktif.KartuNasibAktif == True", self.italian)\n'
              '        self.assertNotIn("If(And(Globale.PemainAktif.WaktuIkonNasibBerakhir > 0", self.italian)\n'
              '        self.assertNotIn("If(And(Globale.PemainAktif.KartuNasibAktif == False, Globale.PemainAktif.MenuTerbuka == False", self.italian)\n'
          )
          if additions not in text:
              if anchor not in text:
                  raise SystemExit('Test anchor not found')
              text = text.replace(anchor, anchor + additions, 1)
          tests.write_text(text, encoding='utf-8')

          marker = Path('docs/ITALIAN_CONDITION_FIX_2962.md')
          if marker.exists():
              marker.unlink()
          PY

          python tools/check_clipboard_import.py
          python -m unittest tests.test_clipboard_import

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tests/test_clipboard_import.py docs/ITALIAN_CONDITION_FIX_2962.md
          git diff --cached --quiet && exit 0
          git commit -m 'Rewrite remaining Try Your Luck conditions for Italian parser'
          git push origin HEAD:chatgpt/fix-italian-condition-line-2962
