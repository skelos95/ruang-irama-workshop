name: Temporary finish permanent roster tests

on:
  push:
    branches:
      - fix-permanent-global-roster-v3-20260827
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Fix final stale assertions
        run: python .github/maintenance/tmp_finish_permanent_roster_tests.py

      - name: Remove temporary files
        run: |
          rm .github/workflows/tmp-finish-permanent-roster-tests.yml
          rm .github/maintenance/tmp_finish_permanent_roster_tests.py
          rmdir .github/maintenance 2>/dev/null || true

      - name: Commit clean fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github
          git commit -m 'Finish permanent roster test alignment'
          git push origin HEAD:fix-permanent-global-roster-v3-20260827

      - name: Run affected tests
        run: |
          python -m unittest \
            tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_registered_team_switch_never_destroys_roster_or_hides_crouch_target \
            tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_team_switch_is_lightweight_and_leave_cleanup_is_exact \
            tests.test_dummy_bots.DummyBotFeatureTests.test_static_hud_uses_the_reference_grid_without_embedded_label_spacing \
            tests.test_validate_workshop.WorkshopValidationTests.test_special_player_roster_main_and_locked_renderers_are_guarded \
            tests.test_validate_workshop.WorkshopValidationTests.test_chill_grid_rejects_an_eleventh_fixed_hud \
            tests.test_validate_workshop.WorkshopValidationTests.test_left_roster_rows_start_immediately_below_their_label \
            tests.test_validate_workshop.WorkshopValidationTests.test_right_roster_stays_before_the_native_team_status_indicator \
            tests.test_validate_workshop.WorkshopValidationTests.test_left_roster_text_cannot_reintroduce_the_client_zero \
            tests.test_validate_workshop.WorkshopValidationTests.test_left_diagnostics_remain_inside_the_subheader \
            tests.test_validate_workshop.WorkshopValidationTests.test_left_diagnostic_fallback_is_an_empty_string_not_null \
            tests.test_validate_workshop.WorkshopValidationTests.test_roster_ready_flag_is_written_after_both_global_aliases \
            tests.test_validate_workshop.WorkshopValidationTests.test_lazy_roster_rows_require_assigned_identity_before_creation \
            tests.test_validate_workshop.WorkshopValidationTests.test_pending_roster_refresh_cannot_block_roster_bootstrap \
            tests.test_validate_workshop.WorkshopValidationTests.test_team_switch_rebinds_stale_entity_in_place

      - name: Validate Workshop source
        run: python tools/validate_workshop.py

      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
