name: Run balanced third-person camera stabilization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run balanced third-person camera stabilization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply balanced camera stabilization
        run: python .github/scripts/rebuild_camera_stability.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/rebuild_camera_stability.py .github/workflows/run-rebuild-camera-stability.yml
          git diff --cached --check
          git commit -m "Rebuild third-person camera stability"
          git push
