name: Apply server location and Interact camera shortcut

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-server-location-interact-camera.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Workshop and validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('workshop/ruang_irama.workshop')
          validator_path = Path('tools/validate_workshop.py')
          readme_path = Path('README.md')
          project_path = Path('docs/PROGETTO.md')
          report_path = Path('docs/VALIDAZIONE.md')
          old_locations_path = Path('docs/VPN_COUNTRIES.md')
          new_locations_path = Path('docs/SERVER_LOCATIONS.md')

          def replace_exact(text, old, new, expected=1, label='replacement'):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected}, found {count}')
              return text.replace(old, new)

          src = source_path.read_text(encoding='utf-8')

          # Dedicated latch for the outside-menu Interact long press.
          src = replace_exact(
              src,
              '\t\t56: PerintahTeleportasi\n}',
              '\t\t56: PerintahTeleportasi\n\t\t57: InteraksiKameraDipakai\n}',
              label='Interact camera latch variable',
          )

          # Restore SERVER LOCATION wording while keeping the same Asia location selector.
          src = replace_exact(
              src,
              'Custom String("VPN country (Asia)")',
              'Custom String("Server location (Asia)")',
              label='server location Workshop setting label',
          )
          old_hud = '''Player Variable(Local Player, IndeksBahasa) == 2 ? Custom String("เซิร์ฟเวอร์ VPN: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN]) : Custom String("SERVER VPN: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])'''
          new_hud = '''Player Variable(Local Player, IndeksBahasa) == 0 ? Custom String("SERVER LOCATION: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN]) : Player Variable(Local Player, IndeksBahasa) == 1 ? Custom String("LOKASI SERVER: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN]) : Custom String("ตำแหน่งเซิร์ฟเวอร์: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])'''
          src = replace_exact(src, old_hud, new_hud, label='server location HUD')

          # Initialize the new latch for each human player.
          src = replace_exact(
              src,
              '\t\tEvent Player.PerintahTeleportasi = 0;\n\t}\n}\n\nrule("95 - Subrutin:',
              '\t\tEvent Player.PerintahTeleportasi = 0;\n\t\tEvent Player.InteraksiKameraDipakai = False;\n\t}\n}\n\nrule("95 - Subrutin:',
              label='camera latch initialization',
          )

          # Outside the Arcade Menu, hold Interact 0.5 s to toggle self third-person / first-person.
          shortcut_rules = r'''rule("12c - Kamera: Tahan Interact setengah detik untuk beralih di luar menu")
{
	event
	{
		Ongoing - Each Player;
		All;
		All;
	}

	conditions
	{
		Event Player.Manusia == True;
		Event Player.BotAI == False;
		Is Dummy Bot(Event Player) == False;
		Has Spawned(Event Player) == True;
		Is Alive(Event Player) == True;
		Event Player.MenuTerbuka == False;
		Event Player.TeleportCrouchAktif == False;
		Event Player.InteraksiKameraDipakai == False;
		Is Button Held(Event Player, Button(Crouch)) == False;
		Is Button Held(Event Player, Button(Interact)) == True;
	}

	actions
	{
		Wait(0.500, Abort When False);
		Event Player.InteraksiKameraDipakai = True;
		If(Event Player.ModeKamera == 0);
			Event Player.TargetKamera = Event Player;
			Wait(0.016, Ignore Condition);
			Event Player.ModeKamera = 1;
			Call Subroutine(MulaiKamera);
			Small Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Third person enabled.") : Event Player.IndeksBahasa == 1 ? Custom String("Kamera orang ketiga aktif.") : Custom String("เปิดมุมมองบุคคลที่สามแล้ว"));
		Else;
			Stop Camera(Event Player);
			Event Player.ModeKamera = 0;
			Event Player.TargetKamera = Null;
			Small Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("First person restored.") : Event Player.IndeksBahasa == 1 ? Custom String("Kamera orang pertama kembali.") : Custom String("กลับสู่มุมมองบุคคลที่หนึ่งแล้ว"));
		End;
	}
}

rule("12d - Kamera: Lepaskan Interact sebelum pakai lagi")
{
	event
	{
		Ongoing - Each Player;
		All;
		All;
	}

	conditions
	{
		Event Player.InteraksiKameraDipakai == True;
		Is Button Held(Event Player, Button(Interact)) == False;
	}

	actions
	{
		Event Player.InteraksiKameraDipakai = False;
	}
}

'''
          src = replace_exact(
              src,
              'rule("13 - Intip Pahlawan:',
              shortcut_rules + 'rule("13 - Intip Pahlawan:',
              label='insert outside-menu Interact camera rules',
          )
          source_path.write_text(src, encoding='utf-8')

          # Validator: change visible location contract and verify the new camera shortcut.
          val = validator_path.read_text(encoding='utf-8')
          val = val.replace('Custom String("VPN country (Asia)")', 'Custom String("Server location (Asia)")')
          val = val.replace("if 'VPN country (Asia)' in call", "if 'Server location (Asia)' in call")
          val = val.replace('Workshop Setting Combo VPN Asia', 'Workshop Setting Combo Server Location Asia')
          val = val.replace('argomenti Workshop Setting Combo VPN Asia', 'argomenti Workshop Setting Combo Server Location Asia')
          val = val.replace('default Workshop Setting Combo VPN Asia', 'default Workshop Setting Combo Server Location Asia')
          val = val.replace('opzioni Workshop Setting Combo VPN Asia', 'opzioni Workshop Setting Combo Server Location Asia')
          old_validator_hud = '''        'Custom String("SERVER VPN: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source
        and 'Custom String("เซิร์ฟเวอร์ VPN: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source,
        "HUD SERVER VPN non usa il paese configurato",'''
          new_validator_hud = '''        'Custom String("SERVER LOCATION: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source
        and 'Custom String("LOKASI SERVER: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source
        and 'Custom String("ตำแหน่งเซิร์ฟเวอร์: {0}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source,
        "HUD SERVER LOCATION non usa il paese configurato",'''
          val = replace_exact(val, old_validator_hud, new_validator_hud, label='server location validator HUD')

          camera_anchor = '''            checks.equal(args[3], "0", "blend Start Camera per aggancio diretto tipo prima persona")


def check_crouch'''
          camera_checks = '''            checks.equal(args[3], "0", "blend Start Camera per aggancio diretto tipo prima persona")

    checks.require("InteraksiKameraDipakai" in player_names, "camera shortcut: latch InteraksiKameraDipakai assente")
    shortcut_rules = [
        rule for rule in rules
        if code_contains(
            rule.body,
            "Event Player.MenuTerbuka == False;",
            "Event Player.TeleportCrouchAktif == False;",
            "Event Player.InteraksiKameraDipakai == False;",
            "Is Button Held(Event Player, Button(Interact)) == True;",
            "Wait(0.500, Abort When False);",
            "Event Player.TargetKamera = Event Player;",
            "Event Player.ModeKamera = 1;",
            "Call Subroutine(MulaiKamera);",
            "Stop Camera(Event Player);",
            "Event Player.ModeKamera = 0;",
            "Event Player.TargetKamera = Null;",
        )
    ]
    checks.equal(len(shortcut_rules), 1, "camera shortcut Interact 0,5 s fuori menu")
    if shortcut_rules:
        checks.require(
            code_contains(shortcut_rules[0].body, "If(Event Player.ModeKamera == 0);", "Else;"),
            "camera shortcut non alterna prima persona e camera attiva",
        )
    release_rules = [
        rule for rule in rules
        if code_contains(
            rule.body,
            "Event Player.InteraksiKameraDipakai == True;",
            "Is Button Held(Event Player, Button(Interact)) == False;",
            "Event Player.InteraksiKameraDipakai = False;",
        )
    ]
    checks.equal(len(release_rules), 1, "release latch Interact camera")
    menu_camera_rules = [
        rule for rule in rules
        if code_contains(
            rule.body,
            "Event Player.MenuTerbuka == True;",
            "Event Player.PerintahMenu == 1;",
            "Else If(Event Player.HalamanMenu == 1);",
            "Event Player.KursorKamera",
        )
    ]
    checks.equal(len(menu_camera_rules), 1, "Interact camera nel menu resta gestito dal dispatcher")


def check_crouch'''
          val = replace_exact(val, camera_anchor, camera_checks, label='camera shortcut validator checks')
          validator_path.write_text(val, encoding='utf-8')

          # Documentation and visible names.
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('SERVER VPN', 'SERVER LOCATION')
          readme = readme.replace('VPN country (Asia)', 'Server location (Asia)')
          readme = readme.replace('26 località asiatiche NordVPN', '26 località asiatiche')
          readme = readme.replace('docs/VPN_COUNTRIES.md', 'docs/SERVER_LOCATIONS.md')
          row = '| Fuori menu | Tieni Crouch e mira | Ispeziona il target vicino al reticolo |'
          replacement = row + '\n| Fuori menu | Tieni Interact per 0,5 s | Attiva la terza persona sul proprio eroe; se una camera è già attiva, torna alla prima persona |'
          if row not in readme:
              raise SystemExit('README controls row not found')
          readme = readme.replace(row, replacement, 1)
          readme_path.write_text(readme, encoding='utf-8')

          project = project_path.read_text(encoding='utf-8')
          project = project.replace('SERVER VPN', 'SERVER LOCATION')
          project = project.replace('VPN country (Asia)', 'Server location (Asia)')
          project = project.replace('NordVPN', 'Asia')
          project_path.write_text(project, encoding='utf-8')

          if old_locations_path.exists():
              text = old_locations_path.read_text(encoding='utf-8')
              text = text.replace('# VPN Countries — Asia', '# Server Locations — Asia')
              text = text.replace('`VPN country (Asia)`', '`Server location (Asia)`')
              new_locations_path.write_text(text, encoding='utf-8')
              old_locations_path.unlink()

          report = report_path.read_text(encoding='utf-8')
          report = report.replace('SERVER VPN', 'SERVER LOCATION')
          report = report.replace('VPN country (Asia)', 'Server location (Asia)')
          data = source_path.read_bytes().replace(b'\r\n', b'\n')
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          report, n = re.subn(r'```text\n[0-9a-f]{40}\n```', f'```text\n{blob}\n```', report, count=1)
          if n != 1:
              raise SystemExit('validation report blob marker not found')
          rule_count = len(re.findall(r'(?m)^\s*rule\s*\(', src))
          report = re.sub(
              r'Generi: 100 \| Lingue: 3 \| Regole: \d+ \| Raycast camera: 1',
              f'Generi: 100 | Lingue: 3 | Regole: {rule_count} | Raycast camera: 1',
              report,
              count=1,
          )
          report_path.write_text(report, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/PROGETTO.md docs/VALIDAZIONE.md docs/SERVER_LOCATIONS.md
          git add -u docs/VPN_COUNTRIES.md
          git commit -m "Restore server location and add Interact camera shortcut"
          git push origin HEAD:main
