name: Apply crouch teleport and health display fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-crouch-teleport-health.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Workshop and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('workshop/ruang_irama.workshop')
          report_path = Path('docs/VALIDAZIONE.md')
          readme_path = Path('README.md')
          src = source_path.read_text(encoding='utf-8')

          def replace_exact(text, old, new, expected=1, label='replacement'):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected}, found {count}')
              return text.replace(old, new)

          def edit_rule(text, prefix, next_prefix, transform):
              start = text.index(f'rule("{prefix}')
              end = text.index(f'\nrule("{next_prefix}', start)
              block = text[start:end]
              new_block = transform(block)
              if new_block == block:
                  raise SystemExit(f'{prefix}: no change')
              return text[:start] + new_block + text[end:]

          # Player state dedicated to the hold-Crouch Teleport overlay.
          src = replace_exact(
              src,
              '\t\t54: KursorSuara\n}',
              '\t\t54: KursorSuara\n\t\t55: TeleportCrouchAktif\n\t\t56: PerintahTeleportasi\n}',
              label='teleport crouch variables',
          )

          # Crouch inspection shows actual HP (e.g. 250), not a percentage.
          src = replace_exact(src, 'rule("13 - Intip Pahlawan: Tampilkan ikon, nama, dan persentase kesehatan")',
                              'rule("13 - Intip Pahlawan: Tampilkan ikon, nama, dan kesehatan saat ini")',
                              label='crouch rule title')
          src = replace_exact(src, 'Custom String("{0} {1} | {2}%",', 'Custom String("{0} {1} | {2}",', expected=2,
                              label='remove health percent symbol')
          src, n = re.subn(
              r'Round To Integer\(Health\(Event Player\.TargetInspeksi\) / Max Health\(\s*Event Player\.TargetInspeksi\) \* 100, Down\)',
              'Round To Integer(Health(Event Player.TargetInspeksi), Down)', src, count=1)
          if n != 1:
              raise SystemExit(f'target current HP expression: expected 1, found {n}')
          src = replace_exact(
              src,
              'Round To Integer(Health(Event Player) / Max Health(Event Player) * 100, Down)',
              'Round To Integer(Health(Event Player), Down)',
              label='self current HP expression',
          )

          # Arcade Menu stays Melee-only and cannot open while the hold-Crouch Teleport overlay is active.
          old = '\t\tEvent Player.SeranganDekatDipakai == False;\n\t\tIs Button Held(Event Player, Button(Melee)) == True;'
          new = '\t\tEvent Player.SeranganDekatDipakai == False;\n\t\tEvent Player.TeleportCrouchAktif == False;\n\t\tIs Button Held(Event Player, Button(Melee)) == True;'
          src = replace_exact(src, old, new, label='melee menu teleport exclusion')

          # Rewrite the old Teleport renderer as a standalone Crouch overlay.
          def patch_teleport_renderer(block):
              actions = '\t\tactions\n\t{\n'
              opening = '''\t\tactions\n\t{\n\t\tIf(Event Player.HudMenu != Null);\n\t\t\tDestroy HUD Text(Event Player.HudMenu);\n\t\tEnd;\n\t\tEvent Player.HudMenu = Null;\n\t\tIf(Index Of Array Value(Global.PemainManusia, Event Player) >= 0);\n\t\t\tGlobal.HudMenuPemain[Index Of Array Value(Global.PemainManusia, Event Player)] = 0;\n\t\tEnd;\n'''
              block = replace_exact(block, actions, opening, label='teleport renderer cleanup')
              old_help = '''Event Player.IndeksBahasa == 0 ? Custom String("{0}\\n{1}",\n\t\t\tCustom String("\\n{0}: next | {1}: previous", Input Binding String(Button(Primary Fire)), Input Binding String(Button(Secondary Fire))),\n\t\t\tCustom String("{0}\\n{1}", Custom String("{0}: teleport | {1}: back", Input Binding String(Button(Interact)), Input Binding String(Button(Reload))),\n\t\t\tCustom String("Hold {0} 0.5 sec: close", Input Binding String(Button(Melee))))) : Event Player.IndeksBahasa == 1 ? Custom String("{0}\\n{1}",\n\t\t\tCustom String("\\n{0}: berikutnya | {1}: sebelumnya", Input Binding String(Button(Primary Fire)), Input Binding String(Button(Secondary Fire))),\n\t\t\tCustom String("{0}\\n{1}", Custom String("{0}: teleport | {1}: kembali", Input Binding String(Button(Interact)), Input Binding String(Button(Reload))),\n\t\t\tCustom String("Tahan {0} 0,5 dtk: tutup", Input Binding String(Button(Melee))))) : Custom String("{0}\\n{1}", Custom String(\n\t\t\t"\\n{0}: ถัดไป | {1}: ก่อนหน้า", Input Binding String(Button(Primary Fire)), Input Binding String(Button(Secondary Fire))), Custom String("{0}\\n{1}",\n\t\t\tCustom String("{0}: เทเลพอร์ต | {1}: กลับ", Input Binding String(Button(Interact)), Input Binding String(Button(Reload))), Custom String(\n\t\t\t"กด {0} ค้าง 0.5 วินาที: ปิด", Input Binding String(Button(Melee)))))'''
              new_help = '''Event Player.IndeksBahasa == 0 ? Custom String("{0}\\n{1}",\n\t\t\tCustom String("\\n{0}: next | {1}: previous", Input Binding String(Button(Primary Fire)), Input Binding String(Button(Secondary Fire))),\n\t\t\tCustom String("{0}: teleport | release {1}: close", Input Binding String(Button(Interact)), Input Binding String(Button(Crouch))))\n\t\t\t: Event Player.IndeksBahasa == 1 ? Custom String("{0}\\n{1}", Custom String("\\n{0}: berikutnya | {1}: sebelumnya",\n\t\t\tInput Binding String(Button(Primary Fire)), Input Binding String(Button(Secondary Fire))), Custom String("{0}: teleport | lepas {1}: tutup",\n\t\t\tInput Binding String(Button(Interact)), Input Binding String(Button(Crouch)))) : Custom String("{0}\\n{1}", Custom String(\n\t\t\t"\\n{0}: ถัดไป | {1}: ก่อนหน้า", Input Binding String(Button(Primary Fire)), Input Binding String(Button(Secondary Fire))), Custom String(\n\t\t\t"{0}: เทเลพอร์ต | ปล่อย {1}: ปิด", Input Binding String(Button(Interact)), Input Binding String(Button(Crouch))))'''
              block = replace_exact(block, old_help, new_help, label='teleport crouch help')
              block = block.replace('Custom String("5 - TELEPORT {0}/{1}"', 'Custom String("TELEPORT {0}/{1}"')
              block = block.replace('Custom String("5 - เทเลพอร์ต {0}/{1}"', 'Custom String("เทเลพอร์ต {0}/{1}"')
              block = block.replace('Custom String("5 - TELEPORT {0}/{1}\\n> {2}"', 'Custom String("TELEPORT {0}/{1}\\n> {2}"')
              block = block.replace('Custom String("5 - เทเลพอร์ต {0}/{1}\\n> {2}"', 'Custom String("เทเลพอร์ต {0}/{1}\\n> {2}"')
              tail = '\t\tEvent Player.HudMenu = Last Text ID;\n'
              tail_new = '''\t\tEvent Player.HudMenu = Last Text ID;\n\t\tIf(Index Of Array Value(Global.PemainManusia, Event Player) >= 0);\n\t\t\tGlobal.HudMenuPemain[Index Of Array Value(Global.PemainManusia, Event Player)] = Event Player.HudMenu;\n\t\tEnd;\n'''
              return replace_exact(block, tail, tail_new, label='teleport renderer HUD registry')
          src = edit_rule(src, '91g - Subrutin:', '91h - Subrutin:', patch_teleport_renderer)

          teleport_rules = r'''rule("19 - Teleport Crouch: Buka overlay selama Crouch ditahan")
{
	event
	{
		Ongoing - Each Player;
		All;
		All;
	}

	conditions
	{
		Event Player.Manusia == True;
		Event Player.BotAI == False;
		Is Dummy Bot(Event Player) == False;
		Event Player.MenuTerbuka == False;
		Event Player.TeleportCrouchAktif == False;
		Has Spawned(Event Player) == True;
		Is Alive(Event Player) == True;
		Is Button Held(Event Player, Button(Crouch)) == True;
	}

	actions
	{
		Event Player.TeleportCrouchAktif = True;
		Event Player.PerintahTeleportasi = 0;
		Event Player.KursorTeleportasi = 0;
		Event Player.JenisTeleportasiTerkunci = -1;
		Event Player.TargetTeleportasiTerkunci = Null;
		Disallow Button(Event Player, Button(Primary Fire));
		Disallow Button(Event Player, Button(Secondary Fire));
		Disallow Button(Event Player, Button(Interact));
		Call Subroutine(GambarTeleportasi);
	}
}

rule("19a - Teleport Crouch: Dispatcher input separato dal menu Arcade")
{
	event
	{
		Ongoing - Each Player;
		All;
		All;
	}

	conditions
	{
		Event Player.TeleportCrouchAktif == True;
		Event Player.PerintahTeleportasi == 0;
		Is Button Held(Event Player, Button(Crouch)) == True;
		Or(Is Button Held(Event Player, Button(Interact)), Or(Is Button Held(Event Player, Button(Primary Fire)), Is Button Held(Event Player, Button(Secondary Fire)))) == True;
	}

	actions
	{
		If(Is Button Held(Event Player, Button(Interact)));
			Event Player.PerintahTeleportasi = 1;
		Else If(Is Button Held(Event Player, Button(Primary Fire)));
			Event Player.PerintahTeleportasi = 2;
		Else;
			Event Player.PerintahTeleportasi = 3;
		End;
	}
}

rule("19b - Teleport Crouch: Riattiva dispatcher dopo rilascio comando")
{
	event
	{
		Ongoing - Each Player;
		All;
		All;
	}

	conditions
	{
		Event Player.TeleportCrouchAktif == True;
		Event Player.PerintahTeleportasi != 0;
		Is Button Held(Event Player, Button(Interact)) == False;
		Is Button Held(Event Player, Button(Primary Fire)) == False;
		Is Button Held(Event Player, Button(Secondary Fire)) == False;
	}

	actions
	{
		Wait(0.016, Ignore Condition);
		Event Player.PerintahTeleportasi = 0;
	}
}

rule("19c - Teleport Crouch: Tembakan utama memilih destinazione successiva")
{
	event
	{
		Ongoing - Each Player;
		All;
		All;
	}

	conditions
	{
		Event Player.TeleportCrouchAktif == True;
		Event Player.PerintahTeleportasi == 2;
	}

	actions
	{
		Call Subroutine(SegarkanTargetTeleportasi);
		If(Count Of(Event Player.DaftarTargetTeleportasi) > 0);
			Event Player.KursorTeleportasi = (Event Player.KursorTeleportasi + 1) % Count Of(Event Player.DaftarTargetTeleportasi);
		End;
		Call Subroutine(GambarTeleportasi);
	}
}

rule("19d - Teleport Crouch: Tembakan sekunder memilih destinazione precedente")
{
	event
	{
		Ongoing - Each Player;
		All;
		All;
	}

	conditions
	{
		Event Player.TeleportCrouchAktif == True;
		Event Player.PerintahTeleportasi == 3;
	}

	actions
	{
		Call Subroutine(SegarkanTargetTeleportasi);
		If(Count Of(Event Player.DaftarTargetTeleportasi) > 0);
			Event Player.KursorTeleportasi = (Event Player.KursorTeleportasi + Count Of(Event Player.DaftarTargetTeleportasi) - 1) % Count Of(Event Player.DaftarTargetTeleportasi);
		End;
		Call Subroutine(GambarTeleportasi);
	}
}

rule("19e - Teleport Crouch: Interact esegue il teletrasporto")
{
	event
	{
		Ongoing - Each Player;
		All;
		All;
	}

	conditions
	{
		Event Player.TeleportCrouchAktif == True;
		Event Player.PerintahTeleportasi == 1;
	}

	actions
	{
		Event Player.JenisTeleportasiTerkunci = Event Player.KursorTeleportasi < 2 ? Event Player.KursorTeleportasi : 2;
		Event Player.TargetTeleportasiTerkunci = Null;
		If(And(Event Player.JenisTeleportasiTerkunci == 2, And(Event Player.KursorTeleportasi >= 0, Event Player.KursorTeleportasi < Count Of(Event Player.DaftarTargetTeleportasi))));
			Event Player.TargetTeleportasiTerkunci = Event Player.DaftarTargetTeleportasi[Event Player.KursorTeleportasi];
		End;
		Call Subroutine(SegarkanTargetTeleportasi);
		If(Event Player.JenisTeleportasiTerkunci == 0);
			If(Is In Spawn Room(Event Player) == True);
				Small Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("You are already in the Spawn Room. Mission accomplished.") : Event Player.IndeksBahasa == 1 ? Custom String("Kamu sudah di ruang muncul. Misi selesai.") : Custom String("คุณอยู่ในห้องเกิดแล้ว ภารกิจสำเร็จ"));
			Else If(Event Player.PunyaPosisiMuncul == False);
				Small Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Spawn Room not registered yet. Visit spawn first.") : Event Player.IndeksBahasa == 1 ? Custom String("Posisi ruang muncul belum tersimpan. Masuk ke sana dulu.") : Custom String("ยังไม่ได้บันทึกห้องเกิด กรุณาไปที่ห้องเกิดก่อน"));
			Else;
				Teleport(Event Player, Event Player.PosisiRuangMuncul);
				Small Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Back to the Spawn Room. Tactical retreat complete.") : Event Player.IndeksBahasa == 1 ? Custom String("Kembali ke ruang muncul. Mundur taktis selesai.") : Custom String("กลับสู่ห้องเกิดแล้ว การถอยเชิงกลยุทธ์เสร็จสิ้น"));
			End;
		Else If(Event Player.JenisTeleportasiTerkunci == 1);
			If(Distance Between(Objective Position(Objective Index), Vector(0, 0, 0)) <= 0.100);
				Small Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Objective position unavailable in this mode. The objective is being mysterious.") : Event Player.IndeksBahasa == 1 ? Custom String("Posisi objektif tidak tersedia di mode ini. Objektifnya sedang misterius.") : Custom String("ตำแหน่งเป้าหมายใช้ไม่ได้ในโหมดนี้ เป้าหมายกำลังเล่นซ่อนหา"));
			Else;
				Teleport(Event Player, Nearest Walkable Position(Objective Position(Objective Index)));
				Small Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Teleported near the current objective. Heroic entrance not included.") : Event Player.IndeksBahasa == 1 ? Custom String("Teleport dekat objektif saat ini. Pose heroik tidak termasuk.") : Custom String("เทเลพอร์ตใกล้เป้าหมายปัจจุบันแล้ว ไม่มีท่าเปิดตัวฮีโร่แถมให้"));
			End;
		Else If(Or(Or(Event Player.TargetTeleportasiTerkunci == Null, Entity Exists(Event Player.TargetTeleportasiTerkunci) == False), Or(Is Alive(Event Player.TargetTeleportasiTerkunci) == False, Array Contains(Event Player.DaftarTargetTeleportasi, Event Player.TargetTeleportasiTerkunci) == False)));
			Small Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Target unavailable. Even teleportation has standards.") : Event Player.IndeksBahasa == 1 ? Custom String("Target sedang tidak tersedia. Teleportasi juga punya standar.") : Custom String("เป้าหมายไม่พร้อมใช้งาน แม้แต่เทเลพอร์ตก็มีมาตรฐาน"));
		Else;
			Teleport(Event Player, Nearest Walkable Position(Position Of(Event Player.TargetTeleportasiTerkunci) - Facing Direction Of(Event Player.TargetTeleportasiTerkunci) * 1.500));
			Small Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Teleported near {0}. Personal space sold separately.", Event Player.TargetTeleportasiTerkunci) : Event Player.IndeksBahasa == 1 ? Custom String("Teleport dekat {0}. Jarak pribadi dijual terpisah.", Event Player.TargetTeleportasiTerkunci) : Custom String("เทเลพอร์ตไปใกล้ {0} แล้ว พื้นที่ส่วนตัวไม่ได้รวมในแพ็กเกจ", Event Player.TargetTeleportasiTerkunci));
		End;
		Event Player.JenisTeleportasiTerkunci = -1;
		Event Player.TargetTeleportasiTerkunci = Null;
		If(Event Player.TeleportCrouchAktif == True);
			Call Subroutine(GambarTeleportasi);
		End;
	}
}

rule("19f - Teleport Crouch: Segarkan lista target senza ridisegno periodico")
{
	event
	{
		Ongoing - Each Player;
		All;
		All;
	}

	conditions
	{
		Event Player.TeleportCrouchAktif == True;
	}

	actions
	{
		Call Subroutine(SegarkanTargetTeleportasi);
		Wait(0.500, Abort When False);
		Loop If Condition Is True;
	}
}

rule("19g - Teleport Crouch: Chiudi appena Crouch viene rilasciato")
{
	event
	{
		Ongoing - Each Player;
		All;
		All;
	}

	conditions
	{
		Event Player.TeleportCrouchAktif == True;
		Or(Or(Is Button Held(Event Player, Button(Crouch)) == False, Event Player.MenuTerbuka == True), Or(Has Spawned(Event Player) == False, Is Alive(Event Player) == False)) == True;
	}

	actions
	{
		If(Event Player.HudMenu != Null);
			Destroy HUD Text(Event Player.HudMenu);
		End;
		If(Index Of Array Value(Global.PemainManusia, Event Player) >= 0);
			Global.HudMenuPemain[Index Of Array Value(Global.PemainManusia, Event Player)] = 0;
		End;
		Event Player.HudMenu = Null;
		Event Player.TeleportCrouchAktif = False;
		Event Player.PerintahTeleportasi = 0;
		Event Player.JenisTeleportasiTerkunci = -1;
		Event Player.TargetTeleportasiTerkunci = Null;
		Allow Button(Event Player, Button(Primary Fire));
		Allow Button(Event Player, Button(Secondary Fire));
		Allow Button(Event Player, Button(Interact));
	}
}

'''
          src = replace_exact(src, 'rule("90 - Subrutin:', teleport_rules + 'rule("90 - Subrutin:', label='insert crouch teleport rules')

          # Initialize new state for every joining human.
          setup_old = '\t\tEvent Player.KursorSuara = 0;\n'
          setup_new = '\t\tEvent Player.KursorSuara = 0;\n\t\tEvent Player.TeleportCrouchAktif = False;\n\t\tEvent Player.PerintahTeleportasi = 0;\n'
          src = replace_exact(src, setup_old, setup_new, label='teleport crouch setup')

          source_path.write_text(src, encoding='utf-8')

          # Keep docs in sync with the source hash/rule count.
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('Ispezione Crouch anche attraverso i muri, ordinata per angolo rispetto al reticolo; mostra icona eroe, nome e sola percentuale salute con testo più grande.',
                                  'Ispezione Crouch anche attraverso i muri, ordinata per angolo rispetto al reticolo; mostra icona eroe, nome e salute attuale in HP con testo più grande. Tenendo Crouch compare anche l’overlay Teleport separato dal menu Arcade: Primary/Secondary cambiano destinazione, Interact teletrasporta e il rilascio di Crouch lo chiude.')
          readme_path.write_text(readme, encoding='utf-8')

          data = source_path.read_bytes().replace(b'\r\n', b'\n')
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          report = report_path.read_text(encoding='utf-8')
          report, n = re.subn(r'```text\n[0-9a-f]{40}\n```', f'```text\n{blob}\n```', report, count=1)
          if n != 1:
              raise SystemExit('validation report blob marker not found')
          rule_count = len(re.findall(r'(?m)^\s*rule\s*\(', src))
          report = re.sub(r'Generi: 100 \| Lingue: 3 \| Regole: \d+ \| Raycast camera: 1',
                          f'Generi: 100 | Lingue: 3 | Regole: {rule_count} | Raycast camera: 1', report, count=1)
          report_path.write_text(report, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop README.md docs/VALIDAZIONE.md
          git commit -m "Show current HP and restore hold-Crouch teleport"
          git push origin HEAD:main
