name: Apply Maintenance Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/maintenance/patch.py'
      - '.github/workflows/maintenance-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintenance-patch-main
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify maintenance patch exists
        shell: bash
        run: |
          test -f .github/maintenance/patch.py || {
            echo 'No maintenance patch is present; nothing to apply.' >&2
            exit 1
          }

      - name: Apply maintenance patch
        run: python .github/maintenance/patch.py

      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Workshop source
        run: python tools/validate_workshop.py

      - name: Reject workflow mutations
        shell: bash
        run: |
          if git diff --name-only -- .github/workflows | grep -q .; then
            echo 'Maintenance patches may not modify workflow files.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit validated patch
        shell: bash
        run: |
          rm -f .github/maintenance/patch.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply validated maintenance patch"
          git push origin HEAD:main
