name: Temporary cleanup accidental branch

on:
  push:
    branches:
      - fix-lazy-roster-hud-20260827

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Delete accidental branch
        run: git push origin --delete noop-test-do-not-use
      - name: Remove temporary workflow and commit clean tree
        run: |
          rm -f .github/workflows/tmp-delete-noop-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary branch cleanup workflow"
          git push origin HEAD:fix-lazy-roster-hud-20260827
