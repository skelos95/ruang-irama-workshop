name: Apply fly forward-axis fix

on:
  push:
    branches:
      - fix/fly-forward-view-direction-20260829

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Patch Fly forward throttle axis
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              (Path('workshop/ruang_irama.it-IT.workshop'), 'Y Component Of(Throttle Of(Globale.PemainAktif))', 'Z Component Of(Throttle Of(Globale.PemainAktif))', 2),
              (Path('tests/fixtures/semantic_reference.txt'), 'Y Component Of(Throttle Of(Global.PemainAktif))', 'Z Component Of(Throttle Of(Global.PemainAktif))', 2),
              (Path('tools/validate_workshop.py'), 'YComponentOf(ThrottleOf(Global.PemainAktif))', 'ZComponentOf(ThrottleOf(Global.PemainAktif))', 2),
              (Path('tests/test_ghost_fly.py'), 'YComponentOf(ThrottleOf({global_name}.PemainAktif))', 'ZComponentOf(ThrottleOf({global_name}.PemainAktif))', 1),
              (Path('tests/test_validate_workshop.py'), 'Y Component Of(Throttle Of(Global.PemainAktif))', 'Z Component Of(Throttle Of(Global.PemainAktif))', 1),
          ]

          for path, old, new, expected in replacements:
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} exact matches, found {actual}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Remove helper before repository validation
        run: rm .github/workflows/apply-fly-forward-axis.yml

      - name: Run focused Fly tests
        run: python -m unittest discover -s tests -p 'test_ghost_fly.py'

      - name: Validate Workshop source
        run: python tools/validate_workshop.py workshop/ruang_irama.it-IT.workshop

      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT

      - name: Check whitespace
        run: git diff --check

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix fly forward axis along view'
          git push origin HEAD:fix/fly-forward-view-direction-20260829
