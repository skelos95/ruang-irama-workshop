name: Apply Fly ramp and safe resurrect fix

on:
  push:
    branches:
      - fix/fly-ramp-safe-resurrect-20260829

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact patch
        run: |
          python tools/apply_fly_resurrect_patch.py
          python tools/apply_fly_toggle_stop_patch.py
      - name: Remove temporary helpers
        run: rm .github/workflows/apply-fly-ramp-safe-resurrect.yml tools/apply_fly_resurrect_patch.py tools/apply_fly_toggle_stop_patch.py
      - name: Run focused runtime tests
        run: |
          python -m unittest tests.test_ghost_fly tests.test_runtime_maintenance
          python -m unittest \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_official_source_passes_all_semantic_checks \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_fly_throttle_must_follow_the_full_view_direction \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_fly_forward_requires_gradual_acceleration_along_full_view_direction \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_fly_idle_brake_must_skip_active_luck_acceleration \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_luck_acceleration_must_remain_automatic_while_fly_is_active \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_jump_resurrect_always_requires_nearest_walkable_candidate \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_jump_resurrect_cannot_use_spawn_room_fallback \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_jump_resurrect_teleports_the_corpse_before_resurrect \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_jump_resurrect_reapplies_fly_after_effect_restore \
            tests.test_validate_workshop.SemanticWorkshop081Tests.test_jump_resurrect_confirms_success_in_same_tick
      - name: Validate Workshop source
        run: python tools/validate_workshop.py
      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py --language it-IT
      - name: Check whitespace
        run: git diff --check
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Fix Fly ramp and safe Jump resurrection"
          git push origin HEAD:fix/fly-ramp-safe-resurrect-20260829
