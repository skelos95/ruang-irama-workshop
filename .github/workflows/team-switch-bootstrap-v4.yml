name: Team Switch Bootstrap V4

on:
  push:
    branches:
      - fix/team-switch-crash
    paths:
      - .github/workflows/team-switch-bootstrap-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply deterministic patch from main
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- \
            workshop/ruang_irama.it-IT.workshop \
            tests/fixtures/semantic_reference.txt \
            tests/test_runtime_maintenance.py \
            tests/test_ghost_fly.py \
            tests/test_validate_workshop.py \
            tools/validate_workshop.py \
            README.md \
            docs/PROGETTO.md \
            docs/VALIDAZIONE.md \
            docs/TEST.md \
            CHANGELOG.md

          python - <<'PY'
          from pathlib import Path
          import re

          def replace_class_method(text, name, replacement_lines):
              lines = text.splitlines(keepends=True)
              start = next(i for i, line in enumerate(lines) if line.startswith(f"    def {name}"))
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("    def ") or lines[i].startswith("if __name__ ==")), len(lines))
              replacement = [line + "\n" for line in replacement_lines]
              return "".join(lines[:start] + replacement + ["\n"] + lines[end:])

          def remove_obsolete_tuple(text, label):
              lines = text.splitlines(keepends=True)
              hit = next(i for i, line in enumerate(lines) if f'"{label}"' in line)
              start = next(i for i in range(hit, -1, -1) if lines[i].rstrip("\r\n") == "    (")
              end = next(i for i in range(hit, len(lines)) if lines[i].rstrip("\r\n") == "    ),")
              return "".join(lines[:start] + lines[end + 1:])

          def patch_team_rule(path, global_name, rule_kw, actions_kw):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              start = text.index(f'{rule_kw}("01a - Siklus tim: Reset penuh pada konteks pemain")')
              end = text.index(f'{rule_kw}("01b - Siklus tim: Pekerja penyiapan dari penjadwal global")', start)
              chunk = text[start:end]
              opening = f"\t{actions_kw}\n\t{{\n"
              action_start = chunk.index(opening) + len(opening)
              action_end = chunk.rfind("\n\t}\n")
              action_lines = [
                  '\t\t"Perubahan tim pemain terdaftar hanya memperbarui identitas tim; roster, HUD, menu, pilihan, dan status tidak dibangun ulang."',
                  "\t\tEvent Player.SegarkanRosterTertunda = False;",
                  "\t\tEvent Player.PindahTimDiproses = False;",
                  "\t\tEvent Player.SiklusPemainAktif = False;",
                  "\t\tEvent Player.TimTerakhir = Team Of(Event Player);",
                  "\t\tEvent Player.TimSiklusTarget = Team Of(Event Player);",
                  "\t\tEvent Player.WaktuSiklusTim = 0;",
                  f"\t\tIf({global_name}.PemainSiklusGlobal == Event Player);",
                  f"\t\t\t{global_name}.PemainSiklusGlobal = Null;",
                  f"\t\t\t{global_name}.WaktuSiklusGlobal = Total Time Elapsed + 0.250;",
                  "\t\tEnd;",
              ]
              actions = "\n".join(action_lines)
              chunk = chunk[:action_start] + actions + chunk[action_end:]
              p.write_text(text[:start] + chunk + text[end:], encoding="utf-8")

          patch_team_rule("workshop/ruang_irama.it-IT.workshop", "Globale", "regola", "azioni")
          patch_team_rule("tests/fixtures/semantic_reference.txt", "Global", "rule", "actions")

          p = Path("tests/test_runtime_maintenance.py")
          text = p.read_text(encoding="utf-8")
          runtime_method = [
              "    def test_team_switch_is_lightweight_and_leave_cleanup_is_exact(self):",
              "        for source, global_name in ((self.it, \"Globale\"), (self.en, \"Global\")):",
              "            switch = _rule(source, \"01a - Siklus tim: Reset penuh pada konteks pemain\")",
              "            self.assertIn(\"Event Player.TimTerakhir != Team Of(Event Player);\", switch)",
              "            for token in (",
              "                \"Event Player.SegarkanRosterTertunda = False;\",",
              "                \"Event Player.PindahTimDiproses = False;\",",
              "                \"Event Player.SiklusPemainAktif = False;\",",
              "                \"Event Player.TimTerakhir = Team Of(Event Player);\",",
              "                \"Event Player.TimSiklusTarget = Team Of(Event Player);\",",
              "                \"Event Player.WaktuSiklusTim = 0;\",",
              "            ):",
              "                self.assertIn(token, switch)",
              "            for forbidden in (",
              "                \"Call Subroutine(TenangkanPemain);\",",
              "                \"Call Subroutine(BersihkanPemain);\",",
              "                \"Call Subroutine(SiapkanPemain);\",",
              "                \"Wait(\",",
              "                \"Loop;\",",
              "                \"For Global Variable(\",",
              "            ):",
              "                self.assertNotIn(forbidden, switch)",
              "            self.assertNotIn(\"Event Player.SegarkanRosterTertunda = True;\", switch)",
              "            self.assertNotIn(f\"{global_name}.PemainAktif\", switch)",
              "            setup_worker = _rule(source, \"01b - Siklus tim: Pekerja penyiapan dari penjadwal global\")",
              "            self.assertIn(f\"Array Contains({global_name}.PemainManusia, Event Player) == False;\", setup_worker)",
              "            self.assertIn(\"Call Subroutine(TenangkanPemain);\", setup_worker)",
              "            self.assertIn(\"Call Subroutine(SiapkanPemain);\", setup_worker)",
              "            leave = next(body for name, body in _rules(source) if \"Pemain Keluar\" in name and \"Player Left Match;\" in body)",
              "            self.assertIn(\"Wait(0.500, Ignore Condition);\", leave)",
              "            self.assertIn(\"Abort If(Entity Exists(Event Player) == True);\", leave)",
              "            self.assertIn(\"Call Subroutine(BersihkanPemain);\", leave)",
          ]
          text = replace_class_method(text, "test_team_switch_uses_full_cleanup_and_leave_cleanup_is_exact", runtime_method)
          p.write_text(text, encoding="utf-8")

          p = Path("tests/test_ghost_fly.py")
          text = p.read_text(encoding="utf-8")
          start_token = '            fast = subroutine(source, "ProsesCepatPemain")\n'
          end_token = '            self.assertNotIn("Wait(", team_rule)\n'
          start = text.index(start_token)
          end = text.index(end_token, start) + len(end_token)
          ghost_lines = [
              '            fast = subroutine(source, "ProsesCepatPemain")',
              '            self.assertNotIn("Call Subroutine(TenangkanPemain);", fast)',
              '            self.assertNotIn("Call Subroutine(BersihkanPemain);", fast)',
              "            team_rule = rule_with(source, '01a - Siklus tim: Reset penuh pada konteks pemain')",
              '            self.assertIn("Ongoing - Each Player;", team_rule)',
              '            self.assertIn("Event Player.TimTerakhir != Team Of(Event Player)", team_rule)',
              '            self.assertIn("Event Player.TimTerakhir = Team Of(Event Player);", team_rule)',
              '            self.assertIn("Event Player.TimSiklusTarget = Team Of(Event Player);", team_rule)',
              '            self.assertNotIn("Call Subroutine(", team_rule)',
              '            self.assertNotIn("Wait(", team_rule)',
              '            self.assertNotIn("Event Player.ModeHantuAktif =", team_rule)',
              '            self.assertNotIn("Event Player.ModeTerbangAktif =", team_rule)',
              '            self.assertNotIn("Event Player.FisikaHantuTerbangDiterapkan =", team_rule)',
          ]
          text = text[:start] + "\n".join(ghost_lines) + "\n" + text[end:]
          p.write_text(text, encoding="utf-8")

          p = Path("tools/validate_workshop.py")
          text = p.read_text(encoding="utf-8")
          text = remove_obsolete_tuple(text, "team-switch senza alcuna ricostruzione HUD")
          text = remove_obsolete_tuple(text, "team-switch descritto come solo aggiornamento dei campi Team")
          roster_anchor = "    roster_hud = next(("
          lifecycle_end = text.index(roster_anchor)
          lifecycle_start = text.rfind("    team_switch = team_switch_worker(rules)", 0, lifecycle_end)
          lifecycle_lines = [
              "    team_switch = team_switch_worker(rules)",
              '    checks.require(team_switch is not None, "lifecycle cambio squadra leggero Each Player assente")',
              "    if team_switch:",
              '        conditions = rule_block(team_switch, "conditions") or ""',
              '        actions = rule_block(team_switch, "actions") or ""',
              "        masked_actions = mask_strings(actions)",
              "        for token in (",
              '            "Is Dummy Bot(Event Player) == False;",',
              '            "Event Player.BotOtomatis == False;",',
              '            "Array Contains(Global.PemainManusia, Event Player) == True;",',
              '            "Event Player.TimTerakhir != Team Of(Event Player);",',
              "        ):",
              '            checks.require(token in conditions, f"detector team-switch senza guardia: {token}")',
              "        for token in (",
              '            "Event Player.SegarkanRosterTertunda = False;",',
              '            "Event Player.PindahTimDiproses = False;",',
              '            "Event Player.SiklusPemainAktif = False;",',
              '            "Event Player.TimTerakhir = Team Of(Event Player);",',
              '            "Event Player.TimSiklusTarget = Team Of(Event Player);",',
              '            "Event Player.WaktuSiklusTim = 0;",',
              '            "If(Global.PemainSiklusGlobal == Event Player);",',
              '            "Global.PemainSiklusGlobal = Null;",',
              '            "Global.WaktuSiklusGlobal = Total Time Elapsed + 0.250;",',
              "        ):",
              '            checks.require(token in masked_actions, f"detector team-switch leggero incompleto: {token}")',
              "        for forbidden in (",
              '            "Call Subroutine(TenangkanPemain);",',
              '            "Call Subroutine(BersihkanPemain);",',
              '            "Call Subroutine(SiapkanPemain);",',
              '            "Wait(",',
              '            "Loop;",',
              '            "For Global Variable(",',
              '            "Event Player.SegarkanRosterTertunda = True;",',
              '            "Global.PemainAktif",',
              "        ):",
              '            checks.require(forbidden not in masked_actions, f"detector team-switch leggero non deve eseguire teardown/setup: {forbidden}")',
              '        checks.require(re.search(r"\\bAbort(?:\\s+If)?\\s*(?:\\(|;)", masked_actions) is None,',
              '                       "detector team-switch leggero non deve usare Abort")',
              '        checks.require("Server Load" not in conditions,',
              '                       "detector team-switch non deve dipendere dal carico server")',
              '        checks.require(not wait_calls(team_switch.body) and action_loop_count(team_switch.body) == 0,',
              '                       "detector team-switch leggero deve essere atomico senza Wait/Loop")',
              "",
          ]
          text = text[:lifecycle_start] + "\n".join(lifecycle_lines) + text[lifecycle_end:]
          timestamp_anchor = "    timestamp_writers: list[tuple[str, str]] = []"
          ghost_end = text.index(timestamp_anchor)
          ghost_start = text.rfind("    team_switch = team_switch_worker(rules)", 0, ghost_end)
          validator_ghost_lines = [
              "    team_switch = team_switch_worker(rules)",
              '    checks.require(team_switch is not None, "Ghost/Fly: lifecycle cambio squadra leggero assente")',
              "    if team_switch:",
              "        masked = mask_strings(team_switch.body)",
              "        for forbidden in (",
              '            "Call Subroutine(TenangkanPemain);",',
              '            "Call Subroutine(BersihkanPemain);",',
              '            "Event Player.ModeHantuAktif =",',
              '            "Event Player.ModeTerbangAktif =",',
              '            "Event Player.FisikaHantuTerbangDiterapkan =",',
              "        ):",
              '            checks.require(forbidden not in masked, f"Ghost/Fly cambio squadra leggero non deve azzerare runtime: {forbidden}")',
              "",
          ]
          text = text[:ghost_start] + "\n".join(validator_ghost_lines) + text[ghost_end:]
          p.write_text(text, encoding="utf-8")

          p = Path("tests/test_validate_workshop.py")
          text = p.read_text(encoding="utf-8")
          method = [
              "    def test_team_switch_detector_forbids_full_cleanup_calls(self) -> None:",
              '        worker = self.rule(lambda rule: validator.event_type(rule) == "Ongoing - Each Player"',
              '                           and "Event Player.TimTerakhir != Team Of(Event Player)" in rule.body)',
              '        for action in ("Call Subroutine(TenangkanPemain);", "Call Subroutine(BersihkanPemain);", "Call Subroutine(SiapkanPemain);"):',
              "            with self.subTest(action=action):",
              "                mutated = self.inject_action(worker, action)",
              '                self.assert_rejected(mutated, "detector team-switch leggero non deve eseguire teardown/setup")',
              '        mutated = self.replace_in_rule(worker, "Event Player.WaktuSiklusTim = 0;", "Event Player.WaktuSiklusTim = Total Time Elapsed + 0.250;")',
              '        self.assert_rejected(mutated, "detector team-switch leggero incompleto")',
          ]
          text = replace_class_method(text, "test_team_switch_detector_requires_full_cleanup_calls", method)
          method = [
              "    def test_team_switch_worker_requires_owner_and_registered_identity_guards(self) -> None:",
              '        worker = self.rule(lambda rule: validator.event_type(rule) == "Ongoing - Each Player"',
              '                           and "Event Player.TimTerakhir != Team Of(Event Player)" in rule.body)',
              '        for token in ("Is Dummy Bot(Event Player) == False;",',
              '                      "Event Player.BotOtomatis == False;",',
              '                      "Array Contains(Global.PemainManusia, Event Player) == True;"):',
              "            with self.subTest(token=token):",
              '                self.assert_rejected(self.replace_in_rule(worker, token, ""),',
              '                                     "detector team-switch senza guardia")',
          ]
          text = replace_class_method(text, "test_team_switch_worker_requires_owner_and_registered_identity_guards", method)
          method = [
              "    def test_obsolete_current_team_switch_claim_is_rejected(self) -> None:",
              '        claim = "Dopo un cambio squadra il refresh leggero attende che il player sia spawned e vivo."',
              '        mutated = self.source + f"\\n// {claim}\\n"',
              '        self.assert_rejected(mutated, "team-switch attende spawned e vivo")',
          ]
          text = replace_class_method(text, "test_obsolete_current_team_switch_claim_is_rejected", method)
          p.write_text(text, encoding="utf-8")

          p = Path("docs/PROGETTO.md")
          text = p.read_text(encoding="utf-8")
          start = text.index("### Cambio squadra")
          end = text.find("\n### ", start + len("### Cambio squadra"))
          if end < 0:
              end = len(text)
          section_lines = [
              "### Cambio squadra",
              "",
              "Il cambio Team 1 ↔ Team 2 di un umano già registrato usa un commit leggero nella regola `01a - Siklus tim: Reset penuh pada konteks pemain`. Il detector aggiorna soltanto `TimTerakhir`, `TimSiklusTarget` e i latch lifecycle; non richiama `TenangkanPemain`, `BersihkanPemain` o `SiapkanPemain`, non ricostruisce HUD/roster e non normalizza lo stato engine durante il trasferimento.",
              "",
              "Cleanup completo e setup fresco restano riservati a una vera uscita/rejoin o a una nuova entità non ancora registrata. In questo modo il cambio squadra non concentra distruzione HUD, reset effetti, scansioni roster e riclassificazione nello stesso frame in cui il motore trasferisce il player.",
          ]
          text = text[:start] + "\n".join(section_lines) + "\n" + text[end:]
          p.write_text(text, encoding="utf-8")

          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("cambio squadra e leave/rejoin passano dal reset completo dello stato engine e dal setup iniziale.", "il cambio squadra di un umano già registrato preserva stato, HUD e preferenze; il reset completo resta per un vero leave/rejoin.")
          p.write_text(text, encoding="utf-8")

          p = Path("docs/TEST.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("la 0.8.1 introduce il reset completo al cambio squadra,", "la 0.8.1 include un cambio squadra leggero e crash-safe,")
          p.write_text(text, encoding="utf-8")

          p = Path("docs/VALIDAZIONE.md")
          text = p.read_text(encoding="utf-8")
          text = re.sub(r"- cambio squadra di un umano registrato implementato come reset completo.*?(?=\n- )", "- cambio squadra di un umano registrato gestito da `01a` come commit leggero: aggiorna Team/latch senza `TenangkanPemain`, `BersihkanPemain`, `SiapkanPemain`, `Wait`, `Loop` o scansioni roster;", text, count=1, flags=re.S)
          text = text.replace("- assenza del vecchio worker/consumer pending dedicato: il team-switch non usa più il modello pending leggero;", "- assenza di worker/consumer aggiuntivi: il team-switch resta atomico nella sola regola `01a`;")
          text = text.replace("- cambio squadra e leave/rejoin passano da setup fresco: preferenze e cursori tornano ai default;", "- cambio squadra preserva preferenze, menu e HUD; solo leave/rejoin passa da setup fresco e default;")
          p.write_text(text, encoding="utf-8")

          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          note = "- Corretto il crash al cambio squadra: un umano già registrato ora aggiorna solo identità Team e latch lifecycle, senza teardown HUD/roster, reset engine o setup nello stesso frame; il cleanup completo resta per il vero leave/rejoin.\n"
          if note not in text:
              first_heading = text.find("\n## ")
              insert_at = first_heading + 1 if first_heading >= 0 else 0
              text = text[:insert_at] + note + text[insert_at:]
          p.write_text(text, encoding="utf-8")
          PY

          rm -f \
            .github/workflows/team-switch-bootstrap.yml \
            .github/workflows/team-switch-bootstrap-v2.yml \
            .github/workflows/team-switch-bootstrap-v3.yml \
            .github/workflows/team-switch-bootstrap-v4.yml

      - name: Validate focused regression suites
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_workshop.py tests/test_runtime_maintenance.py tests/test_validate_workshop.py tests/test_ghost_fly.py
          python -m unittest tests.test_runtime_maintenance tests.test_ghost_fly tests.test_roster_rejoin_regressions tests.test_validate_workshop
          python tools/validate_workshop.py
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
          git diff --check

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix team-switch crash with lightweight lifecycle"
          git push origin HEAD:fix/team-switch-crash
