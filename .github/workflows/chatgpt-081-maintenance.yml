name: Validate 0.8.1 Maintenance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt-0.8.1-maintenance
          fetch-depth: 0

      - name: Apply 0.8.1 patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python tools/chatgpt_081_serial_lifecycle.py
          git rm -f tools/chatgpt_081_serial_lifecycle.py .github/workflows/chatgpt-081-maintenance.yml

          python -m py_compile tools/validate_workshop.py tests/test_validate_workshop.py tests/test_runtime_maintenance.py
          python tools/validate_workshop.py
          python -m unittest tests.test_runtime_maintenance
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
          python -m unittest discover -s tests -p 'test_*.py'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 0.8.1 with serialized team lifecycle"
          git push origin HEAD:chatgpt-0.8.1-maintenance
