name: Publish 0.8.1 Maintenance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-validated-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt-0.8.1-maintenance
          fetch-depth: 0

      - name: Rebuild already validated 0.8.1 tree and push non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          python tools/chatgpt_081_serial_lifecycle.py
          python tools/chatgpt_081_fix_leave_validator.py
          python tools/chatgpt_081_fix_release_status.py
          python tools/chatgpt_081_fix_leave_identity.py
          python tools/chatgpt_081_throttle_fast.py
          python tools/chatgpt_081_fix_ibot_validator.py

          mv .github/workflows/chatgpt-081-maintenance.yml /tmp/chatgpt-081-maintenance.yml
          python tools/validate_workshop.py
          python -m unittest tests.test_runtime_maintenance
          python -m unittest tests.test_validate_workshop.SemanticWorkshop081Tests.test_global_lifecycle_dispatch_excludes_classified_ibots
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
          mv /tmp/chatgpt-081-maintenance.yml .github/workflows/chatgpt-081-maintenance.yml

          git checkout origin/main -- .github/workflows/validate-workshop.yml
          git rm -f tools/chatgpt_081_serial_lifecycle.py tools/chatgpt_081_fix_leave_validator.py tools/chatgpt_081_fix_release_status.py tools/chatgpt_081_fix_leave_identity.py tools/chatgpt_081_throttle_fast.py tools/chatgpt_081_fix_ibot_validator.py tools/chatgpt_parallel_unittest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release 0.8.1 with serialized team lifecycle"
          git push origin HEAD:chatgpt-0.8.1-maintenance
