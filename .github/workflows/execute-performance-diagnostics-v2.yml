# Trigger after workflow registration
name: Execute compact performance diagnostics v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/execute-performance-diagnostics-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply diagnostics patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/improve-performance-diagnostics.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("          PY\n", start)
          lines = wf[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_diagnostics.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_diagnostics.py
      - name: Update diagnostics negative test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_validate_workshop.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def test_diagnostics_toggle_condition_cannot_be_a_comment(self) -> None:\n        mutated, replacements = re.subn(\n            r"(?m)^(\\s*)Global\\.DiagnostikPerforma == True;\\s*$",\n            r'\\1"Global.DiagnostikPerforma == True;"',\n            self.source,\n            count=1,\n        )\n        self.assertEqual(replacements, 1)\n        checks = validator.Checks()\n        validator.check_diagnostics(checks, mutated, self.rules(mutated))\n        self.assertTrue(\n            any("regola HUD diagnostica non trovata" in error for error in checks.errors),\n            checks.errors,\n        )\n'''
          new = '''    def test_diagnostics_toggle_condition_cannot_be_a_comment(self) -> None:\n        mutated = self.source.replace(\n            "Global.DiagnostikPerforma == True",\n            'Custom String("Global.DiagnostikPerforma == True") == Custom String("Global.DiagnostikPerforma == True")',\n            1,\n        )\n        self.assertNotEqual(mutated, self.source)\n        checks = validator.Checks()\n        validator.check_diagnostics(checks, mutated, self.rules(mutated))\n        self.assertTrue(\n            any("diagnostica integrata nella lista sinistra" in error for error in checks.errors),\n            checks.errors,\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'diagnostics negative test block: expected 1, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate and push
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py tests/test_validate_workshop.py README.md docs/PROGETTO.md docs/VALIDAZIONE.md
          git commit -m "Improve compact performance diagnostics HUD"
          git push origin HEAD:main
