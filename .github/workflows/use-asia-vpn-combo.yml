name: Use Asia VPN country combo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/use-asia-vpn-combo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace numeric VPN setting with Asia country names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('workshop/ruang_irama.workshop')
          validator_path = Path('tools/validate_workshop.py')
          readme_path = Path('README.md')
          project_path = Path('docs/PROGETTO.md')
          report_path = Path('docs/VALIDAZIONE.md')
          country_doc_path = Path('docs/VPN_COUNTRIES.md')

          countries = [
              'Bangladesh', 'Bhutan', 'Brunei', 'Cambodia', 'Hong Kong', 'India', 'Indonesia', 'Japan',
              'Kazakhstan', 'Kyrgyzstan', 'Laos', 'Malaysia', 'Maldives', 'Myanmar', 'Mongolia', 'Nepal',
              'Pakistan', 'Philippines', 'Singapore', 'South Korea', 'Sri Lanka', 'Tajikistan', 'Taiwan',
              'Thailand', 'Uzbekistan', 'Vietnam'
          ]
          assert len(countries) == 26 and countries.index('Indonesia') == 6

          def find_matching(text, opening):
              depth = 1
              in_string = False
              escaped = False
              for i in range(opening + 1, len(text)):
                  c = text[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          in_string = False
                      continue
                  if c == '"':
                      in_string = True
                  elif c == '(':
                      depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0:
                          return i
              raise SystemExit('Unclosed parenthesis')

          src = source_path.read_text(encoding='utf-8')

          # Replace runtime country array with the compact Asia-only list.
          marker = 'Global.DaftarNegaraVPN = Array('
          start = src.index(marker)
          opening = src.index('(', start)
          closing = find_matching(src, opening)
          arr = 'Global.DaftarNegaraVPN = Array(\n' + ',\n'.join(
              f'\t\t\tCustom String("{country}")' for country in countries
          ) + '\n\t\t)'
          src = src[:start] + arr + src[closing + 1:]

          old_setting = 'Global.IndeksNegaraVPN = Workshop Setting Integer(Custom String("CHILL DEDICATED SERVER"), Custom String("VPN country ID (0-148)"), 62, 0, 148, 1);'
          combo_options = 'Array(\n' + ',\n'.join(
              f'\t\t\tCustom String("{country}")' for country in countries
          ) + '\n\t\t)'
          new_setting = f'Global.IndeksNegaraVPN = Workshop Setting Combo(Custom String("CHILL DEDICATED SERVER"), Custom String("VPN country (Asia)"), 6, {combo_options}, 1);'
          if old_setting not in src:
              raise SystemExit('Old numeric VPN setting not found')
          src = src.replace(old_setting, new_setting, 1)
          source_path.write_text(src, encoding='utf-8')

          # Validator: require exactly the Asia list and a named combo with Indonesia default.
          val = validator_path.read_text(encoding='utf-8')
          a = val.index('def check_vpn_country_setting(')
          b = val.index('def check_diagnostics(', a)
          expected_repr = repr(countries)
          new_check = f'''def check_vpn_country_setting(checks: Checks, source: str) -> None:\n    expected = {expected_repr}\n    try:\n        countries = custom_strings(array_body(source, "Global.DaftarNegaraVPN"))\n    except ParseError as exc:\n        checks.require(False, f"VPN countries: {{exc}}")\n        return\n    checks.equal(countries, expected, "lista VPN Asia")\n    checks.equal(len(countries), 26, "paesi VPN Asia")\n    checks.equal(countries.index("Indonesia") if "Indonesia" in countries else -1, 6, "indice VPN predefinito Indonesia")\n    checks.require(\n        'Global.IndeksNegaraVPN = Workshop Setting Combo' in mask_strings(source),\n        "VPN: Workshop Setting Combo non assegnato a Global.IndeksNegaraVPN",\n    )\n    checks.require(\n        'Custom String("VPN country (Asia)")' in source,\n        "VPN: nome della combo Asia non trovato",\n    )\n    checks.require(\n        'Global.IndeksNegaraVPN = Workshop Setting Integer' not in mask_strings(source),\n        "VPN: la vecchia impostazione numerica non deve essere presente",\n    )\n    combos = [call for call in call_texts(source, "Workshop Setting Combo") if 'VPN country (Asia)' in call]\n    checks.equal(len(combos), 1, "Workshop Setting Combo VPN Asia")\n    if combos:\n        opening = combos[0].find("(")\n        args = top_level_items(combos[0][opening + 1 : -1])\n        checks.equal(len(args), 5, "argomenti Workshop Setting Combo VPN Asia")\n        if len(args) == 5:\n            checks.equal(args[2].strip(), "6", "default Workshop Setting Combo VPN Asia")\n            checks.equal(custom_strings(args[3]), expected, "opzioni Workshop Setting Combo VPN Asia")\n    checks.require(\n        'Custom String("SERVER VPN: {{0}}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source\n        and 'Custom String("เซิร์ฟเวอร์ VPN: {{0}}", Global.DaftarNegaraVPN[Global.IndeksNegaraVPN])' in source,\n        "HUD SERVER VPN non usa il paese configurato",\n    )\n\n\n'''
          val = val[:a] + new_check + val[b:]
          validator_path.write_text(val, encoding='utf-8')

          # Human-readable list, no numeric IDs.
          country_doc_path.write_text(
              '# VPN Countries — Asia\n\nLa Workshop Setting `VPN country (Asia)` mostra direttamente questi paesi/località. Il default è **Indonesia**.\n\n' +
              '\n'.join(f'- {country}' for country in countries) + '\n',
              encoding='utf-8'
          )

          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(
              r'Il paese mostrato nell’HUD `SERVER VPN`[^\n]*',
              'Il paese mostrato nell’HUD `SERVER VPN` è selezionabile direttamente per nome con `VPN country (Asia)`; la lista contiene 26 località asiatiche NordVPN e il default resta Indonesia.',
              readme,
              count=1,
          )
          readme = readme.replace('`VPN country ID (0-148)`', '`VPN country (Asia)`')
          readme = readme.replace('per gli ID consulta [`docs/VPN_COUNTRIES.md`](docs/VPN_COUNTRIES.md)', 'per la lista consulta [`docs/VPN_COUNTRIES.md`](docs/VPN_COUNTRIES.md)')
          readme_path.write_text(readme, encoding='utf-8')

          project = project_path.read_text(encoding='utf-8')
          project = re.sub(
              r'La stessa categoria di Workshop Settings espone `VPN country ID \(0-148\)`[^\n]*',
              'La stessa categoria di Workshop Settings espone `VPN country (Asia)`, una combo con 26 località asiatiche NordVPN e Indonesia come default; la lista ridotta resta sotto il limite delle Workshop Setting Options.',
              project,
              count=1,
          )
          project_path.write_text(project, encoding='utf-8')

          data = source_path.read_bytes().replace(b'\r\n', b'\n')
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          report = report_path.read_text(encoding='utf-8')
          report, n = re.subn(r'```text\n[0-9a-f]{40}\n```', f'```text\n{blob}\n```', report, count=1)
          if n != 1:
              raise SystemExit('validation report blob marker not found')
          report_path.write_text(report, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/PROGETTO.md docs/VALIDAZIONE.md docs/VPN_COUNTRIES.md
          git commit -m "Use named Asia VPN country selector"
          git push origin HEAD:main
