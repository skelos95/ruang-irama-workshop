name: One-shot PR Target Dummy Spawn HUD

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'chatgpt/fix-dummy-initial-spawn-distance-hud'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out patch helper from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: patcher
          persist-credentials: false

      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/fix-dummy-initial-spawn-distance-hud
          path: target
          persist-credentials: true

      - name: Apply functional patch
        shell: bash
        run: |
          cd target
          python ../patcher/tools/one_shot_dummy_spawn_hud.py
          git diff --check
          python -m unittest tests.test_dummy_bots
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize dummy initial spawn and HUD alignment"
          git push origin HEAD:chatgpt/fix-dummy-initial-spawn-distance-hud
