name: Apply crouch, unkillable and voice patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-crouch-unkillable-voice.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Workshop patch and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('.')
          source_path = root / 'workshop' / 'ruang_irama.workshop'
          validator_path = root / 'tools' / 'validate_workshop.py'
          tests_path = root / 'tests' / 'test_validate_workshop.py'
          report_path = root / 'docs' / 'VALIDAZIONE.md'
          readme_path = root / 'README.md'

          def replace_exact(text, old, new, expected=1, label='replacement'):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} occurrence(s), found {count}')
              return text.replace(old, new)

          def edit_rule(text, prefix, next_prefix, transform):
              start = text.index(f'rule("{prefix}')
              end = text.index(f'\nrule("{next_prefix}', start)
              block = text[start:end]
              new_block = transform(block)
              if new_block == block:
                  raise SystemExit(f'rule {prefix}: transform produced no change')
              return text[:start] + new_block + text[end:]

          src = source_path.read_text(encoding='utf-8')

          src = replace_exact(
              src,
              '\t\t50: TargetTeleportasiTerkunci\n}',
              '\t\t50: TargetTeleportasiTerkunci\n'
              '\t\t51: UnkillableAktif\n'
              '\t\t52: KursorUnkillable\n'
              '\t\t53: IndeksSuara\n'
              '\t\t54: KursorSuara\n}',
              label='player variables',
          )
          src = replace_exact(
              src,
              '\t15: SegarkanTargetTeleportasi\n}',
              '\t15: SegarkanTargetTeleportasi\n'
              '\t16: GambarUnkillable\n'
              '\t17: GambarSuara\n}',
              label='subroutines',
          )
          src = replace_exact(
              src,
              'Global.KodeMenu = Array(0, 1, 2, 3, 4, 5);',
              'Global.KodeMenu = Array(0, 1, 2, 3, 4, 5, 6);',
              label='menu codes',
          )
          src = replace_exact(src, 'inspect player, hero & ultimate', 'inspect player, hero & health', label='EN crouch help')
          src = replace_exact(src, 'lihat pemain, hero & ultimate', 'lihat pemain, hero & kesehatan', label='ID crouch help')
          src = replace_exact(src, 'ดูผู้เล่น ฮีโร่ และอัลติเมต', 'ดูผู้เล่น ฮีโร่ และพลังชีวิต', label='TH crouch help')

          old_tp_init = '\t\t\tEvent Player.KursorTeleportasi = 0;\n\t\t\tCall Subroutine(SegarkanTargetTeleportasi);\n'
          new_feature_init = (
              '\t\t\tEvent Player.KursorUnkillable = Event Player.UnkillableAktif ? 1 : 0;\n'
              '\t\t\tEvent Player.KursorSuara = Event Player.IndeksSuara;\n'
          )
          src = replace_exact(src, old_tp_init, new_feature_init, expected=2, label='menu open feature init')
          src = replace_exact(src, 'Six extremely important decisions await.', 'Seven extremely important decisions await.', label='EN menu count')
          src = replace_exact(src, 'Enam keputusan yang sangat penting menunggu.', 'Tujuh keputusan yang sangat penting menunggu.', label='ID menu count')
          src = replace_exact(src, 'มีหกตัวเลือกสำคัญรอคุณอยู่', 'มีเจ็ดตัวเลือกสำคัญรอคุณอยู่', label='TH menu count')

          def patch_rule06(block):
              block = replace_exact(block, '(Event Player.KursorUtama + 1) % 6', '(Event Player.KursorUtama + 1) % 7', label='rule06 main wrap')
              old = '''\t\tElse;\n\t\t\tCall Subroutine(SegarkanTargetTeleportasi);\n\t\t\tIf(Count Of(Event Player.DaftarTargetTeleportasi) > 0);\n\t\t\t\tEvent Player.KursorTeleportasi = (Event Player.KursorTeleportasi + 1) % Count Of(Event Player.DaftarTargetTeleportasi);\n\t\t\tEnd;\n\t\tEnd;\n'''
              new = '''\t\tElse If(Event Player.HalamanMenu == 5);\n\t\t\tEvent Player.KursorUnkillable = (Event Player.KursorUnkillable + 1) % 2;\n\t\tElse If(Event Player.HalamanMenu == 6);\n\t\t\tEvent Player.KursorSuara = (Event Player.KursorSuara + 1) % 5;\n\t\tEnd;\n'''
              return replace_exact(block, old, new, label='rule06 feature navigation')
          src = edit_rule(src, '06 - Menu:', '07 - Menu:', patch_rule06)

          def patch_rule07(block):
              block = replace_exact(block, '(Event Player.KursorUtama + 5) % 6', '(Event Player.KursorUtama + 6) % 7', label='rule07 main wrap')
              old = '''\t\tElse;\n\t\t\tCall Subroutine(SegarkanTargetTeleportasi);\n\t\t\tIf(Count Of(Event Player.DaftarTargetTeleportasi) > 0);\n\t\t\t\tEvent Player.KursorTeleportasi = (Event Player.KursorTeleportasi + Count Of(Event Player.DaftarTargetTeleportasi) - 1) % Count Of(\n\t\t\t\t\tEvent Player.DaftarTargetTeleportasi);\n\t\t\tEnd;\n\t\tEnd;\n'''
              new = '''\t\tElse If(Event Player.HalamanMenu == 5);\n\t\t\tEvent Player.KursorUnkillable = (Event Player.KursorUnkillable + 1) % 2;\n\t\tElse If(Event Player.HalamanMenu == 6);\n\t\t\tEvent Player.KursorSuara = (Event Player.KursorSuara + 4) % 5;\n\t\tEnd;\n'''
              return replace_exact(block, old, new, label='rule07 feature navigation')
          src = edit_rule(src, '07 - Menu:', '07b - Menu kamera:', patch_rule07)

          start_07d = src.index('rule("07d - Menu Teleportasi:')
          end_07d = src.index('\nrule("08 - Menu 0:', start_07d)
          src = src[:start_07d] + src[end_07d + 1:]

          def patch_rule10(block):
              marker = '\t\tElse;\n\t\t\tEvent Player.JenisTeleportasiTerkunci = Event Player.KursorTeleportasi < 2 ? Event Player.KursorTeleportasi : 2;\n'
              start = block.index(marker)
              branch_end = block.rfind('\t\tEnd;\n\t}\n}')
              if branch_end < start:
                  raise SystemExit('rule10: final teleport branch end not found')
              new = '''\t\tElse If(Event Player.HalamanMenu == 5);\n\t\t\tEvent Player.UnkillableAktif = Event Player.KursorUnkillable == 1;\n\t\t\tIf(Event Player.UnkillableAktif == True);\n\t\t\t\tSet Status(Event Player, Null, Unkillable, 9999);\n\t\t\t\tIf(Is Alive(Event Player) == True);\n\t\t\t\t\tSet Player Health(Event Player, 1);\n\t\t\t\tEnd;\n\t\t\t\tSmall Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Unkillable + 1 HP enabled.") : Event Player.IndeksBahasa == 1 ? Custom String(\n\t\t\t\t\t"Unkillable + 1 HP aktif.") : Custom String("เปิด Unkillable + 1 HP แล้ว"));\n\t\t\tElse;\n\t\t\t\tClear Status(Event Player, Unkillable);\n\t\t\t\tIf(Is Alive(Event Player) == True);\n\t\t\t\t\tSet Player Health(Event Player, Max Health(Event Player));\n\t\t\t\tEnd;\n\t\t\t\tSmall Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Unkillable + 1 HP disabled.") : Event Player.IndeksBahasa == 1 ? Custom String(\n\t\t\t\t\t"Unkillable + 1 HP nonaktif.") : Custom String("ปิด Unkillable + 1 HP แล้ว"));\n\t\t\tEnd;\n\t\t\tCall Subroutine(GambarMenu);\n\t\tElse;\n\t\t\tEvent Player.IndeksSuara = Event Player.KursorSuara;\n\t\t\tIf(Event Player.IndeksSuara == 0);\n\t\t\t\tStop Modifying Hero Voice Lines(Event Player);\n\t\t\tElse If(Event Player.IndeksSuara == 1);\n\t\t\t\tStart Modifying Hero Voice Lines(Event Player, 0.500, False);\n\t\t\tElse If(Event Player.IndeksSuara == 2);\n\t\t\t\tStart Modifying Hero Voice Lines(Event Player, 0.750, False);\n\t\t\tElse If(Event Player.IndeksSuara == 3);\n\t\t\t\tStart Modifying Hero Voice Lines(Event Player, 1.250, False);\n\t\t\tElse;\n\t\t\t\tStart Modifying Hero Voice Lines(Event Player, 1.500, False);\n\t\t\tEnd;\n\t\t\tSmall Message(Event Player, Event Player.IndeksBahasa == 0 ? Custom String("Hero voice modifier applied.") : Event Player.IndeksBahasa == 1 ? Custom String(\n\t\t\t\t"Pengubah suara hero diterapkan.") : Custom String("ใช้ตัวปรับเสียงฮีโร่แล้ว"));\n\t\t\tCall Subroutine(GambarMenu);\n\t\tEnd;\n'''
              return block[:start] + new + block[branch_end + len('\t\tEnd;\n'):]
          src = edit_rule(src, '10 - Menu:', '11 - Menu:', patch_rule10)

          new_rule13 = '''rule("13 - Intip Pahlawan: Tampilkan ikon, nama, dan persentase kesehatan")\n{\n\tevent\n\t{\n\t\tOngoing - Each Player;\n\t\tAll;\n\t\tAll;\n\t}\n\n\tconditions\n\t{\n\t\tEvent Player.Manusia == True;\n\t\tIs Alive(Event Player) == True;\n\t\tEvent Player.MenuTerbuka == False;\n\t\tEvent Player.ModeKamera != 2;\n\t\tEvent Player.InspeksiAktif == False;\n\t\tIs Button Held(Event Player, Button(Crouch)) == True;\n\t}\n\n\tactions\n\t{\n\t\tEvent Player.InspeksiAktif = True;\n\t\tDisable Nameplates(All Players(All Teams), Event Player);\n\t\tEvent Player.PelatNamaDinonaktifkan = True;\n\t\tCall Subroutine(SegarkanTargetInspeksi);\n\t\tCreate In-World Text(Event Player, Event Player.TargetInspeksi == Null ? Custom String("") : Custom String("{0} {1} | {2}%",\n\t\t\tHero Icon String(Is Duplicating(Event Player.TargetInspeksi) ? Hero Being Duplicated(Event Player.TargetInspeksi) : Hero Of(\n\t\t\tEvent Player.TargetInspeksi)), Custom String("{0}", Event Player.TargetInspeksi), Round To Integer(Health(Event Player.TargetInspeksi) / Max Health(\n\t\t\tEvent Player.TargetInspeksi) * 100, Down)), Event Player.TargetInspeksi == Null ? Eye Position(Event Player) : Eye Position(\n\t\t\tEvent Player.TargetInspeksi) + Vector(0, 0.450, 0), 1.100, Do Not Clip, Visible To Position String and Color, Event Player.TargetInspeksi == Null\n\t\t\t? Color(White) : Player Variable(Event Player.TargetInspeksi, Manusia) == True ? Player Variable(Event Player.TargetInspeksi, WarnaNama)\n\t\t\t: Color(Orange), Visible Never);\n\t\tEvent Player.TeksDunia = Last Text ID;\n\t\tIf(Index Of Array Value(Global.PemainManusia, Event Player) >= 0);\n\t\t\tGlobal.TeksDuniaPemain[Index Of Array Value(Global.PemainManusia, Event Player)] = Event Player.TeksDunia;\n\t\tEnd;\n\t\tEvent Player.TeksDiri = Null;\n\t\tIf(Event Player.ModeKamera == 1);\n\t\t\tCreate In-World Text(Event Player, Custom String("{0} {1} | {2}%", Hero Icon String(Is Duplicating(Event Player) ? Hero Being Duplicated(\n\t\t\t\tEvent Player) : Hero Of(Event Player)), Custom String("{0}", Event Player), Round To Integer(Health(Event Player) / Max Health(Event Player) * 100, Down)),\n\t\t\t\tUpdate Every Frame(Eye Position(Event Player) + Vector(0, 0.450, 0)), 1.100, Do Not Clip, Visible To Position String and Color, Event Player.WarnaNama,\n\t\t\t\tVisible Never);\n\t\t\tEvent Player.TeksDiri = Last Text ID;\n\t\t\tIf(Index Of Array Value(Global.PemainManusia, Event Player) >= 0);\n\t\t\t\tGlobal.TeksDiriPemain[Index Of Array Value(Global.PemainManusia, Event Player)] = Event Player.TeksDiri;\n\t\t\tEnd;\n\t\tEnd;\n\t}\n}\n'''
          src = edit_rule(src, '13 - Intip Pahlawan:', '14 - Intip Pahlawan:', lambda _: new_rule13)
          src = src.replace('rule("14 - Intip Pahlawan: Perbarui garis pandang dengan sopan")', 'rule("14 - Intip Pahlawan: Perbarui target meski terhalang dinding")', 1)

          feature_rules = '''rule("18 - Unkillable: Pasang kembali status setelah respawn")\n{\n\tevent\n\t{\n\t\tOngoing - Each Player;\n\t\tAll;\n\t\tAll;\n\t}\n\n\tconditions\n\t{\n\t\tEvent Player.Manusia == True;\n\t\tEvent Player.UnkillableAktif == True;\n\t\tHas Spawned(Event Player) == True;\n\t\tIs Alive(Event Player) == True;\n\t\tHas Status(Event Player, Unkillable) == False;\n\t}\n\n\tactions\n\t{\n\t\tSet Status(Event Player, Null, Unkillable, 9999);\n\t}\n}\n\nrule("18b - Unkillable: Saat kesehatan penuh kembali ke satu HP")\n{\n\tevent\n\t{\n\t\tOngoing - Each Player;\n\t\tAll;\n\t\tAll;\n\t}\n\n\tconditions\n\t{\n\t\tEvent Player.Manusia == True;\n\t\tEvent Player.UnkillableAktif == True;\n\t\tHas Spawned(Event Player) == True;\n\t\tIs Alive(Event Player) == True;\n\t\tHealth(Event Player) >= Max Health(Event Player);\n\t}\n\n\tactions\n\t{\n\t\tSet Player Health(Event Player, 1);\n\t}\n}\n\n'''
          src = replace_exact(src, 'rule("90 - Subrutin:', feature_rules + 'rule("90 - Subrutin:', label='feature rules')

          def patch_router(block):
              old = '''\t\tElse If(Event Player.HalamanMenu == 4);\n\t\t\tCall Subroutine(GambarBalasDendam);\n\t\tElse;\n\t\t\tCall Subroutine(GambarTeleportasi);\n\t\tEnd;\n'''
              new = '''\t\tElse If(Event Player.HalamanMenu == 4);\n\t\t\tCall Subroutine(GambarBalasDendam);\n\t\tElse If(Event Player.HalamanMenu == 5);\n\t\t\tCall Subroutine(GambarUnkillable);\n\t\tElse;\n\t\t\tCall Subroutine(GambarSuara);\n\t\tEnd;\n'''
              return replace_exact(block, old, new, label='menu router')
          src = edit_rule(src, '91 - Subrutin:', '91a - Subrutin:', patch_router)

          new_main_renderer = '''rule("91a - Subrutin: Gambar menu utama")\n{\n\tevent\n\t{\n\t\tSubroutine;\n\t\tGambarUtama;\n\t}\n\n\tactions\n\t{\n\t\tCreate HUD Text(Event Player, Null, Event Player.IndeksBahasa == 0 ? Custom String("{0}\\\n{1}",\n\t\t\tCustom String("\\\n{0}: next | {1}: previous", Input Binding String(Button(Primary Fire)), Input Binding String(Button(Secondary Fire))),\n\t\t\tCustom String("{0}: open | hold {1} 0.5 sec: close", Input Binding String(Button(Interact)), Input Binding String(Button(Melee))))\n\t\t\t: Event Player.IndeksBahasa == 1 ? Custom String("{0}\\\n{1}", Custom String("\\\n{0}: berikutnya | {1}: sebelumnya", Input Binding String(Button(Primary Fire)),\n\t\t\tInput Binding String(Button(Secondary Fire))), Custom String("{0}: buka | tahan {1} 0,5 dtk: tutup", Input Binding String(Button(Interact)),\n\t\t\tInput Binding String(Button(Melee)))) : Custom String("{0}\\\n{1}", Custom String("\\\n{0}: ถัดไป | {1}: ก่อนหน้า", Input Binding String(Button(Primary Fire)),\n\t\t\tInput Binding String(Button(Secondary Fire))), Custom String("{0}: เปิด | กด {1} ค้างเพื่อปิด", Input Binding String(Button(Interact)),\n\t\t\tInput Binding String(Button(Melee)))), Event Player.IndeksBahasa == 0 ? Event Player.KursorUtama == 0 ? Custom String(\n\t\t\t"0 - SOUNDTRACK\\\nCURRENT: {0}", Event Player.IndeksGenre >= 0 ? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("no soundtrack yet"))\n\t\t\t: Event Player.KursorUtama == 1 ? Custom String("1 - THIRD-PERSON CAMERA\\\nCURRENT: {0}", Event Player.ModeKamera == 0 ? Custom String("off")\n\t\t\t: Event Player.ModeKamera == 1 ? Custom String("your hero") : Custom String("watching {0}", Event Player.TargetKamera))\n\t\t\t: Event Player.KursorUtama == 2 ? Custom String("2 - NAME COLOR\\\nCURRENT: {0}", Global.NamaWarnaEN[Event Player.IndeksWarna])\n\t\t\t: Event Player.KursorUtama == 3 ? Custom String("3 - HUD LANGUAGE\\\nCURRENT: {0}", Global.NamaBahasa[Event Player.IndeksBahasa])\n\t\t\t: Event Player.KursorUtama == 4 ? Custom String("4 - REVENGE\\\nDIRECT KILLS OWED TO YOU")\n\t\t\t: Event Player.KursorUtama == 5 ? Custom String("5 - UNKILLABLE + 1 HP\\\nCURRENT: {0}", Event Player.UnkillableAktif ? Custom String("ON") : Custom String("OFF"))\n\t\t\t: Custom String("6 - VOICE MODIFIER\\\nCURRENT: {0}", Event Player.IndeksSuara == 0 ? Custom String("NORMAL") : Event Player.IndeksSuara == 1 ? Custom String(\n\t\t\t\t"LOW 0.50x") : Event Player.IndeksSuara == 2 ? Custom String("LOW 0.75x") : Event Player.IndeksSuara == 3 ? Custom String("HIGH 1.25x") : Custom String("HIGH 1.50x"))\n\t\t\t: Event Player.IndeksBahasa == 1 ? Event Player.KursorUtama == 0 ? Custom String("0 - SOUNDTRACK\\\nSAAT INI: {0}", Event Player.IndeksGenre >= 0\n\t\t\t? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("belum pilih soundtrack")) : Event Player.KursorUtama == 1 ? Custom String(\n\t\t\t"1 - KAMERA ORANG KETIGA\\\nSAAT INI: {0}", Event Player.ModeKamera == 0 ? Custom String("mati") : Event Player.ModeKamera == 1 ? Custom String("hero sendiri")\n\t\t\t: Custom String("menonton {0}", Event Player.TargetKamera)) : Event Player.KursorUtama == 2 ? Custom String("2 - WARNA NAMA\\\nSAAT INI: {0}",\n\t\t\tGlobal.NamaWarna[Event Player.IndeksWarna]) : Event Player.KursorUtama == 3 ? Custom String("3 - BAHASA HUD\\\nSAAT INI: {0}", Global.NamaBahasa[Event Player.IndeksBahasa])\n\t\t\t: Event Player.KursorUtama == 4 ? Custom String("4 - BALAS DENDAM\\\nUTANG KILL LANGSUNG") : Event Player.KursorUtama == 5 ? Custom String(\n\t\t\t"5 - UNKILLABLE + 1 HP\\\nSAAT INI: {0}", Event Player.UnkillableAktif ? Custom String("AKTIF") : Custom String("MATI")) : Custom String(\n\t\t\t"6 - PENGUBAH SUARA\\\nSAAT INI: {0}", Event Player.IndeksSuara == 0 ? Custom String("NORMAL") : Event Player.IndeksSuara == 1 ? Custom String("RENDAH 0.50x")\n\t\t\t: Event Player.IndeksSuara == 2 ? Custom String("RENDAH 0.75x") : Event Player.IndeksSuara == 3 ? Custom String("TINGGI 1.25x") : Custom String("TINGGI 1.50x"))\n\t\t\t: Event Player.KursorUtama == 0 ? Custom String("0 - เพลงประกอบ\\\nปัจจุบัน: {0}", Event Player.IndeksGenre >= 0 ? Global.DaftarGenre[Event Player.IndeksGenre]\n\t\t\t: Custom String("ยังไม่ได้เลือกเพลง")) : Event Player.KursorUtama == 1 ? Custom String("1 - กล้องบุคคลที่สาม\\\nสถานะ: {0}", Event Player.ModeKamera == 0 ? Custom String("ปิด")\n\t\t\t: Event Player.ModeKamera == 1 ? Custom String("ฮีโร่ของคุณ") : Custom String("กำลังดู {0}", Event Player.TargetKamera)) : Event Player.KursorUtama == 2 ? Custom String(\n\t\t\t"2 - สีชื่อ\\\nปัจจุบัน: {0}", Global.NamaWarnaTH[Event Player.IndeksWarna]) : Event Player.KursorUtama == 3 ? Custom String("3 - ภาษา HUD\\\nปัจจุบัน: {0}",\n\t\t\tGlobal.NamaBahasa[Event Player.IndeksBahasa]) : Event Player.KursorUtama == 4 ? Custom String("4 - ล้างแค้น\\\nศัตรูที่ติดหนี้คุณ") : Event Player.KursorUtama == 5\n\t\t\t? Custom String("5 - UNKILLABLE + 1 HP\\\nสถานะ: {0}", Event Player.UnkillableAktif ? Custom String("เปิด") : Custom String("ปิด")) : Custom String(\n\t\t\t"6 - ปรับเสียงฮีโร่\\\nสถานะ: {0}", Event Player.IndeksSuara == 0 ? Custom String("ปกติ") : Event Player.IndeksSuara == 1 ? Custom String("ต่ำ 0.50x")\n\t\t\t: Event Player.IndeksSuara == 2 ? Custom String("ต่ำ 0.75x") : Event Player.IndeksSuara == 3 ? Custom String("สูง 1.25x") : Custom String("สูง 1.50x")), Top, 100,\n\t\t\tColor(White), Custom Color(210, 230, 255, 255), Custom Color(255, 185, 65, 255), Visible To and String, Visible Never);\n\t\tEvent Player.HudMenu = Last Text ID;\n\t}\n}\n'''
          src = edit_rule(src, '91a - Subrutin:', '91b - Subrutin:', lambda _: new_main_renderer)

          new_renderers = '''rule("91h - Subrutin: Gambar menu unkillable")\n{\n\tevent\n\t{\n\t\tSubroutine;\n\t\tGambarUnkillable;\n\t}\n\n\tactions\n\t{\n\t\tCreate HUD Text(Event Player, Null, Event Player.IndeksBahasa == 0 ? Custom String("{0}\\\n{1}", Custom String("\\\n{0}: next | {1}: previous",\n\t\t\tInput Binding String(Button(Primary Fire)), Input Binding String(Button(Secondary Fire))), Custom String("{0}: apply | {1}: back", Input Binding String(Button(Interact)),\n\t\t\tInput Binding String(Button(Reload)))) : Event Player.IndeksBahasa == 1 ? Custom String("{0}\\\n{1}", Custom String("\\\n{0}: berikutnya | {1}: sebelumnya",\n\t\t\tInput Binding String(Button(Primary Fire)), Input Binding String(Button(Secondary Fire))), Custom String("{0}: pakai | {1}: kembali", Input Binding String(Button(Interact)),\n\t\t\tInput Binding String(Button(Reload)))) : Custom String("{0}\\\n{1}", Custom String("\\\n{0}: ถัดไป | {1}: ก่อนหน้า", Input Binding String(Button(Primary Fire)),\n\t\t\tInput Binding String(Button(Secondary Fire))), Custom String("{0}: ใช้ | {1}: กลับ", Input Binding String(Button(Interact)), Input Binding String(Button(Reload)))),\n\t\t\tEvent Player.IndeksBahasa == 0 ? Custom String("5 - UNKILLABLE + 1 HP {0}/2\\\n> {1}", Event Player.KursorUnkillable + 1, Event Player.KursorUnkillable == 0\n\t\t\t? Custom String("OFF") : Custom String("ON")) : Event Player.IndeksBahasa == 1 ? Custom String("5 - UNKILLABLE + 1 HP {0}/2\\\n> {1}",\n\t\t\tEvent Player.KursorUnkillable + 1, Event Player.KursorUnkillable == 0 ? Custom String("MATI") : Custom String("AKTIF")) : Custom String(\n\t\t\t"5 - UNKILLABLE + 1 HP {0}/2\\\n> {1}", Event Player.KursorUnkillable + 1, Event Player.KursorUnkillable == 0 ? Custom String("ปิด") : Custom String("เปิด")),\n\t\t\tTop, 100, Color(White), Custom Color(255, 220, 220, 255), Custom Color(255, 85, 85, 255), Visible To and String, Visible Never);\n\t\tEvent Player.HudMenu = Last Text ID;\n\t}\n}\n\nrule("91i - Subrutin: Gamba