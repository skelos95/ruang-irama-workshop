name: Run smooth camera chase patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry smooth camera patch without stale validator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply smooth camera patch
        run: python .github/scripts/smooth_camera_chase.py

      - name: Check file balance and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('workshop/ruang_irama.workshop').read_text(encoding='utf-8')
          for a, b in [('(', ')'), ('{', '}')]:
              if s.count(a) != s.count(b):
                  raise SystemExit(f'unbalanced {a}{b}: {s.count(a)} vs {s.count(b)}')
          print('basic balance check passed')
          PY
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop README.md .github/scripts/smooth_camera_chase.py .github/workflows/run-smooth-camera-chase.yml
          git commit -m "Smooth third-person camera with filtered chase"
          git push
