name: Fix patch workflow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-patch-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix temporary patch workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-crouch-unkillable-voice.yml')
          text = path.read_text(encoding='utf-8')
          old = """          for name in (\\n              'test_teleport_without_pre_refresh_identity_capture_is_rejected',\\n              'test_teleport_kind_cannot_be_constant_two',\\n              'test_teleport_cannot_reread_cursor_after_refresh',\\n          ):\\n              tests = replace_exact(tests, f'    def {name}(', f'    def legacy_{name}(', label=f'disable {name}')"""
          new = """          for name in (
              'test_teleport_without_pre_refresh_identity_capture_is_rejected',
              'test_teleport_kind_cannot_be_constant_two',
              'test_teleport_cannot_reread_cursor_after_refresh',
          ):
              tests = replace_exact(tests, f'    def {name}(', f'    def legacy_{name}(', label=f'disable {name}')"""
          if old not in text:
              raise SystemExit('broken loop marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-patch-workflow.yml
          git add .github/workflows/apply-crouch-unkillable-voice.yml
          git commit -m "Fix temporary Workshop patch workflow"
          git push origin HEAD:main
