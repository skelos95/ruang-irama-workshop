name: Apply Fly and resurrect docs alignment

on:
  push:
    branches:
      - fix/fly-ramp-safe-resurrect-20260829

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply docs patch
        run: python tools/apply_fly_resurrect_docs_patch.py
      - name: Remove temporary helpers
        run: rm .github/workflows/apply-fly-resurrect-docs.yml tools/apply_fly_resurrect_docs_patch.py
      - name: Validate repository
        run: |
          python tools/validate_workshop.py
          python tools/check_clipboard_import.py --language it-IT
          git diff --check
      - name: Commit aligned docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Align Fly and Jump resurrection docs"
          git push origin HEAD:fix/fly-ramp-safe-resurrect-20260829
