name: Apply instant match start phases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/instant-start-phases.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch instant start and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('workshop/ruang_irama.workshop')
          validator_path = Path('tools/validate_workshop.py')
          readme_path = Path('README.md')
          project_path = Path('docs/PROGETTO.md')
          test_doc_path = Path('docs/TEST.md')
          report_path = Path('docs/VALIDAZIONE.md')

          def replace_exact(text, old, new, expected=1, label='replacement'):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected}, found {count}')
              return text.replace(old, new)

          src = source_path.read_text(encoding='utf-8')
          instant_rules = '''rule("00a1 - Global: Mulai mode segera saat menunggu pemain")
{
\tevent
\t{
\t\tOngoing - Global;
\t}

\tconditions
\t{
\t\tGlobal.Siap == True;
\t\tIs Waiting For Players == True;
\t}

\tactions
\t{
\t\tStart Game Mode;
\t}
}

rule("00a2 - Global: Lewati pemilihan pahlawan")
{
\tevent
\t{
\t\tOngoing - Global;
\t}

\tconditions
\t{
\t\tGlobal.Siap == True;
\t\tIs Assembling Heroes == True;
\t}

\tactions
\t{
\t\tSet Match Time(0);
\t}
}

rule("00a3 - Global: Lewati persiapan awal")
{
\tevent
\t{
\t\tOngoing - Global;
\t}

\tconditions
\t{
\t\tGlobal.Siap == True;
\t\tIs In Setup == True;
\t}

\tactions
\t{
\t\tSet Match Time(0);
\t}
}

'''
          src = replace_exact(
              src,
              'rule("00b - Global: Perbarui hitung mundur server")',
              instant_rules + 'rule("00b - Global: Perbarui hitung mundur server")',
              label='instant start rules insertion',
          )
          source_path.write_text(src, encoding='utf-8')

          val = validator_path.read_text(encoding='utf-8')
          instant_check = '''\n\ndef check_instant_start(checks: Checks, source: str, rules: list[Rule]) -> None:\n    waiting = [\n        rule for rule in rules\n        if code_contains(\n            rule.body,\n            "Ongoing - Global;",\n            "Global.Siap == True;",\n            "Is Waiting For Players == True;",\n            "Start Game Mode;",\n        )\n    ]\n    checks.equal(len(waiting), 1, "avvio immediato da Waiting For Players")\n\n    assembling = [\n        rule for rule in rules\n        if code_contains(\n            rule.body,\n            "Ongoing - Global;",\n            "Global.Siap == True;",\n            "Is Assembling Heroes == True;",\n            "Set Match Time(0);",\n        )\n    ]\n    checks.equal(len(assembling), 1, "skip Assemble Heroes")\n\n    setup = [\n        rule for rule in rules\n        if code_contains(\n            rule.body,\n            "Ongoing - Global;",\n            "Global.Siap == True;",\n            "Is In Setup == True;",\n            "Set Match Time(0);",\n        )\n    ]\n    checks.equal(len(setup), 1, "skip fase Setup")\n\n    checks.require(\n        assembling and setup and assembling[0].name != setup[0].name,\n        "Assemble Heroes e Setup devono restare in regole separate",\n    )\n\n'''
          val = replace_exact(
              val,
              '\ndef check_bot_lifecycle(',
              instant_check + 'def check_bot_lifecycle(',
              label='instant start validator function',
          )
          val = replace_exact(
              val,
              '        check_timer_and_match(checks, source, rules)\n',
              '        check_timer_and_match(checks, source, rules)\n        check_instant_start(checks, source, rules)\n',
              label='instant start validator call',
          )
          validator_path.write_text(val, encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          marker = '- HUD centrale con nome server, `SERVER LOCATION` configurabile e countdown personalizzato.'
          replacement = marker + '\n- Avvio rapido: Waiting for Players viene avviato automaticamente e Assemble Heroes / Setup vengono portati immediatamente a zero.'
          if marker in readme:
              readme = readme.replace(marker, replacement, 1)
          else:
              raise SystemExit('README instant start marker not found')
          readme_path.write_text(readme, encoding='utf-8')

          project = project_path.read_text(encoding='utf-8')
          project += '\n\n## Avvio immediato\n\nQuando il server entra in `Waiting for Players`, il Workshop esegue `Start Game Mode`. `Is Assembling Heroes` e `Is In Setup` sono gestiti da due regole globali separate che impostano `Set Match Time(0)`, così ogni fase viene saltata anche quando le transizioni sono consecutive. Il countdown CHILL resta indipendente perché usa `Total Time Elapsed` e non `Match Time`.\n'
          project_path.write_text(project, encoding='utf-8')

          tests = test_doc_path.read_text(encoding='utf-8')
          tests += '\n- **Avvio rapido live:** verificare nel client che Waiting for Players avvii subito il mode, Assemble Heroes venga saltato e Setup/prepare-to-attack non introduca attese visibili nei mode core 6v6.\n'
          test_doc_path.write_text(tests, encoding='utf-8')

          data = source_path.read_bytes().replace(b'\r\n', b'\n')
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          report = report_path.read_text(encoding='utf-8')
          report, n = re.subn(r'```text\n[0-9a-f]{40}\n```', f'```text\n{blob}\n```', report, count=1)
          if n != 1:
              raise SystemExit('validation report blob marker not found')
          rule_count = len(re.findall(r'(?m)^\s*rule\s*\(', src))
          report = re.sub(
              r'Generi: 100 \| Lingue: 3 \| Regole: \d+ \| Raycast camera: 1',
              f'Generi: 100 | Lingue: 3 | Regole: {rule_count} | Raycast camera: 1',
              report,
              count=1,
          )
          report_path.write_text(report, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop tools/validate_workshop.py README.md docs/PROGETTO.md docs/TEST.md docs/VALIDAZIONE.md
          git commit -m "Skip pre-match phases for instant start"
          git push origin HEAD:main
