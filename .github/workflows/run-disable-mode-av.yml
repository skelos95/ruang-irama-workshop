name: Run mode announcer and UI cleanup

on:
  push:
    paths:
      - '.github/workflows/run-disable-mode-av.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable mode announcer, music and UI
        run: python .github/scripts/disable_mode_av.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Disable built-in mode announcer music and UI"
          git push
