name: Run endless server timer settings

on:
  push:
    paths:
      - '.github/workflows/run-add-endless-server-timer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply endless server timer
        run: python .github/scripts/add_endless_server_timer.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add configurable endless server timer"
          git push
