name: Diagnose PR 37

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' > diagnostic.log 2>&1
          echo "UNIT_EXIT=$?" >> diagnostic.log
          python tools/validate_workshop.py >> diagnostic.log 2>&1
          echo "VALIDATOR_EXIT=$?" >> diagnostic.log
          python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT >> diagnostic.log 2>&1
          echo "PREFLIGHT_EXIT=$?" >> diagnostic.log
          cat diagnostic.log
      - name: Post diagnostics to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          output = Path('diagnostic.log').read_text(encoding='utf-8', errors='replace')
          body = 'Temporary CI diagnostics for PR #37:\n\n```text\n' + output[-50000:] + '\n```'
          request = urllib.request.Request(
              'https://api.github.com/repos/skelos95/ruang-irama-workshop/issues/37/comments',
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'pr37-diagnostics',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status)
          PY
