name: Run smoother camera activation

on:
  push:
    paths:
      - '.github/scripts/remove_camera_activation_reset.py'
      - '.github/workflows/run-remove-camera-activation-reset.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply smoother camera activation
        run: python .github/scripts/remove_camera_activation_reset.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop
          git add -u .github/scripts/remove_camera_activation_reset.py .github/workflows/run-remove-camera-activation-reset.yml
          git commit -m "Smooth third-person camera activation"
          git push
