name: Temporary PR 8 Italian Generator

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/italian-workshop-clipboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/italian-workshop-clipboard
          persist-credentials: true

      - name: Check out pinned OverPy localization database
        uses: actions/checkout@v4
        with:
          repository: Zezombye/overpy
          ref: d854bf01fc7bbf3b2169f67408c07a8da8989ad6
          path: .overpy
          persist-credentials: false

      - name: Generate it-IT Workshop clipboard source
        shell: bash
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import json
          import re

          root = Path('.overpy/src/data')
          source_path = Path('workshop/ruang_irama.workshop')
          output_path = Path('workshop/ruang_irama.it-IT.workshop')
          source = source_path.read_text(encoding='utf-8')

          candidates: dict[str, set[str]] = defaultdict(set)
          locale_line = re.compile(
              r'^(?P<indent>\s*)"(?P<locale>en-US|it-IT)"\s*:\s*'
              r'(?P<value>"(?:[^"\\]|\\.)*")\s*,?\s*$'
          )

          for path in sorted(root.glob('*.ts')):
              lines = path.read_text(encoding='utf-8').splitlines()
              index = 0
              while index < len(lines):
                  match = locale_line.match(lines[index])
                  if not match or match.group('locale') != 'en-US':
                      index += 1
                      continue

                  indent = len(match.group('indent'))
                  en = json.loads(match.group('value'))
                  it = en
                  probe = index + 1
                  while probe < len(lines):
                      candidate = locale_line.match(lines[probe])
                      stripped = lines[probe].strip()
                      leading = len(lines[probe]) - len(lines[probe].lstrip())
                      if candidate and len(candidate.group('indent')) == indent:
                          if candidate.group('locale') == 'it-IT':
                              it = json.loads(candidate.group('value'))
                              break
                      if stripped.startswith('}') and leading < indent:
                          break
                      probe += 1

                  if isinstance(en, str) and isinstance(it, str) and en:
                      candidates[en].add(it)
                  index += 1

          # Quoted Workshop text is data, not grammar: preserve rule titles,
          # comments and Custom String payloads byte-for-byte.
          quoted = re.compile(r'"(?:[^"\\]|\\.)*"')

          # Build a conservative global mapping. If an English spelling maps to
          # two genuinely different Italian spellings in different type tables,
          # leave it for the explicit contextual rules below.
          mapping: dict[str, str] = {}
          ambiguous: dict[str, set[str]] = {}
          for en, targets in candidates.items():
              localized = {target for target in targets if target != en}
              if len(localized) == 1:
                  mapping[en] = next(iter(localized))
              elif len(localized) > 1:
                  ambiguous[en] = localized

          ordered = sorted(mapping, key=lambda item: (-len(item), item))
          if not ordered:
              raise SystemExit('No OverPy localization mappings found')

          token_re = re.compile(
              r'(?<![A-Za-z0-9_])(?:'
              + '|'.join(re.escape(item) for item in ordered)
              + r')(?![A-Za-z0-9_])'
          )

          def translate_code(segment: str) -> tuple[str, int]:
              # Longest native spellings are translated first. This consumes
              # expressions such as Set Damage Received / Set Ability 1 Enabled
              # before the shorter ambiguous words Damage / Enabled are seen.
              translated, count = token_re.subn(
                  lambda found: mapping[found.group(0)], segment
              )

              # Context-dependent tokens used by this project:
              # - bare Damage(...) is the Damage action -> Danneggia;
              # - Escort occurs only as a Game Mode literal -> Trasporto;
              # - bare All; lines are event team/player selectors -> Tutti;
              # - ButtonLiteral Secondary Fire intentionally stays English in
              #   OverPy's it-IT table, so it is left untouched.
              translated, n = re.subn(
                  r'(?<![A-Za-z0-9_])Damage(?=\s*\()',
                  'Danneggia',
                  translated,
              )
              count += n
              translated, n = re.subn(
                  r'(?<![A-Za-z0-9_])Escort(?![A-Za-z0-9_])',
                  'Trasporto',
                  translated,
              )
              count += n
              translated, n = re.subn(
                  r'(?m)^(\s*)All;(\s*)$',
                  r'\1Tutti;\2',
                  translated,
              )
              count += n
              return translated, count

          out: list[str] = []
          cursor = 0
          replacement_count = 0
          for match in quoted.finditer(source):
              translated, count = translate_code(source[cursor:match.start()])
              replacement_count += count
              out.append(translated)
              out.append(match.group(0))
              cursor = match.end()
          translated, count = translate_code(source[cursor:])
          replacement_count += count
          out.append(translated)
          output = ''.join(out)

          if output == source or replacement_count == 0:
              raise SystemExit('Localization produced no changes')

          # Safety assertions for the exact context-dependent cases above.
          outside_strings = quoted.sub('', output)
          forbidden_remaining = {
              'bare event All': r'(?m)^\s*All;\s*$',
              'Damage action': r'(?<![A-Za-z0-9_])Damage(?=\s*\()',
              'Escort game mode literal': r'(?<![A-Za-z0-9_])Escort(?![A-Za-z0-9_])',
          }
          for label, pattern in forbidden_remaining.items():
              if re.search(pattern, outside_strings):
                  raise SystemExit(f'Unlocalized contextual token remains: {label}')

          if 'Button(Secondary Fire)' not in output:
              raise SystemExit('ButtonLiteral Secondary Fire was translated unexpectedly')

          output_path.write_text(output, encoding='utf-8')
          print(
              f'Loaded {len(candidates)} localized spellings; '
              f'applied {replacement_count} replacements; '
              f'{len(ambiguous)} context-dependent spellings left out of global mapping'
          )
          PY

          python tools/check_clipboard_import.py \
            workshop/ruang_irama.it-IT.workshop --language it-IT

      - name: Write generation manifest
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path('workshop/ruang_irama.workshop')
          manifest = Path('workshop/ruang_irama.it-IT.manifest')
          manifest.write_text(
              'source_sha256=' + sha256(source.read_bytes()).hexdigest() + '\n'
              'language=it-IT\n'
              'overpy_ref=d854bf01fc7bbf3b2169f67408c07a8da8989ad6\n'
              'generator=lexical-localization-tables\n',
              encoding='utf-8',
          )
          PY

      - name: Commit generated Italian source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- workshop/ruang_irama.it-IT.workshop workshop/ruang_irama.it-IT.manifest
          git diff --cached --quiet && exit 0
          git commit -m 'Generate Italian Workshop clipboard source'
          git push origin HEAD:chatgpt/italian-workshop-clipboard
