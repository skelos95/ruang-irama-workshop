name: Temporary PR 8 Italian Generator

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/italian-workshop-clipboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: chatgpt/italian-workshop-clipboard
          persist-credentials: true

      - name: Check out pinned OverPy localization database
        uses: actions/checkout@v4
        with:
          repository: Zezombye/overpy
          ref: d854bf01fc7bbf3b2169f67408c07a8da8989ad6
          path: .overpy
          persist-credentials: false

      - name: Generate it-IT Workshop clipboard source
        shell: bash
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import json
          import re

          root = Path('.overpy/src/data')
          source_path = Path('workshop/ruang_irama.workshop')
          output_path = Path('workshop/ruang_irama.it-IT.workshop')
          source = source_path.read_text(encoding='utf-8')

          # Generated OverPy data blocks are valid JSON between these markers.
          candidates: dict[str, set[str]] = defaultdict(set)

          def visit(value):
              if isinstance(value, dict):
                  en = value.get('en-US')
                  if isinstance(en, str):
                      it = value.get('it-IT', en)
                      if isinstance(it, str) and en:
                          candidates[en].add(it)
                  for child in value.values():
                      visit(child)
              elif isinstance(value, list):
                  for child in value:
                      visit(child)

          for path in sorted(root.glob('*.ts')):
              text = path.read_text(encoding='utf-8')
              for block in re.findall(
                  r'//begin-json\s*(.*?)\s*//end-json', text, flags=re.S
              ):
                  try:
                      visit(json.loads(block))
                  except json.JSONDecodeError as exc:
                      raise SystemExit(f'Invalid OverPy JSON block in {path}: {exc}')

          # Never translate the contents of Workshop quoted strings. This preserves
          # rule titles, Custom String payloads, player-facing text and comments.
          quoted = re.compile(r'"(?:[^"\\]|\\.)*"')
          pieces = []
          cursor = 0
          code_segments = []
          for match in quoted.finditer(source):
              code_segments.append(source[cursor:match.start()])
              cursor = match.end()
          code_segments.append(source[cursor:])
          code_only = '\n'.join(code_segments)

          # Ambiguous native spellings are unsafe only if they actually occur in
          # this source. Refuse to guess in that case.
          conflicts = {}
          for en, targets in candidates.items():
              if len(targets) <= 1:
                  continue
              boundary = rf'(?<![A-Za-z0-9_]){re.escape(en)}(?![A-Za-z0-9_])'
              if re.search(boundary, code_only):
                  conflicts[en] = sorted(targets)
          if conflicts:
              for en, targets in sorted(conflicts.items()):
                  print(f'AMBIGUOUS: {en!r} -> {targets}')
              raise SystemExit('Ambiguous localized tokens are used by the Workshop source')

          mapping = {
              en: next(iter(targets))
              for en, targets in candidates.items()
              if len(targets) == 1 and next(iter(targets)) != en
          }

          # Match longest native tokens first and only at identifier boundaries.
          ordered = sorted(mapping, key=lambda item: (-len(item), item))
          if not ordered:
              raise SystemExit('No OverPy localization mappings found')
          token_re = re.compile(
              r'(?<![A-Za-z0-9_])(?:'
              + '|'.join(re.escape(item) for item in ordered)
              + r')(?![A-Za-z0-9_])'
          )

          def translate_code(segment: str) -> str:
              return token_re.sub(lambda match: mapping[match.group(0)], segment)

          out = []
          cursor = 0
          replacements = 0
          for match in quoted.finditer(source):
              code = source[cursor:match.start()]
              translated = translate_code(code)
              replacements += code != translated
              out.append(translated)
              out.append(match.group(0))
              cursor = match.end()
          tail = source[cursor:]
          translated_tail = translate_code(tail)
          replacements += tail != translated_tail
          out.append(translated_tail)
          output = ''.join(out)

          if output == source:
              raise SystemExit('Localization produced no changes')

          output_path.write_text(output, encoding='utf-8')
          print(f'Loaded {len(candidates)} localized spellings; translated source segments: {replacements}')
          PY

          python tools/check_clipboard_import.py \
            workshop/ruang_irama.it-IT.workshop --language it-IT

      - name: Write generation manifest
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path('workshop/ruang_irama.workshop')
          manifest = Path('workshop/ruang_irama.it-IT.manifest')
          manifest.write_text(
              'source_sha256=' + sha256(source.read_bytes()).hexdigest() + '\n'
              'language=it-IT\n'
              'overpy_ref=d854bf01fc7bbf3b2169f67408c07a8da8989ad6\n'
              'generator=lexical-localization-tables\n',
              encoding='utf-8',
          )
          PY

      - name: Commit generated Italian source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- workshop/ruang_irama.it-IT.workshop workshop/ruang_irama.it-IT.manifest
          git diff --cached --quiet && exit 0
          git commit -m 'Generate Italian Workshop clipboard source'
          git push origin HEAD:chatgpt/italian-workshop-clipboard
