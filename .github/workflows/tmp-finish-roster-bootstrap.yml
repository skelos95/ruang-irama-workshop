name: Temporary finish roster bootstrap validation

on:
  push:
    branches:
      - fix-roster-bootstrap-20260827

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fix stale roster bootstrap test
        run: python .github/maintenance/fix_stale_roster_bootstrap_test.py
      - name: Remove temporary staging files
        run: |
          rm .github/workflows/tmp-finish-roster-bootstrap.yml
          rm .github/maintenance/fix_stale_roster_bootstrap_test.py
          rmdir .github/maintenance 2>/dev/null || true
      - name: Commit final bootstrap staging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_runtime_maintenance.py .github
          git commit -m 'Align runtime tests with slot-only roster bootstrap'
          git push origin HEAD:fix-roster-bootstrap-20260827
      - name: Run focused roster tests
        run: |
          python -m unittest tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_roster_bootstrap_depends_only_on_persistent_slot_identity
          python -m unittest tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_registered_team_switch_never_destroys_roster_or_hides_crouch_target
      - name: Validate Workshop source
        run: python tools/validate_workshop.py
      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
