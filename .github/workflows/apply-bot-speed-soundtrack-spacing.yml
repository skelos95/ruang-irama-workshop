name: Apply bot speed and soundtrack spacing update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-bot-speed-soundtrack-spacing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Workshop and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('workshop/ruang_irama.workshop')
          report_path = Path('docs/VALIDAZIONE.md')
          src = source_path.read_text(encoding='utf-8')

          def replace_exact(text, old, new, expected=1, label='replacement'):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected}, found {count}')
              return text.replace(old, new)

          # Bot movement: keep all existing restrictions, but allow very slow movement at 10%.
          src = replace_exact(
              src,
              '\t\tSet Knockback Dealt(Event Player, 0);\n\t\tEvent Player.PahlawanBotTerakhir = Hero Of(Event Player);',
              '\t\tSet Knockback Dealt(Event Player, 0);\n\t\tSet Move Speed(Event Player, 10);\n\t\tEvent Player.PahlawanBotTerakhir = Hero Of(Event Player);',
              label='bot move speed',
          )

          # Add one blank visual line only under the current last soundtrack row.
          old_en = 'Custom String("{0} {1} - soundtrack: {2}",\n\t\t\tHero Icon String(Is Duplicating(Event Player) ? Hero Being Duplicated(Event Player) : Hero Of(Event Player)), Event Player, Event Player.IndeksGenre >= 0 ? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("no soundtrack yet"))'
          new_en = 'Custom String("{0}{1}", Custom String("{0} {1} - soundtrack: {2}",\n\t\t\tHero Icon String(Is Duplicating(Event Player) ? Hero Being Duplicated(Event Player) : Hero Of(Event Player)), Event Player, Event Player.IndeksGenre >= 0 ? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("no soundtrack yet")),\n\t\t\tEvent Player == Last Of(Sorted Array(Global.PemainManusia, Player Variable(Current Array Element, UrutanHUD))) ? Custom String("\\n ") : Custom String(""))'
          src = replace_exact(src, old_en, new_en, label='EN soundtrack bottom spacing')

          old_id = 'Custom String("{0} {1} - soundtrack: {2}", Hero Icon String(Is Duplicating(Event Player) ? Hero Being Duplicated(Event Player) : Hero Of(Event Player)), Event Player, Event Player.IndeksGenre >= 0\n\t\t\t? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("belum pilih soundtrack"))'
          new_id = 'Custom String("{0}{1}", Custom String("{0} {1} - soundtrack: {2}", Hero Icon String(Is Duplicating(Event Player) ? Hero Being Duplicated(Event Player) : Hero Of(Event Player)), Event Player, Event Player.IndeksGenre >= 0\n\t\t\t? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("belum pilih soundtrack")), Event Player == Last Of(Sorted Array(Global.PemainManusia,\n\t\t\tPlayer Variable(Current Array Element, UrutanHUD))) ? Custom String("\\n ") : Custom String(""))'
          src = replace_exact(src, old_id, new_id, label='ID soundtrack bottom spacing')

          old_th = 'Custom String("{0} {1} - เพลงประกอบ: {2}",\n\t\t\tHero Icon String(Is Duplicating(Event Player) ? Hero Being Duplicated(Event Player) : Hero Of(Event Player)), Event Player, Event Player.IndeksGenre >= 0 ? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("ยังไม่ได้เลือกเพลง"))'
          new_th = 'Custom String("{0}{1}", Custom String("{0} {1} - เพลงประกอบ: {2}",\n\t\t\tHero Icon String(Is Duplicating(Event Player) ? Hero Being Duplicated(Event Player) : Hero Of(Event Player)), Event Player, Event Player.IndeksGenre >= 0 ? Global.DaftarGenre[Event Player.IndeksGenre] : Custom String("ยังไม่ได้เลือกเพลง")),\n\t\t\tEvent Player == Last Of(Sorted Array(Global.PemainManusia, Player Variable(Current Array Element, UrutanHUD))) ? Custom String("\\n ") : Custom String(""))'
          src = replace_exact(src, old_th, new_th, label='TH soundtrack bottom spacing')

          source_path.write_text(src, encoding='utf-8')

          data = source_path.read_bytes().replace(b'\r\n', b'\n')
          blob = hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          report = report_path.read_text(encoding='utf-8')
          report, n = re.subn(r'```text\n[0-9a-f]{40}\n```', f'```text\n{blob}\n```', report, count=1)
          if n != 1:
              raise SystemExit('validation report blob marker not found')
          report_path.write_text(report, encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_workshop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop docs/VALIDAZIONE.md
          git commit -m "Slow bots and add soundtrack list spacing"
          git push origin HEAD:main
