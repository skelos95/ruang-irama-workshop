name: Tune third-person camera

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Tune third-person camera and aim alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tune camera distance, shoulder offset and aim convergence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workshop = Path('workshop/ruang_irama.workshop')
          s = workshop.read_text(encoding='utf-8')

          replacements = [
              ('Global.JarakKamera = 3.500;', 'Global.JarakKamera = 3.000;'),
              ('Global.GeserKamera = 0.850;', 'Global.GeserKamera = 1.150;'),
              ('Global.JarakBidik = 100;', 'Global.JarakBidik = 1000;'),
              ('Min(6.500, Max(Global.JarakKamera,\n\t\t\tGlobal.JarakKamera + (Max Health(Event Player.TargetKamera) - 200) * 0.006))',
               'Min(5.800, Max(Global.JarakKamera,\n\t\t\tGlobal.JarakKamera + (Max Health(Event Player.TargetKamera) - 200) * 0.0055))'),
              ('Min(6.500, Max(Global.JarakKamera, Global.JarakKamera + (Max Health(Event Player.TargetKamera) - 200)\n\t\t\t* 0.006))',
               'Min(5.800, Max(Global.JarakKamera, Global.JarakKamera + (Max Health(Event Player.TargetKamera) - 200)\n\t\t\t* 0.0055))'),
              ('"3,5 m per eroi leggeri; aumenta con Max Health fino a 6,5 m. L\'offset laterale usa il vettore sinistro rispetto alla mira."',
               '"3,0 m per eroi leggeri; aumenta con Max Health fino a 5,8 m. Offset sinistro 1,15 m e mira convergente sul raycast reale dell\'eroe."'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Pattern not found: {old}')
              s = s.replace(old, new, 1)

          old_look = '''Update Every Frame(Eye Position(\n\t\t\tEvent Player.TargetKamera) + Facing Direction Of(Event Player.TargetKamera) * Global.JarakBidik), 0);'''
          new_look = '''Update Every Frame(Ray Cast Hit Position(Eye Position(Event Player.TargetKamera),\n\t\t\tEye Position(Event Player.TargetKamera) + Facing Direction Of(Event Player.TargetKamera) * Global.JarakBidik,\n\t\t\tAll Players(All Teams), Event Player.TargetKamera, True)), 0);'''
          if old_look not in s:
              raise SystemExit('Camera look-at pattern not found')
          s = s.replace(old_look, new_look, 1)

          workshop.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          old = ('- Menu `1 - Third-Person Camera`: prima persona, terza persona sul proprio eroe o visuale di un altro player/bot. '
                 'La distanza parte da circa 3,5 m e aumenta in base alla salute massima del bersaglio fino a circa 6,5 m; la camera è spostata verso sinistra per lasciare il mirino più a destra e dare più spazio visivo all\'eroe.\n')
          new = ('- Menu `1 - Third-Person Camera`: prima persona, terza persona sul proprio eroe o visuale di un altro player/bot. '
                 'La distanza parte da circa 3,0 m e aumenta in base alla salute massima del bersaglio fino a circa 5,8 m; la camera è più spostata a sinistra e il centro schermo converge sul raycast reale della mira dell\'eroe per ridurre lo scarto tra mirino e colpi.\n')
          if old not in r:
              raise SystemExit('README camera bullet not found')
          r = r.replace(old, new, 1)
          readme.write_text(r, encoding='utf-8')

          Path('.github/workflows/tune-third-person-camera.yml').unlink()
          PY

      - name: Commit tuned camera
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop README.md .github/workflows/tune-third-person-camera.yml
          git diff --cached --check
          git commit -m "Refine third-person camera and crosshair alignment"
          git push
