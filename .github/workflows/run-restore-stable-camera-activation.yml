name: Run stable camera activation restore

on:
  push:
    paths:
      - '.github/workflows/run-restore-stable-camera-activation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable camera activation
        run: python .github/scripts/restore_stable_camera_activation.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore stable third-person camera activation"
          git push
