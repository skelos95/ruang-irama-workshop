name: Run lower wall-collision camera

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run lower wall-collision camera'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply lower wall camera
        run: python .github/scripts/lower_camera_near_walls.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop/ruang_irama.workshop .github/scripts/lower_camera_near_walls.py .github/workflows/run-lower-camera-near-walls.yml
          git diff --cached --check
          git commit -m "Lower third-person camera near walls"
          git push
