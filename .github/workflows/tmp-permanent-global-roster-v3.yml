name: Temporary permanent global roster v3 validation

on:
  push:
    branches:
      - fix-permanent-global-roster-v3-20260827

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out clean main-based staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch validated patcher source
        run: |
          git fetch origin fix-permanent-global-roster-20260827-stage4 --depth=1
          git show FETCH_HEAD:.github/maintenance/tmp_permanent_roster_v2.py > /tmp/permanent_roster_v3.py
      - name: Apply permanent global roster architecture
        run: python /tmp/permanent_roster_v3.py
      - name: Remove temporary workflow before validation
        run: rm .github/workflows/tmp-permanent-global-roster-v3.yml
      - name: Commit functional staging patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workshop/ruang_irama.it-IT.workshop tests/fixtures/semantic_reference.txt tests/test_runtime_maintenance.py .github
          git commit -m 'Make roster globally permanent and rebind identity immediately'
          git push origin HEAD:fix-permanent-global-roster-v3-20260827
      - name: Run focused permanent roster tests
        run: |
          python -m unittest \
            tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_permanent_roster_rows_live_in_global_init_and_player_rule_only_binds \
            tests.test_runtime_maintenance.RuntimeMaintenanceTests.test_team_switch_entity_adopts_reserved_slot_before_fresh_allocation
      - name: Validate Workshop source
        run: python tools/validate_workshop.py
      - name: Preflight Italian clipboard source
        run: python tools/check_clipboard_import.py workshop/ruang_irama.it-IT.workshop --language it-IT
